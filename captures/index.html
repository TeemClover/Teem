<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0a0d12"><title>Capture Library · myClover Command</title><style>:root{--bg:#0a0d12;--p:#121720;--line:#303846;--ink:#f5f1e8;--muted:#9ca6b5;--gold:#d8b45e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Noto Sans Thai",sans-serif}.shell{width:min(980px,calc(100% - 24px));margin:auto;padding:20px 0 60px}a{color:inherit}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}.brand b{display:block;letter-spacing:.12em}.brand span{color:var(--muted);font-size:12px}.links{display:flex;gap:8px}.back{text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:11px;font-size:12px}.hero{padding:34px 0 20px}.eyebrow{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.2em;margin:0 0 8px}h1{font-size:clamp(38px,7vw,64px);line-height:1;margin:0 0 12px;letter-spacing:-.04em}.hero p{color:#c5ccd7;line-height:1.65;max-width:720px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:15px}.card span{color:var(--gold);font-size:10px;font-weight:900}.card h2{font-size:16px;margin:7px 0}.card p{color:#c4cbd6;font-size:12px;line-height:1.55;margin:0}.meta{color:var(--muted);font-size:10px;margin-top:8px}.empty{padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.locked{display:grid;place-items:center;min-height:70vh;color:#8792a2}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.links{flex-direction:column}}</style></head><body><div class="shell"><header class="top"><div class="brand"><b>CAPTURE LIBRARY</b><span>myClover Empire · operation outputs</span></div><div class="links"><a class="back" href="/keen/">Keen Desk</a><a class="back" href="/command/">← Command Center</a></div></header><div id="locked" class="locked">กำลังตรวจสิทธิ์หลังบ้าน…</div><main id="content" hidden><section class="hero"><p class="eyebrow">OUTPUT MEMORY</p><h1>ของที่สร้างแล้ว<br>ต้องหาเจอ</h1><p>ใช้ Operation เป็นแกนกลางในการตาม output: รู้ว่าอะไรถูกผลิตจากคำสั่งไหน ใครรับงาน และตอนนี้อยู่ Review หรือ Live</p></section><div class="grid" id="grid"><div class="empty">กำลังอ่าน Operations…</div></div></main></div><script>const AUTH='/api/backoffice-auth',API='/api/command',grid=document.getElementById('grid'),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function gate(){location.replace('/command/?return='+encodeURIComponent(location.pathname+location.search))}async function load(){try{const r=await fetch(API,{cache:'no-store'}),j=await r.json();if(r.status===401){gate();return}if(!r.ok||!j.ok)throw new Error(j.error||'LOAD_FAILED');const ops=j.operations.recent.filter(x=>x.output||x.status==='LIVE'||x.status==='REVIEW');if(!ops.length){grid.innerHTML='<div class="empty">ยังไม่มี output ใน Operation ล่าสุด</div>';return}grid.innerHTML=ops.map(o=>`<article class="card"><span>${esc(o.mode)} · ${esc(o.status)}</span><h2>${esc(o.project)}</h2><p>${esc(o.output||'Operation นี้ยังไม่ได้ระบุ expected output')}</p><div class="meta">${esc(o.id)} · ${esc(o.owner||'unassigned')}</div></article>`).join('')}catch(e){grid.innerHTML='<div class="empty">โหลดไม่สำเร็จ: '+esc(e.message)+'</div>'}}async function boot(){try{const r=await fetch(AUTH,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.authenticated){gate();return}document.getElementById('locked').hidden=true;document.getElementById('content').hidden=false;load()}catch{gate()}}boot();</script></body></html>
