<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
  <title>TeamBook Admin</title>
  <link rel="icon" href="/assets/brand/teambook-logo.png">
  <link rel="stylesheet" href="./admin.css">
<script type="module" src="/_shared/language.js?v=20260819-challenge3"></script>
</head>
<body>
  <main class="admin-shell">
    <section class="login-card" id="loginView">
      <img src="/assets/brand/teambook-logo.png" alt="TeamBook" width="72" height="72">
      <p class="eyebrow">INTERNAL · READ ONLY</p>
      <h1>TeamBook Admin</h1>
      <form id="loginForm">
        <label for="password">รหัสผ่าน</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">เข้า Admin</button>
        <p class="form-status" id="loginStatus" role="status"></p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <header class="admin-header">
        <div class="brand">
          <img src="/assets/brand/teambook-logo.png" alt="" width="48" height="48">
          <div><p class="eyebrow">INTERNAL · READ ONLY</p><h1>TeamBook Admin</h1></div>
        </div>
        <div class="header-actions">
          <button class="secondary" id="refreshButton" type="button">Refresh</button>
          <button class="quiet" id="logoutButton" type="button">ออกจาก Admin</button>
        </div>
      </header>

      <div class="status-line">
        <span id="lastUpdated">Last updated: —</span>
        <label>ช่วงเวลา
          <select id="rangeSelect">
            <option value="today">Today</option>
            <option value="7d">7 Days</option>
            <option value="30d">30 Days</option>
            <option value="all">All Time</option>
          </select>
        </label>
      </div>

      <nav class="tabs" aria-label="Admin sections">
        <button type="button" data-tab="overview" aria-selected="true">Overview</button>
        <button type="button" data-tab="parties">Parties</button>
        <button type="button" data-tab="users">Users</button>
        <button type="button" data-tab="cards">Cards</button>
        <button type="button" data-tab="system">System</button>
        <button type="button" data-tab="events">Events</button>
        <button type="button" data-tab="ghosts">Ghosts</button>
      </nav>

      <p class="page-status" id="pageStatus" role="status"></p>
      <section class="tab-panel" id="panel-overview" data-panel="overview"></section>
      <section class="tab-panel" id="panel-parties" data-panel="parties" hidden></section>
      <section class="tab-panel" id="panel-users" data-panel="users" hidden></section>
      <section class="tab-panel" id="panel-cards" data-panel="cards" hidden></section>
      <section class="tab-panel" id="panel-system" data-panel="system" hidden></section>
      <section class="tab-panel" id="panel-events" data-panel="events" hidden></section>
      <section class="tab-panel" id="panel-ghosts" data-panel="ghosts" hidden></section>
    </section>
  </main>

  <dialog id="partyDialog">
    <div class="dialog-head"><h2 id="partyDialogTitle">สมุด</h2><button type="button" id="closeDialog" aria-label="ปิด">×</button></div>
    <div id="partyDialogBody"></div>
  </dialog>
  <script src="./gate-shim.js"></script>
  <script type="module" src="./admin.js"></script>
  <script type="module" src="./admin-seen-copy-v13.js?v=20260823-seen1"></script>
</body>
</html>
