  .join-page{width:min(100%,640px)}
  .join-page>.kicker{margin-bottom:6px}.join-page>.title{margin:0}.join-page>.lede{margin:8px 0 18px}
  .join-card{padding:clamp(18px,5vw,26px)}
  .join-preview{margin:16px 0;padding:16px;border:1px solid rgba(85,181,106,.38);border-radius:16px;background:#f2fbef}
  .join-preview span{color:var(--xty-muted);font:850 10px/1.3 var(--sans);letter-spacing:.1em}

<script>
(() => {
  const value = new URLSearchParams(location.search).get('c');
  const code = /^\d{5}$/.test(value || '') ? value : '';

  let hasLocalProfile = false;
  let hasMembership = false;
  let hasSeenWelcome = false;
  try {
    hasLocalProfile = !!localStorage.getItem('teambook_profile_v1');
    hasSeenWelcome = !!localStorage.getItem('teambook_welcome_seen_v1');
    if (code) {
      const tokens = JSON.parse(localStorage.getItem('teambook_book_tokens_v1') || '{}');
      const membership = tokens && typeof tokens === 'object' ? tokens[code] : null;
      hasMembership = typeof membership === 'string'
        ? membership.length > 0
        : !!(membership && membership.token);
    }
  } catch {}

  /* Every invited person sees the same first welcome once. Route through
     the TeamBook room before Join, while preserving the invitation code. */
  if (!hasSeenWelcome) {
    location.replace(code ? `/?c=${encodeURIComponent(code)}` : '/');
    return;
  }

  /* An invite link doubles as a bookmark. If this browser has already
     joined the same party, skip Join entirely and reopen the party. */
  if (hasLocalProfile && code && hasMembership) {
    location.replace(`/p/?c=${encodeURIComponent(code)}`);
    return;
  }

  if (hasLocalProfile) return;
  location.replace(code ? `/?c=${encodeURIComponent(code)}` : '/');
})();
</script>

<body>

<header class="top">
  <a class="mark" href="/"><img src="/assets/brand/teambook-logo.png" alt="TeamBook"></a>
  <a class="back" href="/">ยกเลิก</a>
</header>

<main class="wrap join-page">
  <p class="kicker">เข้าร่วมสมุด</p>
  <h1 class="title">เข้าร่วมสมุด</h1>
  <p class="lede">ใส่รหัสที่เพื่อนส่งมา</p>

  <div class="card join-card">
    <div class="field" id="codeField" style="margin-top:0">
      <label for="code">รหัสสมุด</label>
      <input id="code" type="text" inputmode="numeric" maxlength="5" placeholder="00427"
             autocomplete="one-time-code" spellcheck="false"
             style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;font-size:19px">
    </div>
    <div class="join-preview" id="bookPreview" hidden>
      <span>สมุดที่กำลังจะเข้าร่วม</span>
      <h2 id="bookName"></h2>
      <p id="bookMeta"></p>
    </div>

    <div class="field join-requirement" id="sharedActivityField" hidden>
      <span class="label">กิจกรรม</span>
      <p class="shared-activity" id="sharedActivityName"></p>
    </div>

    <div class="field" id="ownActivityField" hidden>
      <label>เลือกกิจกรรมของคุณ</label>
      <div id="ownActivityPick"></div>
    </div>

    <details class="join-options">
      <summary>เปลี่ยนตัวละครในสมุดนี้</summary>
      <div class="field">
        <div id="avatarPick" role="radiogroup" aria-label="เลือกตัวละครหรือการ์ดประจำสมุด"></div>
        <div id="frameField">
          <p class="label" style="margin:14px 0 8px">สีกรอบ</p>
          <div class="color-row" id="framePick" role="radiogroup" aria-label="เลือกสีตัวละครประจำสมุด"></div>
        </div>
        <p class="hint" id="avatarHint">เปลี่ยนเฉพาะสมุดนี้ได้</p>
      </div>
    </details>

    <button class="btn gold" id="go" style="margin-top:18px" disabled>เข้าร่วมเลย</button>
    <p class="hint" id="err" style="margin-top:12px;color:var(--gold-soft)" hidden></p>
  </div>
</main>

<script type="module">
import { hasProfile, getProfile } from '/_shared/store.js';
import { joinPartyV2 } from '/_shared/join-party-v2.js';
import { AVATAR_FRAMES } from '/_shared/avatars.js';
import { mountCardPicker } from '/_shared/card-picker.js';
import { SHARED, INDIVIDUAL, normalizeMode } from '/_shared/book-mode.js';
import { mountActivityPicker } from '/_shared/activity-picker.js';

const $ = id => document.getElementById(id);
const rawPrefill = new URLSearchParams(location.search).get('c');
const prefill = /^\d{5}$/.test(rawPrefill || '') ? rawPrefill : '';

if (!hasProfile()) {
  location.replace(prefill ? `/?c=${encodeURIComponent(prefill)}` : '/');
} else {
  fetch('/api/health', { credentials: 'same-origin', cache: 'no-store' }).catch(() => {});
  initJoin(prefill);
}

function initJoin(initialCode) {
  const input = $('code'), go = $('go'), err = $('err');

  /* Keep leading zeroes: the invite code is exactly five numeric digits. */
  input.addEventListener('input', () => {
    const v = input.value.replace(/\D/g, '').slice(0, 5);
    input.value = v;
    err.hidden = true;
    if (v.length === 5) peek(v); else forget();
    syncReady();
  });

  /* What this book asks of a joiner depends on how it is played, and that
     is not knowable from a five-digit code alone — so the page looks the
     book up as soon as the code is complete, then shows one branch or the
     other. Until it knows, it asks nothing and stays out of the way. */
  let bookMode = null;
  let ownActivity = { complete: false };
  let peeked = '';
  let ownPicker = null;

  function forget() {
    bookMode = null;
    peeked = '';
    $('codeField').hidden = false;
    $('bookPreview').hidden = true;
    $('sharedActivityField').hidden = true;
    $('ownActivityField').hidden = true;
  }

  async function peek(code) {
    if (peeked === code) return;
    peeked = code;
    try {
      const res = await fetch(`/api/teambook/party/${encodeURIComponent(code)}`, { headers: { accept: 'application/json' } });
      const data = await res.json();
      if (peeked !== code) return;             // the code moved on while we waited
      if (!data.ok || !data.party) {
        forget();
        err.textContent = 'ไม่เจอสมุดรหัสนี้ ลองเช็กรหัสอีกครั้ง';
        err.hidden = false;
        syncReady();
        return;
      }
      bookMode = normalizeMode(data.party.activityMode);
      if (initialCode === code) $('codeField').hidden = true;
      $('bookName').textContent = data.party.name || 'สมุดของเรา';
      $('bookMeta').textContent = `${Number(data.party.durationDays || 7)} วัน`;
      $('bookPreview').hidden = false;
      if (bookMode === SHARED) {
        $('sharedActivityField').hidden = false;
        $('ownActivityField').hidden = true;
        $('sharedActivityName').textContent = data.party.sharedActivityLabel || data.party.activity || 'ยังไม่ระบุกิจกรรม';
      } else {
        $('sharedActivityField').hidden = true;
        $('ownActivityField').hidden = false;
        if (!ownPicker) {
          ownPicker = mountActivityPicker($('ownActivityPick'), {
            onChange: value => { ownActivity = value; syncReady(); },
          });
        }
      }
      syncReady();
    } catch (error) {
      forget();
      err.textContent = 'ยังอ่านข้อมูลสมุดไม่สำเร็จ · เช็กเน็ตแล้วลองอีกครั้ง';
      err.hidden = false;
      syncReady();
    }
  }

  function syncReady() {
    const codeReady = input.value.length === 5;
    const modeReady = bookMode === SHARED || bookMode === INDIVIDUAL;
    const activityReady = bookMode !== INDIVIDUAL || ownActivity.complete;
    go.disabled = !codeReady || !modeReady || !activityReady;
  }

  /* Deliberately after the state above: replaying the input event is what
     kicks off the peek, and the peek writes to bindings declared here. */
  if (initialCode) {
    input.value = initialCode;
    input.dispatchEvent(new Event('input'));
  }

  const profile = getProfile();
  const defaultCardId = profile.equippedCardId || null;
  let partyAvatar = defaultCardId || profile.avatarId;
  let partyAvatarColor = profile.avatarFrame || 'green';

  function syncAvatarMode(kind) {
    const usingCard = kind === 'card';
    $('frameField').hidden = usingCard;
    $('avatarHint').textContent = usingCard
      ? 'การ์ดใช้สีของการ์ดเอง'
      : 'เปลี่ยนเฉพาะสมุดนี้ได้';
  }

  mountCardPicker($('avatarPick'), {
    mode: 'avatar',
    selected: defaultCardId ? { cardId: defaultCardId } : { avatarId: profile.avatarId },
    onSelect(choice) {
      if (choice.kind === 'card') partyAvatar = choice.cardId;
      else partyAvatar = choice.avatarId;
      syncAvatarMode(choice.kind);
    },
  });
  syncAvatarMode(defaultCardId ? 'card' : 'starter');

  Object.values(AVATAR_FRAMES).forEach(frame => {
    const button = document.createElement('button'); button.type = 'button';
    button.className = 'color-choice' + (frame.id === partyAvatarColor ? ' picked' : '');
    button.style.setProperty('--swatch', frame.hex); button.setAttribute('role', 'radio');
    button.setAttribute('aria-checked', frame.id === partyAvatarColor ? 'true' : 'false');
    button.innerHTML = `<span></span><b>${frame.labelTh}</b>`;
    button.addEventListener('click', () => {
      partyAvatarColor = frame.id;
      $('framePick').querySelectorAll('button').forEach(node => {
        const on = node === button; node.classList.toggle('picked', on); node.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
    $('framePick').appendChild(button);
  });

  go.addEventListener('click', async () => {
    go.disabled = true;
    go.classList.add('is-loading');
    go.innerHTML = '<span class="tb-spinner" aria-hidden="true"></span><span>กำลังเขียนชื่อคุณลงสมุด</span><span class="tb-loading-dots" aria-hidden="true"></span>';
    const p = getProfile();
    const res = await joinPartyV2(input.value, {
      alias: p.alias, avatar: partyAvatar, avatarColor: partyAvatarColor,
      ...(bookMode === INDIVIDUAL ? {
        activityId: ownActivity.activityId,
        activityLabel: ownActivity.label,
        activityDescription: ownActivity.description,
        activityColor: ownActivity.color,
        successRule: ownActivity.successRule || 'ทำสิ่งที่ตั้งใจไว้แล้ว',
      } : { successRule: 'ทำสิ่งที่ตั้งใจไว้แล้ว' }),
    });
    if (res.error === 'NOT_FOUND') {
      err.textContent = 'ไม่เจอสมุดรหัสนี้ ลองเช็กรหัสอีกครั้ง';
      err.hidden = false;
      go.disabled = false;
      go.classList.remove('is-loading');
      go.textContent = 'เข้าร่วมเลย';
      return;
    }
    if (res.error === 'FULL') {
      err.textContent = `สมุดนี้เต็มแล้ว (รับได้ไม่เกิน ${Number(res.memberLimit) || 11} คน)`;
      err.hidden = false;
      go.disabled = false;
      go.classList.remove('is-loading');
      go.textContent = 'เข้าร่วมเลย';
      return;
    }
    if (res.error === 'PARTY_CLOSED') {
      err.textContent = 'สมุดนี้จบแล้วและไม่รับสมาชิกเพิ่ม';
      err.hidden = false;
      go.disabled = false;
      go.classList.remove('is-loading');
      go.textContent = 'เข้าร่วมเลย';
      return;
    }
    if (res.error === 'MEMBERSHIP_CLOSED') {
      err.textContent = 'ช่วงการร่วมทางของคุณในสมุดนี้ถูกปิดแล้ว';
      err.hidden = false;
      go.disabled = false;
      go.classList.remove('is-loading');
      go.textContent = 'เข้าร่วมเลย';
      return;
    }
    if (res.error === 'ACTIVITY_REQUIRED') {
      err.textContent = 'เล่มนี้ต่างคนต่างทำ — เลือกกิจกรรมของคุณก่อนเข้าร่วม';
      err.hidden = false;
      go.disabled = false;
      go.classList.remove('is-loading');
      go.textContent = 'เข้าร่วมเลย';
      return;
    }
    if (res.error === 'JOINED_PARTY_LIMIT') {
      err.textContent = 'ช่องเข้าร่วมสมุดเต็มแล้ว — เข้าร่วมพร้อมกันได้ไม่เกิน 3 สมุด';
      err.hidden = false;
      go.disabled = false;
      go.classList.remove('is-loading');
      go.textContent = 'เข้าร่วมเลย';
      return;
    }
    if (res.error) {
      err.textContent = 'เข้าร่วมสมุดไม่สำเร็จ — เช็กเน็ตแล้วลองใหม่';
      err.hidden = false;
      go.disabled = false;
      go.classList.remove('is-loading');
      go.textContent = 'เข้าร่วมเลย';
      return;
    }
    location.href = `/p/?c=${encodeURIComponent(res.party?.code || res.code || input.value)}`;
  });

  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !go.disabled) go.click(); });
}
</script>
