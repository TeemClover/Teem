<body>
<header class="top"><a class="mark" href="/"><img src="/assets/brand/teambook-logo.png" alt="TeamBook"></a><a class="back" href="/">กลับ Home</a></header>
<main class="wrap">
  <p class="kicker">สมุดสาธารณะ</p>
  <h1 class="title">หาสมุดที่อยากลงมือทำด้วยกัน</h1>
  <p class="lede">เปิดดูรายละเอียดและอ่าน เรื่องในสมุด ย้อนหลังก่อนได้ แล้วค่อยตัดสินใจว่าจะเข้าร่วมไหม</p>
  <div class="public-filters">
    <label class="public-filter-toggle">
      <input type="checkbox" id="hideFull">
      <span class="public-filter-switch" aria-hidden="true"></span>
      <span>ซ่อนสมุดที่เต็มแล้ว</span>
    </label>
  </div>
  <div class="public-list" id="list"><div class="empty">กำลังเปิดสมุดสาธารณะ…</div></div>
  <button class="btn ghost" id="more" hidden>ดูเพิ่ม</button>
  <p class="note">สมุดสาธารณะเปิดให้อ่านเฉพาะข้อมูลในสมุดและ เรื่องในสมุด · Email, token และข้อมูลบัญชีไม่ถูกเปิดเผย</p>
</main>

<script type="module">
import { bookActivityLine } from '/_shared/book-mode.js';
import { avatarById } from '/_shared/avatars.js';
import { cardById } from '/_shared/cards.js';
import { cardMarkup } from '/_shared/card-ui.js';

const $ = id => document.getElementById(id);
const HIDE_FULL_KEY = 'teambook_public_hide_full';
let cursor = null;
let loadedParties = [];
const esc = value => String(value || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function readHideFull() {
  try {
    const saved = localStorage.getItem(HIDE_FULL_KEY);
    return saved === null ? false : saved === '1';
  } catch { return false; }
}

function saveHideFull(value) {
  try { localStorage.setItem(HIDE_FULL_KEY, value ? '1' : '0'); } catch {}
}

function isFull(party) {
  const members = Number(party.memberCount || 0);
  const max = Number(party.maxMembers || 0);
  return max > 0 && members >= max;
}

function coverMarkup(party) {
  const card = cardById(party.coverValue);
  if (card) return cardMarkup(card);
  if (party.coverType === 'card_back') return '<div class="animal-card card-back"><span class="back-mark">TB</span><small>CARD BACK</small></div>';
  let snapshot = { species: party.lead.avatar, color: party.lead.avatarColor };
  try { snapshot = { ...snapshot, ...JSON.parse(party.coverValue || '{}') }; } catch {}
  const avatar = avatarById(snapshot.species);
  return `<div class="avatar-cover" data-color="${esc(snapshot.color || 'green')}" aria-label="Starter · ${esc(avatar.nameTh)}"><img src="${avatar.art}" alt=""></div>`;
}

function partyMarkup(party) {
  const mode = party.verificationMode === 'confirm' ? 'ต้อง เห็นแล้ว' : 'เชื่อใจกัน';
  const full = isFull(party);
  const availability = full ? `${party.memberCount}/${party.maxMembers} · เต็มแล้ว · กำลังเขียน` : `เปิดรับ · ${party.memberCount}/${party.maxMembers}`;
  return `${coverMarkup(party)}<div><span class="status-pill">${availability}</span><span class="status-pill" style="margin-left:6px">${mode}</span><h2>${esc(party.name)}</h2>`
    + `<p>${esc(bookActivityLine(party, 'กิจกรรมที่ตกลงกันในสมุด'))}</p>`
    + `<p class="whisper">DAY ${party.day} / ${party.durationDays} · วันนี้ลงชื่อ ${party.todayCommitCount} คน</p>`
    + `<p class="whisper">Lead: ${esc(party.lead.alias)}</p>`
    + `<a class="btn ghost sm" href="/public/p/?c=${encodeURIComponent(party.code)}">${full ? 'เต็มแล้ว · แวะดูได้' : 'ดูรายละเอียด · อ่าน เรื่องในสมุด'}</a>`
    + '</div>';
}

function renderParties() {
  const list = $('list');
  const hideFull = $('hideFull').checked;
  const visible = hideFull ? loadedParties.filter(party => !isFull(party)) : loadedParties;
  list.innerHTML = '';

  visible.forEach(party => {
    const article = document.createElement('article');
    article.className = 'card public-party';
    article.innerHTML = partyMarkup(party);
    list.appendChild(article);
  });

  if (list.children.length) return;
  const hiddenCount = hideFull ? loadedParties.filter(isFull).length : 0;
  if (hiddenCount && cursor) {
    list.innerHTML = '<div class="empty">สมุดที่โหลดมาตอนนี้เต็มแล้วและถูกซ่อนอยู่ · กดดูเพิ่มเพื่อหาสมุดที่ยังมีที่ว่าง</div>';
  } else if (hiddenCount) {
    list.innerHTML = '<div class="empty">ตอนนี้สมุดสาธารณะที่พบเต็มแล้ว · ปิดตัวกรองเพื่อดูสมุดทั้งหมดได้</div>';
  } else {
    list.innerHTML = '<div class="empty">ยังไม่มีสมุดสาธารณะตอนนี้</div>';
  }
}

async function load({ append = false } = {}) {
  $('more').disabled = true;
  const url = new URL('/api/teambook-public-list-v13', location.origin);
  if (cursor) url.searchParams.set('cursor', cursor);
  try {
    const response = await fetch(url, { headers: { accept: 'application/json' }, credentials: 'same-origin' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'HTTP');
    loadedParties = append ? [...loadedParties, ...data.parties] : [...data.parties];
    loadedParties.sort((a, b) => Number(isFull(a)) - Number(isFull(b)));
    cursor = data.nextCursor;
    renderParties();
    $('more').hidden = !cursor;
  } catch {
    if (!append) $('list').innerHTML = '<div class="empty">ยังเปิด Lobby ไม่สำเร็จ · ลองใหม่อีกครั้ง</div>';
  }
  $('more').disabled = false;
}

$('hideFull').checked = readHideFull();
$('hideFull').addEventListener('change', event => {
  saveHideFull(event.target.checked);
  renderParties();
});
$('more').addEventListener('click', () => load({ append: true }));
load();
</script>
