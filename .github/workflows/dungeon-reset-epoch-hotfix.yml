name: Dungeon reset epoch hotfix
on:
  push:
    paths:
      - '.github/workflows/dungeon-reset-epoch-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch all Dungeon reset paths
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              assert n>=count, f'{path}: expected {count}, found {n}: {old[:80]}'
              s=s.replace(old,new,count)
              p.write_text(s)

          # Every legacy/current reset writer must invoke the server-side reset contract.
          rep('assets/notebook-boss-reset-v2.js',
              "body:JSON.stringify({progress:resetPayload()})",
              "body:JSON.stringify({resetScope:'dungeon',progress:resetPayload()})")
          rep('assets/awaken-savepoint-v2.js',
              "body:JSON.stringify({progress}),",
              "body:JSON.stringify({resetScope:'dungeon',progress}),")
          rep('assets/awaken-hard-reset-v1.js',
              "body:JSON.stringify({progress})",
              "body:JSON.stringify({resetScope:'dungeon',progress})")

          # Account sync must never resurrect run-state from the older side of a reset epoch.
          p=Path('assets/account.js'); s=p.read_text()
          old="""export function mergeIntoDevice(cloud) {
  const local = localProgress();
  const keys = new Set([...Object.keys(cloud || {}), ...Object.keys(local)]);
  const merged = {};
  for (const key of keys) {
    if (!allowedKey(key)) continue;
    merged[key] = mergeValue(key, cloud && cloud[key], local[key]);
    storageSet(key, merged[key]);
  }
  return merged;
}"""
          new="""const DUNGEON_SYNC_KEEP = new Set([
  'mc_awaken_reset_epoch','mc_awaken_reset_pending','mc_awaken_reset_count','mc_awaken_current_run_epoch',
  'mc_mini_achievements_v1','mc_dungeon_cleared_v1','mc_dungeon_awakened_v1',
  'mc_nb_seen_ever_v1','mc_nb_restored_ever_v1','mc_secret_end_ever_v1','mc_titles'
]);
function dungeonRunProgressKey(key) {
  if (!key || DUNGEON_SYNC_KEEP.has(key)) return false;
  return key === 'mc_dungeon_state_v2' || key === 'mc_secret_end' ||
    key === 'mc_dungeon_reset_requested' || key === 'mc_dungeon_reset_v1' ||
    key === 'mc_platinum_trophy' || key.startsWith('mc_nb_') ||
    key.startsWith('mc_ch7_') || key.startsWith('mc_awaken_');
}
function progressEpoch(progress) {
  const n = Number(progress && progress.mc_awaken_reset_epoch || 0);
  return Number.isFinite(n) ? n : 0;
}
export function mergeIntoDevice(cloud) {
  const local = localProgress();
  const cloudEpoch = progressEpoch(cloud), localEpoch = progressEpoch(local);
  const keys = new Set([...Object.keys(cloud || {}), ...Object.keys(local)]);
  const merged = {};
  for (const key of keys) {
    if (!allowedKey(key)) continue;
    if (dungeonRunProgressKey(key) && localEpoch !== cloudEpoch) {
      const source = localEpoch > cloudEpoch ? local : (cloud || {});
      const value = source[key];
      if (value === undefined) {
        try { localStorage.removeItem(key); } catch { /* private mode */ }
        continue;
      }
      merged[key] = value;
      storageSet(key, value);
      continue;
    }
    merged[key] = mergeValue(key, cloud && cloud[key], local[key]);
    storageSet(key, merged[key]);
  }
  return merged;
}"""
          assert old in s, 'assets/account.js mergeIntoDevice block not found'
          p.write_text(s.replace(old,new,1))

          # Server merge also treats a newer reset epoch as a tombstone boundary.
          p=Path('functions/api/progress.js'); s=p.read_text()
          old="""export function mergeProgress(cloud, incoming) {
  const left = safeProgress(cloud), right = safeProgress(incoming), merged = { ...left };
  for (const key of Object.keys(right)) merged[key] = mergeValue(key, left[key], right[key]);
  return merged;
}"""
          new="""const DUNGEON_SYNC_KEEP = new Set([
  'mc_awaken_reset_epoch','mc_awaken_reset_pending','mc_awaken_reset_count','mc_awaken_current_run_epoch',
  'mc_mini_achievements_v1','mc_dungeon_cleared_v1','mc_dungeon_awakened_v1',
  'mc_nb_seen_ever_v1','mc_nb_restored_ever_v1','mc_secret_end_ever_v1','mc_titles'
]);
function dungeonRunProgressKey(key) {
  if (!key || DUNGEON_SYNC_KEEP.has(key)) return false;
  return key === 'mc_dungeon_state_v2' || key === 'mc_secret_end' ||
    key === 'mc_dungeon_reset_requested' || key === 'mc_dungeon_reset_v1' ||
    key === 'mc_platinum_trophy' || key.startsWith('mc_nb_') ||
    key.startsWith('mc_ch7_') || key.startsWith('mc_awaken_');
}
function progressEpoch(progress) {
  const n = Number(progress && progress.mc_awaken_reset_epoch || 0);
  return Number.isFinite(n) ? n : 0;
}
export function mergeProgress(cloud, incoming) {
  const left = safeProgress(cloud), right = safeProgress(incoming), merged = { ...left };
  const cloudEpoch = progressEpoch(left), incomingEpoch = progressEpoch(right);
  if (incomingEpoch > cloudEpoch) {
    for (const key of Object.keys(merged)) if (dungeonRunProgressKey(key)) delete merged[key];
  }
  for (const key of Object.keys(right)) {
    if (dungeonRunProgressKey(key) && cloudEpoch > incomingEpoch) continue;
    merged[key] = mergeValue(key, left[key], right[key]);
  }
  return merged;
}"""
          assert old in s, 'functions/api/progress.js mergeProgress block not found'
          p.write_text(s.replace(old,new,1))

          # The notebook's inline Reset button must create a new epoch too.
          p=Path('classroom/awaken/notebook/index.html'); s=p.read_text()
          old="async function resetDungeon(){preserve();const keep=new Set("
          new="async function resetDungeon(){preserve();const resetEpoch=Date.now();const keep=new Set("
          assert old in s, 'notebook inline reset start not found'
          s=s.replace(old,new,1)
          old="kill.forEach(k=>localStorage.removeItem(k));wr('mc_dungeon_reset_count',String(Number(rd('mc_dungeon_reset_count','0'))+1));mini('dungeon-reset')"
          new="kill.forEach(k=>localStorage.removeItem(k));wr('mc_awaken_reset_epoch',String(resetEpoch));wr('mc_awaken_reset_pending','1');wr('mc_awaken_current_run_epoch',String(resetEpoch));wr('mc_dungeon_reset_count',String(Number(rd('mc_dungeon_reset_count','0'))+1));mini('dungeon-reset')"
          assert old in s, 'notebook inline reset state block not found'
          s=s.replace(old,new,1)
          old="'mc_titles','mc_dungeon_reset_count'].forEach"
          new="'mc_titles','mc_dungeon_reset_count','mc_awaken_reset_epoch','mc_awaken_current_run_epoch'].forEach"
          assert old in s, 'notebook inline reset payload list not found'
          s=s.replace(old,new,1)
          p.write_text(s)

      - name: Verify hotfix
        shell: bash
        run: |
          grep -q "resetScope:'dungeon',progress:resetPayload" assets/notebook-boss-reset-v2.js
          grep -q "resetScope:'dungeon',progress" assets/awaken-savepoint-v2.js
          grep -q "resetScope:'dungeon',progress" assets/awaken-hard-reset-v1.js
          grep -q 'dungeonRunProgressKey' assets/account.js
          grep -q 'incomingEpoch > cloudEpoch' functions/api/progress.js
          grep -q "mc_awaken_reset_pending','1'" classroom/awaken/notebook/index.html
      - name: Commit hotfix and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/dungeon-reset-epoch-hotfix.yml
          git add assets/account.js assets/notebook-boss-reset-v2.js assets/awaken-savepoint-v2.js assets/awaken-hard-reset-v1.js functions/api/progress.js classroom/awaken/notebook/index.html
          git commit -m "Make Dungeon reset authoritative across cloud sync"
          git push origin HEAD:main
