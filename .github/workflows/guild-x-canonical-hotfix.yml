name: Lesson 4 one-time source UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guild-x-canonical-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch lesson 4 source chooser
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('classroom/notebooklm.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = '.note{margin-top:16px;padding:16px 20px;border:1px solid rgb(190 148 66/.35);border-radius:14px;background:rgb(190 148 66/.1);font-size:14.5px}.note.g{border-color:rgb(27 106 66/.25);background:rgb(27 106 66/.06)}.note.r{border-color:rgb(170 66 48/.28);background:rgb(170 66 48/.07)}'
          css_extra = '''\n.source-choice-note{margin:0 0 14px}.source-sample-card .getsrc{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}.source-sample-card .btn{width:100%;min-height:42px;padding:10px 12px}.source-sample-card .msg{margin-top:8px}.source-sample-card .hint{margin-top:7px}.life-md-alert{margin:12px 0;padding:13px 15px;border:2px solid #c93434;border-radius:13px;background:#fff1f1;color:#7d1717;box-shadow:0 7px 20px rgba(153,25,25,.08)}.life-md-alert strong{display:block;font-family:"Bai Jamjuree",sans-serif;font-size:15px;color:#a31717}.life-md-alert span{display:block;margin-top:2px;font-size:13px;line-height:1.6}.life-md-alert code{background:rgba(163,23,23,.08);padding:1px 5px;border-radius:5px}'''
          if css_anchor not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(css_anchor, css_anchor + css_extra, 1)

          old_source = '''<div class="grid3"><article class="card"><span class="tag">ทาง A · ดีที่สุด</span><h3>ใช้ซอสของตัวเอง</h3><p>หยิบซอสจากบท 1 ที่ผ่านการชิมในบท 2 แล้ว งานที่แตกออกมาจะมีตัวตนของคุณจริงที่สุด</p></article><article class="card"><span class="tag">ทาง B · เร็วที่สุด</span><h3>วางเป็น Copied text</h3><p>ใช้เมื่อแอปหรืออุปกรณ์ไม่รับ <code>.md</code> ก๊อปข้อความทั้งก้อนแล้ววางแทนได้</p></article><article class="card hi"><span class="tag">ทาง C · ลองก่อน</span><h3>ใช้ซอสต้นฉบับเดิม</h3><p>ไฟล์ myclover / GLHF / GrowthOS ตัวเดิมที่สร้างภาพและสไลด์ตัวอย่างด้านล่าง</p></article></div>
<div class="getsrc"><a class="btn" href="lv4/myclover_GLHF_7C_GrowthOS_Source.md" download>⬇️ ดาวน์โหลดซอส (.md)</a><button class="btn alt" type="button" id="copySrc">📋 คัดลอกทั้งไฟล์</button><a class="btn alt" href="lv4/myclover_GLHF_7C_GrowthOS_Source.md" target="_blank" rel="noopener">👀 เปิดอ่าน</a></div><p class="msg" id="srcMsg" role="status" aria-live="polite"></p><p class="hint">ดาวน์โหลดไม่ได้หรือแอปไม่รับ <code>.md</code> ไม่เป็นไร กดคัดลอกแล้วเลือก <b>Copied text</b> ได้เลย</p>'''
          new_source = '''<div class="note g source-choice-note"><b>เลือกซอสได้ 2 แบบ</b><br>ใช้ซอสตัวเองจากบทที่ 1 หรือจะใช้ซอสตัวอย่างที่มีให้ในบทแทนก็ได้</div>
<div class="grid3"><article class="card"><span class="tag">ทาง A · ของคุณเอง</span><h3>ใช้ซอสตัวเองจากบทที่ 1</h3><p>หยิบซอสที่สร้างไว้ในบท 1 มาใช้ต่อได้เลย ถ้าผ่านการชิมในบท 2 แล้ว งานที่แตกออกมาจะยิ่งคงตัวตนและข้อมูลของคุณได้ดี</p></article><article class="card"><span class="tag">ทาง B · แอปไม่รับ .md</span><h3>วางเป็น Copied text</h3><p>ถ้า AI หรืออุปกรณ์ไม่รับไฟล์ <code>.md</code> ให้คัดลอกข้อความทั้งไฟล์แล้ววางแทนได้ เนื้อหาซอสยังเป็นขวดเดิม</p></article><article class="card hi source-sample-card"><span class="tag">ทาง C · ใช้ตัวอย่างได้เลย</span><h3>🧴 ซอสตัวอย่างของบทนี้ (.md)</h3><p>ไฟล์ myclover / GLHF / GrowthOS ที่ใช้สร้างหลักสูตรนี้ขึ้นมา และใช้ทำภาพกับสไลด์ตัวอย่างด้านล่าง</p><div class="getsrc"><a class="btn" href="lv4/myclover_GLHF_7C_GrowthOS_Source.md" download>⬇️ ดาวน์โหลดซอส (.md)</a><button class="btn alt" type="button" id="copySrc">📋 คัดลอกทั้งไฟล์</button><a class="btn alt" href="lv4/myclover_GLHF_7C_GrowthOS_Source.md" target="_blank" rel="noopener">👀 เปิดอ่าน</a></div><p class="msg" id="srcMsg" role="status" aria-live="polite"></p><p class="hint">ดาวน์โหลดไม่ได้หรือแอปไม่รับ <code>.md</code> ไม่เป็นไร กดคัดลอกแล้วเลือก <b>Copied text</b> ได้เลย</p></article></div>'''
          if old_source not in text:
              raise SystemExit('Source chooser block not found')
          text = text.replace(old_source, new_source, 1)

          old_prompt = '''<details class="prompt-library"><summary>🧂 ใช้ AI ตัวอื่นอยู่?</summary><div class="prompt-library__body">
<div class="note g">เลือก Prompt ด้านล่าง กดคัดลอก แล้ววางในช่องคำสั่งเพิ่มเติมได้เลย</div>'''
          new_prompt = '''<details class="prompt-library"><summary>🧂 ใช้ AI ตัวอื่นอยู่?</summary><div class="prompt-library__body">
<div class="life-md-alert"><strong>อย่าลืมแนบซอส</strong><span>ใช้ Prompt ด้านล่างกับ AI ตัวอื่นเมื่อไหร่ ให้แนบซอสจากบทที่ 1 หรือซอสตัวอย่างของบทนี้ไปพร้อมกันทุกครั้ง</span></div>
<div class="note g">เลือก Prompt ด้านล่าง กดคัดลอก แล้ววางในช่องคำสั่งเพิ่มเติมได้เลย</div>'''
          if old_prompt not in text:
              raise SystemExit('Prompt library block not found')
          text = text.replace(old_prompt, new_prompt, 1)

          for required in (
              'ใช้ซอสตัวเองจากบทที่ 1 หรือจะใช้ซอสตัวอย่างที่มีให้ในบทแทนก็ได้',
              'source-sample-card',
              '<strong>อย่าลืมแนบซอส</strong>',
          ):
              if required not in text:
                  raise SystemExit('Validation failed: ' + required)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit lesson 4 patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom/notebooklm.html
          git diff --cached --check
          git commit -m "Improve lesson 4 source chooser"
          git push origin main
