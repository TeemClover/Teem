name: Patch lesson 3 video source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-lesson3-video-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch lesson 3 copy
        run: python tools/patch_lesson3_video_source.py

      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom/clip-ai.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(classroom): clarify lesson 3 video source"
          git push origin HEAD:main
