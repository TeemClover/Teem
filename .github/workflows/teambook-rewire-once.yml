name: TeamBook standalone rewire fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teambook-rewire-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewire standalone TeamBook runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) The v2/v3 lifecycle router must refresh through the canonical
          # TeamBook party handler, not the tiny top-level catch-all. The wrong
          # import wrote JOIN/identity data successfully and then returned 404.
          replace_once(
              'teambook/api/_lib/xty-party-finish.js',
              "import legacyXtyHandler from '../[...path].js';",
              "import legacyXtyHandler from '../teambook/[...path].js';"
          )

          # 2) Reveal back art fills the exact same 63x88 face as the front.
          css = Path('teambook/_shared/card-reveal.css')
          text = css.read_text()
          old = '''.card-back{\n  position:relative;overflow:hidden;\n  display:grid;place-items:center;padding:0;\n  color:#fff;background:\n    radial-gradient(circle at 50% 36%,rgba(255,255,255,.22),transparent 27%),\n    linear-gradient(145deg,#193f31,#0e241d 72%);\n}\n.card-back::before{\n  content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.42);border-radius:12px;\n}\n.teambook-card-back-mark{font:800 clamp(44px,13vw,78px)/1 system-ui;letter-spacing:-.08em}\n.card-back>small{position:absolute;bottom:12%;font:700 11px/1 system-ui;letter-spacing:.24em}\n'''
          new = '''.card-back{\n  position:relative;overflow:hidden;\n  display:block;padding:0!important;\n  color:#fff;background:#13291d;\n  border:0!important;border-radius:18px;box-shadow:none!important;\n}\n.card-back::before{display:none!important}\n.card-back>img{\n  position:absolute;inset:0;display:block!important;\n  width:100%!important;height:100%!important;max-width:none!important;\n  object-fit:cover!important;object-position:center!important;\n}\n.teambook-card-back-mark{display:none!important}\n.card-back>small{display:none!important}\n'''
          if old not in text:
              raise SystemExit('expected reveal card-back block not found')
          css.write_text(text.replace(old, new, 1))

          # 3) The new standalone project inherited the old XTY pet switches.
          # Accept them only as compatibility aliases; TeamBook-specific names
          # remain primary so we can rename secrets later without downtime.
          brain = Path('teambook/api/_lib/pet-brain.js')
          text = brain.read_text()
          text = text.replace(
              "const TEXT_MODEL = process.env.TEAMBOOK_PET_TEXT_MODEL || 'openai/gpt-oss-20b';",
              "const TEXT_MODEL = process.env.TEAMBOOK_PET_TEXT_MODEL || process.env.XTY_PET_TEXT_MODEL || 'openai/gpt-oss-20b';",
              1,
          )
          text = text.replace(
              "const VISION_MODEL = process.env.TEAMBOOK_PET_VISION_MODEL || 'qwen/qwen3.6-27b';",
              "const VISION_MODEL = process.env.TEAMBOOK_PET_VISION_MODEL || process.env.XTY_PET_VISION_MODEL || 'qwen/qwen3.6-27b';",
              1,
          )
          old = '''export function aiConfigured() {\n  return process.env.TEAMBOOK_PET_AI === 'on' && !!process.env.GROQ_API_KEY;\n}\n\nexport function visionConfigured() {\n  return process.env.TEAMBOOK_PET_VISION === 'on' && !!process.env.GROQ_API_KEY;\n}\n'''
          new = '''function envEnabled(primary, legacy) {\n  const value = String(process.env[primary] || process.env[legacy] || '').trim().toLowerCase();\n  return ['on', '1', 'true', 'yes'].includes(value);\n}\n\nexport function aiConfigured() {\n  return envEnabled('TEAMBOOK_PET_AI', 'XTY_PET_AI') && !!process.env.GROQ_API_KEY;\n}\n\nexport function visionConfigured() {\n  return envEnabled('TEAMBOOK_PET_VISION', 'XTY_PET_VISION') && !!process.env.GROQ_API_KEY;\n}\n'''
          if old not in text:
              raise SystemExit('expected pet AI config block not found')
          brain.write_text(text.replace(old, new, 1))

          # 4) Health must report the same compatibility switches the runtime uses.
          health = Path('teambook/api/health.js')
          text = health.read_text()
          text = text.replace(
              "groqConfigured: process.env.TEAMBOOK_PET_AI === 'on' && !!process.env.GROQ_API_KEY,",
              "groqConfigured: ['on','1','true','yes'].includes(String(process.env.TEAMBOOK_PET_AI || process.env.XTY_PET_AI || '').toLowerCase()) && !!process.env.GROQ_API_KEY,",
              1,
          )
          text = text.replace(
              "visionConfigured: process.env.TEAMBOOK_PET_VISION === 'on' && !!process.env.GROQ_API_KEY,",
              "visionConfigured: ['on','1','true','yes'].includes(String(process.env.TEAMBOOK_PET_VISION || process.env.XTY_PET_VISION || '').toLowerCase()) && !!process.env.GROQ_API_KEY,",
              1,
          )
          health.write_text(text)

          # 5) Explicitly load the direct pet wake layer on every party page.
          # It was present in the standalone tree but was no longer wired into
          # the lazy runtime imports after the project split.
          replace_once(
              'teambook/_shared/card-ui.js',
              "  import('./party-pet-seat-v2.js').catch(error => console.warn('TeamBook pet seat unavailable', error));",
              "  import('./party-pet-seat-v2.js').catch(error => console.warn('TeamBook pet seat unavailable', error));\n  import('./pet-direct.js?v=20260821-rewire1').catch(error => console.warn('TeamBook direct pet wake unavailable', error));"
          )
          PY

          cd teambook
          npm ci
          npm run build
          npm run test:smoke
          cd ..

          grep -F "../teambook/[...path].js" teambook/api/_lib/xty-party-finish.js
          grep -F "width:100%!important;height:100%!important" teambook/_shared/card-reveal.css
          grep -F "XTY_PET_AI" teambook/api/_lib/pet-brain.js
          grep -F "pet-direct.js?v=20260821-rewire1" teambook/_shared/card-ui.js

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-rewire-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teambook/api/_lib/xty-party-finish.js teambook/_shared/card-reveal.css teambook/api/_lib/pet-brain.js teambook/api/health.js teambook/_shared/card-ui.js .github/workflows/teambook-rewire-once.yml
          git commit -m "fix(teambook): reconnect standalone runtime wires"
          git push origin HEAD:main
