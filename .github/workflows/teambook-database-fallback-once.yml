name: Restore TeamBook Neon database fallback once

on:
  push:
    paths:
      - '.github/workflows/teambook-database-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add managed Neon DATABASE_URL fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path('teambook/api/_lib/core.js')
          s = core.read_text(encoding='utf-8')
          old = """export function database() {\n  if (!process.env.TEAMBOOK_DATABASE_URL) {\n    const error = new Error('TEAMBOOK_DATABASE_URL_NOT_CONFIGURED');\n    error.code = 'TEAMBOOK_DATABASE_URL_NOT_CONFIGURED';\n    throw error;\n  }\n  return neon(process.env.TEAMBOOK_DATABASE_URL);\n}\n"""
          new = """export function database() {\n  const url = process.env.TEAMBOOK_DATABASE_URL || process.env.DATABASE_URL;\n  if (!url) {\n    const error = new Error('TEAMBOOK_DATABASE_URL_NOT_CONFIGURED');\n    error.code = 'TEAMBOOK_DATABASE_URL_NOT_CONFIGURED';\n    throw error;\n  }\n  return neon(url);\n}\n"""
          if old not in s:
              raise SystemExit('core database block not found')
          core.write_text(s.replace(old, new, 1), encoding='utf-8')

          health = Path('teambook/api/health.js')
          h = health.read_text(encoding='utf-8')
          oldh = "databaseConfigured: !!process.env.TEAMBOOK_DATABASE_URL,"
          newh = "databaseConfigured: !!(process.env.TEAMBOOK_DATABASE_URL || process.env.DATABASE_URL),"
          if oldh not in h:
              raise SystemExit('health database check not found')
          health.write_text(h.replace(oldh, newh, 1), encoding='utf-8')
          PY

      - name: Validate syntax
        run: node --check teambook/api/_lib/core.js && node --check teambook/api/health.js

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-database-fallback-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teambook/api/_lib/core.js teambook/api/health.js .github/workflows/teambook-database-fallback-once.yml
          git commit -m "fix(teambook): accept managed Neon DATABASE_URL"
          git push origin HEAD:main
