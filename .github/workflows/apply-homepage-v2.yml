name: Apply homepage v2

on:
  push:
    branches:
      - agent/home-video-gateway
    paths:
      - .github/workflows/apply-homepage-v2.yml
      - tools/homepage-v2/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-video-gateway
          fetch-depth: 0
      - name: Apply redesigned homepage and hall
        shell: bash
        run: |
          set -euo pipefail
          cp hall.html hall-full.html
          gzip -dc tools/homepage-v2/index.html.gz > index.html
          gzip -dc tools/homepage-v2/hall.html.gz > hall.html
          rm -rf tools/homepage-v2
          rm -f .github/workflows/apply-homepage-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hall.html hall-full.html tools .github/workflows/apply-homepage-v2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refine homepage and hall flow"
          git push origin HEAD:agent/home-video-gateway
