name: TeamBook Public Blob + Reward Recovery

on:
  push:
    paths:
      - '.github/workflows/teambook-public-blob-reward-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TeamBook public Blob and reward recovery patch
        run: python teambook/scripts/apply-public-blob-reward-recovery.py

      - name: Verify TeamBook build
        working-directory: teambook
        run: |
          npm ci
          npm run build

      - name: Run TeamBook tests
        working-directory: teambook
        run: npm test

      - name: Commit clean runtime
        shell: bash
        run: |
          rm -f .github/workflows/teambook-public-blob-reward-recovery.yml
          rm -f teambook/scripts/apply-public-blob-reward-recovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(teambook): recover pending cards and use public Blob"
          git push origin HEAD:main
