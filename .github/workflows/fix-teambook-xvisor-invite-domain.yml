name: Fix TeamBook X-VISOR invite domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-teambook-xvisor-invite-domain.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Point TeamBook white-cat X-VISOR invite to myClover Xircle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('teambook/_shared/xvisor-care.js')
          text = path.read_text(encoding='utf-8')
          old = """export function xvisorInviteUrl(code, origin = (typeof location !== 'undefined' ? location.origin : 'https://teambook.me')) {
            return `${origin}/xircle/?xty=${encodeURIComponent(code)}&xvisor=1`;
          }"""
          # Match the repository's two-space indentation exactly without making the
          # workflow itself dependent on indentation inside this heredoc.
          old = old.replace('\n            ', '\n  ')
          new = """export function xvisorInviteUrl(code) {
            return `https://www.myclover.com/xircle/?xty=${encodeURIComponent(code)}&xvisor=1`;
          }""".replace('\n            ', '\n  ')
          if old not in text:
              raise SystemExit('Expected xvisorInviteUrl implementation not found; refusing broad edit')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          grep -F 'https://www.myclover.com/xircle/?xty=' teambook/_shared/xvisor-care.js

      - name: Remove one-off workflow and commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-teambook-xvisor-invite-domain.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teambook/_shared/xvisor-care.js .github/workflows/fix-teambook-xvisor-invite-domain.yml
          git commit -m 'fix(teambook): send X-VISOR invites to myClover Xircle'
          git push origin HEAD:main
