name: Inspect classroom visual layout

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-classroom-visual-layout.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print lesson 6 structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('classroom/first-web.html').read_text(encoding='utf-8')

          print('=== SECTIONS / ASIDES / ENDCAP ===')
          tags=[]
          for m in re.finditer(r'<(?:section|aside)\b[^>]*>', text, re.I):
              tags.append((m.start(),m.group(0)))
          for i,(pos,tag) in enumerate(tags):
              end=tags[i+1][0] if i+1<len(tags) else min(len(text),pos+9000)
              block=text[pos:end]
              if any(k in block for k in ['section-head','main-note','endcap','GitHub Pages','starter-js','starter-copy','template']):
                  print('\n---',tag,'---')
                  print(block[:12000])

          print('\n=== CSS TARGET RULES ===')
          for key in ['hero-grid','hero-art','section-head','num','copybox','template','checklist','endcap','takeaway']:
              print('\n##',key)
              for m in re.finditer(r'[^{}]*\.'+re.escape(key)+r'[^{}]*\{[^{}]*\}', text):
                  print(m.group(0)[:2400])

          print('\n=== SCRIPT REFERENCES ===')
          for key in ['pageName','pageDesc','pageColor','pageCta','starter-js','starter-copy','template','finishBtn','finish','takeover']:
              print('\n##',key)
              for m in re.finditer(re.escape(key),text):
                  a=max(0,text.rfind('\n',0,max(0,m.start()-800)))
                  b=text.find('\n',min(len(text),m.start()+1300))
                  if b<0:b=min(len(text),m.start()+1300)
                  print(text[a:b][:2600])
                  break

          print('\n=== HISTORICAL HERO EXACT ===')
          import subprocess
          old=subprocess.check_output(['git','show','90d962423d4d7d6456ad8ef765b946daf17a4ab6:classroom/first-web.html'],text=True)
          hm=re.search(r'<header class="hero">.*?</header>',old,re.S)
          print(hm.group(0) if hm else 'NOT FOUND')
          PY
