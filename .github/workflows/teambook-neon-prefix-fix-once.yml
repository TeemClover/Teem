name: TeamBook Neon prefix fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teambook-neon-prefix-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Accept exact Vercel Neon prefixed URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('teambook/api/_lib/core.js'),
              Path('teambook/api/health.js'),
          ]
          old = "process.env.TEAMBOOK_DATABASE_URL || process.env.STORAGE_DATABASE_URL || process.env.STORAGE_URL || process.env.DATABASE_URL"
          new = "process.env.TEAMBOOK_DATABASE_URL || process.env.TEAMBOOK_DATABASE_DATABASE_URL || process.env.STORAGE_DATABASE_URL || process.env.STORAGE_URL || process.env.DATABASE_URL"
          for p in files:
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected database env expression not found in {p}')
              p.write_text(text.replace(old, new))
          PY
          node --check teambook/api/_lib/core.js
          node --check teambook/api/health.js
          rm .github/workflows/teambook-neon-prefix-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teambook/api/_lib/core.js teambook/api/health.js .github/workflows/teambook-neon-prefix-fix-once.yml
          git commit -m 'fix(teambook): read exact Neon prefixed database URL'
          git push
