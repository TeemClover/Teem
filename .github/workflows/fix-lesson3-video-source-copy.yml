name: Fix lesson 3 quest copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lesson3-video-source-copy.yml'

permissions:
  contents: write

jobs:
  fix-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update lesson 3 quest copy only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('classroom/clip-ai.html')
          text = path.read_text(encoding='utf-8')

          heading = 'เควสท้ายบท · สร้างวิดีโอจากซอสให้ได้ 1 ชิ้น'
          start = text.find(heading)
          if start < 0:
              raise SystemExit('lesson 3 quest heading not found')

          # Bound changes to the quest block only.
          candidates = [
              text.find('</section>', start),
              text.find('</article>', start),
              text.find('<footer', start),
              text.find('<nav', start),
          ]
          candidates = [x for x in candidates if x != -1]
          end = min(candidates) if candidates else min(len(text), start + 10000)
          chunk = text[start:end]

          old_name = 'video-source-YYYY-MM-DD-HHmm.md'
          new_name = 'video-source.md'
          old_end = 'เช็กว่าไฟล์เล่นได้จริง ไม่เกิน 10 วินาที และเป็นแนวตั้ง 9:16'
          new_end = old_end + ' (บางครั้ง AI ชอบทำแนวนอนให้เอง)'

          if chunk.count(old_name) != 2:
              raise SystemExit(f'expected 2 timestamp filenames in quest, found {chunk.count(old_name)}')
          chunk = chunk.replace(old_name, new_name)

          if new_end not in chunk:
              if chunk.count(old_end) != 1:
                  raise SystemExit(f'expected 1 final-check sentence, found {chunk.count(old_end)}')
              chunk = chunk.replace(old_end, new_end, 1)

          updated = text[:start] + chunk + text[end:]

          check = updated[start:start + len(chunk) + 500]
          if old_name in check:
              raise SystemExit('timestamp filename still remains in quest')
          if check.count(new_name) < 2:
              raise SystemExit('video-source.md missing from quest')
          if 'บางครั้ง AI ชอบทำแนวนอนให้เอง' not in check:
              raise SystemExit('landscape warning missing')

          path.write_text(updated, encoding='utf-8')
          print('lesson 3 quest copy updated')
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git diff -- classroom/clip-ai.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom/clip-ai.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(classroom): simplify lesson 3 video source filename"
          git push origin HEAD:main
