name: XTY subdomain redirect once

on:
  push:
    paths:
      - '.github/workflows/xty-subdomain-redirect-once.yml'

permissions:
  contents: write

jobs:
  update-vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace XTY host rewrite with redirect
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('vercel.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          def is_xty_host(rule):
              return any(
                  h.get('type') == 'host' and h.get('value') == 'xty.myclover.com'
                  for h in rule.get('has', [])
              )

          # Remove the old host rewrite so xty.myclover.com is no longer a
          # separate browser origin serving /xty internally.
          data['rewrites'] = [r for r in data.get('rewrites', []) if not is_xty_host(r)]

          # Remove any previous XTY host redirects before installing canonical ones.
          redirects = [r for r in data.get('redirects', []) if not is_xty_host(r)]

          host = [{'type': 'host', 'value': 'xty.myclover.com'}]
          xty_redirects = [
              # Legacy-safe: if somebody ever saved xty.myclover.com/xty/...,
              # do not produce /xty/xty/...
              {
                  'source': '/xty/:path*',
                  'has': host,
                  'destination': 'https://www.myclover.com/xty/:path*',
                  'permanent': False,
              },
              {
                  'source': '/xty',
                  'has': host,
                  'destination': 'https://www.myclover.com/xty/',
                  'permanent': False,
              },
              # Canonical alias: root and every path map under /xty/ on the
              # main www origin. Query strings such as ?c=53986 are preserved
              # by Vercel redirects.
              {
                  'source': '/:path*',
                  'has': host,
                  'destination': 'https://www.myclover.com/xty/:path*',
                  'permanent': False,
              },
          ]

          data['redirects'] = xty_redirects + redirects
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JSON
        run: python3 -m json.tool vercel.json >/dev/null

      - name: Commit redirect and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/xty-subdomain-redirect-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json .github/workflows/xty-subdomain-redirect-once.yml
          git commit -m "Redirect xty subdomain to main XTY origin"
          git push origin HEAD:main
