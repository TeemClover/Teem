name: Restore TeamBook server environment once

on:
  push:
    paths:
      - '.github/workflows/teambook-restore-env-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAMBOOK_DATABASE_URL: ${{ secrets.TEAMBOOK_DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TEAMBOOK_FROM_EMAIL: ${{ secrets.TEAMBOOK_FROM_EMAIL }}
      TEAMBOOK_ADMIN_PASSWORD: ${{ secrets.TEAMBOOK_ADMIN_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore TeamBook env without exposing values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, secrets, sys, urllib.request, urllib.error

          TEAM_ID = 'team_i2s1K5VOKc1m0Mk6YiLqh7fs'
          PROJECT = 'teambook'
          token = os.environ.get('VERCEL_TOKEN','').strip()
          if not token:
              print('RESTORE_STATUS=NO_VERCEL_TOKEN')
              sys.exit(2)

          def req(method, path, body=None):
              url = 'https://api.vercel.com' + path + ('&' if '?' in path else '?') + 'teamId=' + TEAM_ID
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(url, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
              })
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      raw = resp.read().decode() or '{}'
                      return resp.status, json.loads(raw)
              except urllib.error.HTTPError as e:
                  raw = e.read().decode() or '{}'
                  try: payload = json.loads(raw)
                  except Exception: payload = {'error': {'message': f'HTTP {e.code}'}}
                  return e.code, payload

          status, project = req('GET', f'/v9/projects/{PROJECT}')
          if status != 200:
              print(f'RESTORE_STATUS=PROJECT_LOOKUP_FAILED_{status}')
              sys.exit(3)

          status, current = req('GET', f'/v9/projects/{PROJECT}/env')
          if status != 200:
              print(f'RESTORE_STATUS=ENV_LIST_FAILED_{status}')
              sys.exit(4)
          envs = current.get('envs') or current.get('env') or []
          existing = {str(e.get('key','')) for e in envs}

          literals = {
              'TEAMBOOK_PET_AI': 'on',
              'TEAMBOOK_PET_VISION': 'on',
              'TEAMBOOK_PET_TEXT_MODEL': 'openai/gpt-oss-20b',
              'TEAMBOOK_PET_VISION_MODEL': 'qwen/qwen3.6-27b',
              'TEAMBOOK_PET_WAKE_CONCURRENCY': '12',
          }
          secret_keys = [
              'TEAMBOOK_DATABASE_URL','BLOB_READ_WRITE_TOKEN','GROQ_API_KEY',
              'RESEND_API_KEY','TEAMBOOK_FROM_EMAIL','TEAMBOOK_ADMIN_PASSWORD',
              'GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','LINE_CHANNEL_ID','LINE_CHANNEL_SECRET',
          ]

          items = []
          restored = []
          missing = []
          for key, value in literals.items():
              if key not in existing:
                  items.append({'key': key, 'value': value, 'type': 'encrypted', 'target': ['production','preview','development']})
                  restored.append(key)
          if 'CRON_SECRET' not in existing:
              items.append({'key':'CRON_SECRET','value':secrets.token_urlsafe(32),'type':'sensitive','target':['production','preview']})
              restored.append('CRON_SECRET')

          for key in secret_keys:
              if key in existing:
                  continue
              value = os.environ.get(key,'').strip()
              if value:
                  # Development cannot use sensitive env vars; keep repo-secret restores encrypted across all scopes.
                  items.append({'key': key, 'value': value, 'type': 'encrypted', 'target': ['production','preview','development']})
                  restored.append(key)
              else:
                  missing.append(key)

          if items:
              status, payload = req('POST', f'/v10/projects/{PROJECT}/env?upsert=true', items)
              if status not in (200,201):
                  # Never print response body: some API responses can echo env metadata.
                  print(f'RESTORE_STATUS=ENV_WRITE_FAILED_{status}')
                  print('RESTORED_KEYS=' + ','.join(restored))
                  print('MISSING_REPO_SECRETS=' + ','.join(missing))
                  sys.exit(5)

          print('RESTORE_STATUS=OK')
          print('RESTORED_KEYS=' + ','.join(restored))
          print('MISSING_REPO_SECRETS=' + ','.join(missing))
          print('DATABASE_PRESENT=' + ('yes' if ('TEAMBOOK_DATABASE_URL' in existing or os.environ.get('TEAMBOOK_DATABASE_URL','').strip()) else 'no'))
          PY

      - name: Force production redeploy
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            "https://api.vercel.com/v13/deployments?teamId=team_i2s1K5VOKc1m0Mk6YiLqh7fs&forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"name":"teambook","project":"teambook","target":"production","gitSource":{"type":"github","repoId":"1079268914","ref":"main"}}' \
            >/tmp/deploy.json || true

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/teambook-restore-env-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/teambook-restore-env-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(teambook): remove env restore workflow"
          git push origin HEAD:main
