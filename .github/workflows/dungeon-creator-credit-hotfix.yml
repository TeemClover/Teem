name: Dungeon creator credit hotfix
on:
  push:
    paths:
      - '.github/workflows/dungeon-creator-credit-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('classroom/dungeon/index.html')
          s=p.read_text()
          old='''      <a href="/"><em>🏠</em>กลับบ้าน</a>'''
          new='''      <a href="/"><em>🏠</em>กลับบ้าน</a>\n      <a href="/resume/"><em>🧑‍💻</em>เครดิตผู้สร้าง</a>'''
          if old not in s:
              raise SystemExit('final home exit button not found')
          if 'href="/resume/"' in s[s.find('<nav class="exitnav"'):s.find('</nav>', s.find('<nav class="exitnav"'))]:
              raise SystemExit('creator credit button already exists')
          p.write_text(s.replace(old,new,1))
          PY

          grep -q '<a href="/resume/"><em>🧑‍💻</em>เครดิตผู้สร้าง</a>' classroom/dungeon/index.html

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/dungeon-creator-credit-hotfix.yml
          git add classroom/dungeon/index.html
          git commit -m "Add creator credit exit to Dungeon"
          git push origin HEAD:main
