name: One-time Kickstarter polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-kickstarter-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet Pillow

      - name: Repair images and polish campaign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import json, re, shutil

          VERSION = '20260803-polish-v4'
          root = Path('.')
          story_dir = root / 'kickstarter/assets/story'

          # Re-encode all six campaign images to ordinary, browser-safe WebP.
          image_names = [
              'removing-rules.webp',
              'one-box-ritual.webp',
              'first-meeting.webp',
              'core7bo5-memory.webp',
              'founder-daughter.webp',
              'built-to-ship.webp',
          ]
          for name in image_names:
              path = story_dir / name
              if not path.exists():
                  raise SystemExit(f'Missing story image: {path}')
              with Image.open(path) as source:
                  image = ImageOps.fit(source.convert('RGB'), (1200, 750), Image.Resampling.LANCZOS)
                  temp = path.with_suffix('.fixed.webp')
                  image.save(temp, 'WEBP', quality=76, method=6)
              temp.replace(path)

          old_memory = story_dir / 'core7bo5-memory.webp'
          new_memory = story_dir / 'core7-set-memory.webp'
          shutil.copy2(old_memory, new_memory)
          old_memory.unlink()

          # ---------- Static campaign HTML ----------
          index = Path('kickstarter/index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'20260803-[A-Za-z0-9-]+', VERSION, html)
          html = html.replace('/core7/assets/card-back-core7.png', '/core7/assets/card-back-core7.webp')
          html = html.replace('/core7/assets/core7-rules-overview.png', '/core7/assets/core7-rules-overview.webp')

          html = html.replace(
              'A 32-card game you can teach in ten seconds. No draw luck. No random outcomes. Every result comes from the two humans across the table.',
              'A 32-card game you can teach in ten seconds. 0% RNG. 100% decisions. The only unpredictable thing is the human across the table.'
          )
          html = html.replace(
              '28 word cards · 4 rule cards · 0% RNG · 1 box for two complete hands',
              '28 word cards · 4 rule cards · 0% RNG · 100% DECISIONS · 1 box for two complete hands'
          )

          # Public terminology: Round → Match → Set.
          replacements = [
              ('CORE7BO5', 'CORE7 Set'),
              ('Best-of-5', 'CORE7 Set'),
              ('Quick Plays', 'CORE7 Matches'),
              ('Quick Play', 'CORE7 Match'),
              ('Standard Match', 'CORE7 Set'),
              ('Standard Format', 'CORE7 Set'),
              ('STANDARD · LOCKED CORE7 · BO5', 'CORE7 SET · LOCKED CORE7'),
              ('STANDARD · LOCKED HAND', 'CORE7 SET · LOCKED HAND'),
              ('Standard locks', 'A CORE7 Set locks'),
              ('Standard Format, Open Play', 'CORE7 Set, Open Play'),
              ('BODY · MIND · SOUL · CRAFT', 'BODY · SOUL · MIND · CRAFT'),
              ('Body. Mind. Soul. Craft.', 'Body. Soul. Mind. Craft.'),
              ('Red, Blue, Green and Gray', 'Red, Green, Blue and Gray'),
              ('RED, BLUE, GREEN and GRAY', 'RED, GREEN, BLUE and GRAY'),
          ]
          for old, new in replacements:
              html = html.replace(old, new)

          html = html.replace(
              '<button class="energy-button active red" data-energy="RED"><span>●</span> RED · BODY</button><button class="energy-button blue" data-energy="BLUE"><span>●</span> BLUE · MIND</button><button class="energy-button green" data-energy="GREEN"><span>●</span> GREEN · SOUL</button><button class="energy-button gray" data-energy="GRAY"><span>●</span> GRAY · CRAFT</button>',
              '<button class="energy-button active red" data-energy="RED"><span>●</span> RED · BODY</button><button class="energy-button green" data-energy="GREEN"><span>●</span> GREEN · SOUL</button><button class="energy-button blue" data-energy="BLUE"><span>●</span> BLUE · MIND</button><button class="energy-button gray" data-energy="GRAY"><span>●</span> GRAY · CRAFT</button>'
          )

          # Tighten the Match/Set explanation instead of doing blind word swaps.
          html = html.replace('CORE7 · CORE7 MATCH', 'CORE7 · MATCH')
          html = html.replace(
              'That wins one CORE7 Match. Keep or change your hand before the next game.',
              'That wins one CORE7 Match. Keep or change your hand before the next Match.'
          )
          html = html.replace(
              '<article class="quick"><span>CORE7 MATCH</span><h3>Choose seven. Win three Rounds.</h3><p>One complete game. For the next CORE7 Match, keep the same seven or choose a new hand.</p></article>',
              '<article class="quick"><span>CORE7 MATCH</span><h3>Win 3 Rounds.</h3><p>One complete Match. Choose one card in secret, reveal together, and become the first player to win three Rounds.</p></article>'
          )
          html = html.replace(
              '<article class="standard"><span>CORE7 SET · LOCKED CORE7</span><h3>Same hand. Next game. Different feeling each time.</h3><p>Lock one CORE7 for the match. Reset the same seven after every CORE7 Match. First to win three CORE7 Matches wins.</p></article>',
              '<article class="standard"><span>CORE7 SET · LOCKED HAND</span><h3>Same hand. Win 3 Matches.</h3><p>Lock the same CORE7 hand for the whole Set. Reset those seven cards after every Match. First to win three Matches wins the Set.</p></article>'
          )
          html = html.replace('CORE7 Match creates the first impression.<br>CORE7 Set strengthens it.', 'A CORE7 Match creates the first impression.<br>A CORE7 Set strengthens it.')

          # Restore the origin of the name as a real static section.
          if 'id="name-origin"' not in html:
              section = '''
    <section id="name-origin" class="name-origin section-dark">
      <div class="wrap name-origin-grid">
        <div class="name-origin-mark reveal" aria-hidden="true"><span>4</span><b>→</b><span>7</span></div>
        <div class="name-origin-copy reveal">
          <p id="nameOriginKicker" class="eyebrow">THE NAME</p>
          <h2 id="nameOriginTitle">myClover is luck<br><em>you choose to carry.</em></h2>
          <p id="nameOriginBody">The name began with a four-leaf clover and the idea of “my lucky seven”: the seven words you choose to carry into a meeting.</p>
          <blockquote id="nameOriginQuote">The luck was meeting.<br>The game is all decisions.</blockquote>
          <div class="name-origin-chips"><span>FOUR-LEAF CLOVER</span><span>MY LUCKY SEVEN</span><span>SEVEN CHOSEN WORDS</span></div>
        </div>
      </div>
    </section>
'''
              anchor = '    <section id="game" class="game section-dark">'
              if anchor not in html:
                  raise SystemExit('Game section anchor not found')
              html = html.replace(anchor, section + '\n' + anchor, 1)

          index.write_text(html, encoding='utf-8')

          # ---------- Lightweight campaign enhancer ----------
          distilled = Path('kickstarter/kickstarter-distilled.js')
          js = distilled.read_text(encoding='utf-8')
          js = re.sub(r"const VERSION = '[^']+';", f"const VERSION = '{VERSION}';", js, count=1)
          js = js.replace('core7bo5-memory', 'core7-set-memory')
          js = js.replace('CORE7BO5', 'CORE7 Set')
          js = js.replace('Quick Plays', 'CORE7 Matches')
          js = js.replace('Quick Play', 'CORE7 Match')
          js = js.replace('Best-of-5', 'CORE7 Set')
          js = js.replace('Standard Match', 'CORE7 Set')
          js = js.replace('Body. Mind. Soul. Craft.', 'Body. Soul. Mind. Craft.')
          js = js.replace('0% RNG. 100% decisions.', '0% RNG. 100% DECISIONS.')
          js = js.replace(
              "['core7-set-memory','Same hand. Stronger memory.','CORE7 Set keeps the seven cards fixed while the humans learn each other.'",
              "['core7-set-memory','Same hand. Win three Matches.','A CORE7 Set locks the same seven cards until one player wins three Matches.'"
          )
          js = js.replace(
              "'CORE7 Set ล็อกเจ็ดใบเดิม ขณะที่มนุษย์สองคนค่อย ๆ เรียนรู้กัน'",
              "'CORE7 Set ล็อกเจ็ดใบเดิมจนกว่าจะมีคนชนะสาม Matches ขณะที่มนุษย์สองคนค่อย ๆ เรียนรู้กัน'"
          )

          # Add bilingual name-origin copy to the existing language switch.
          name_copy = '''
    const nameCopy = thai ? {
      kicker:'ที่มาของชื่อ',
      title:'myClover คือโชค<br><em>ที่เราเลือกพกไปด้วย</em>',
      body:'ชื่อเริ่มจากโคลเวอร์สี่แฉก และแนวคิด “my lucky seven” — เจ็ดคำที่เราเลือกถือไปพบคนตรงหน้า',
      quote:'ดวงถูกใช้ไปหมดแล้วตอนที่เราได้มาเจอกัน<br>ที่เหลือคือการตัดสินใจของเรา'
    } : {
      kicker:'THE NAME',
      title:'myClover is luck<br><em>you choose to carry.</em>',
      body:'The name began with a four-leaf clover and the idea of “my lucky seven”: the seven words you choose to carry into a meeting.',
      quote:'The luck was meeting.<br>The game is all decisions.'
    };
    const nameKicker = document.getElementById('nameOriginKicker');
    const nameTitle = document.getElementById('nameOriginTitle');
    const nameBody = document.getElementById('nameOriginBody');
    const nameQuote = document.getElementById('nameOriginQuote');
    if(nameKicker) nameKicker.textContent = nameCopy.kicker;
    if(nameTitle) nameTitle.innerHTML = nameCopy.title;
    if(nameBody) nameBody.textContent = nameCopy.body;
    if(nameQuote) nameQuote.innerHTML = nameCopy.quote;
'''
          marker = "    const labels = thai"
          if name_copy.strip() not in js and marker in js:
              js = js.replace(marker, name_copy + '\n' + marker, 1)

          # Give images intrinsic dimensions and a visible fallback instead of a broken icon.
          js = js.replace(
              "loading=\"lazy\" decoding=\"async\" alt=\"\"",
              "loading=\"lazy\" decoding=\"async\" width=\"1200\" height=\"750\" alt=\"\""
          )
          js = js.replace(
              "image.addEventListener('error',()=>{",
              "image.addEventListener('error',()=>{"
          )
          distilled.write_text(js, encoding='utf-8')

          # ---------- Main injected sections ----------
          campaign = Path('kickstarter/kickstarter.js')
          cjs = campaign.read_text(encoding='utf-8')
          cjs = re.sub(r"import './kickstarter-base\.js\?v=[^']+';", f"import './kickstarter-base.js?v={VERSION}';", cjs, count=1)
          cjs = cjs.replace('/core7/assets/card-back-core7.png', '/core7/assets/card-back-core7.webp')
          cjs = cjs.replace('CORE7BO5', 'CORE7 Set')
          cjs = cjs.replace('Quick Plays', 'CORE7 Matches')
          cjs = cjs.replace('Quick Play', 'CORE7 Match')
          cjs = cjs.replace('Best-of-5', 'CORE7 Set')
          cjs = cjs.replace('Standard Match', 'CORE7 Set')
          cjs = cjs.replace('Standard Format', 'CORE7 Set')
          cjs = cjs.replace('BO5', 'SET')
          cjs = cjs.replace('Body. Mind. Soul. Craft.', 'Body. Soul. Mind. Craft.')
          cjs = cjs.replace('Use Body, Mind, Soul and Craft', 'Use Body, Soul, Mind and Craft')
          cjs = cjs.replace('cardSVG(\'fh-red-courage\',{width:360})', 'cardSVG(\'fh-red-passion\',{width:360})')
          cjs = cjs.replace('COURAGE · ความกล้า', 'PASSION · แรงปรารถนา')
          cjs = cjs.replace('One seven-card hand. Up to five fast games.', 'One locked seven-card hand. First to win three Matches.')
          cjs = cjs.replace('Play up to five compact matches with the same information space.', 'Play Matches with the same locked hand until someone wins three.')
          campaign.write_text(cjs, encoding='utf-8')

          # ---------- CSS polish ----------
          css = Path('kickstarter/kickstarter-static-story.css')
          styles = css.read_text(encoding='utf-8') if css.exists() else ''
          styles += '''

/* Campaign polish v4 */
.name-origin{padding:110px 0;background:radial-gradient(circle at 18% 35%,rgba(200,156,69,.16),transparent 30%),#062718;color:#fff}
.name-origin-grid{display:grid;grid-template-columns:minmax(190px,.38fr) minmax(0,1fr);gap:70px;align-items:center}
.name-origin-mark{width:min(280px,100%);aspect-ratio:1;display:grid;grid-template-columns:1fr auto 1fr;place-items:center;border:1px solid rgba(236,210,139,.38);border-radius:50%;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 8px rgba(6,39,24,.8),0 30px 80px rgba(0,0,0,.28)}
.name-origin-mark span{font:600 clamp(3rem,7vw,6rem)/1 Georgia,serif;color:#ecd28b}.name-origin-mark b{color:rgba(255,255,255,.55);font-size:1.4rem}
.name-origin-copy h2{margin:0;font:500 clamp(2.8rem,5.6vw,5.6rem)/.98 Georgia,serif;letter-spacing:-.05em}.name-origin-copy h2 em{color:#ecd28b;font-style:italic}
.name-origin-copy>p:not(.eyebrow){max-width:720px;color:rgba(255,255,255,.72);font-size:1.08rem}.name-origin-copy blockquote{margin:28px 0 26px;padding-left:24px;border-left:3px solid #c89c45;font:500 clamp(1.45rem,3vw,2.45rem)/1.25 Georgia,serif;color:#fff}
.name-origin-chips{display:flex;flex-wrap:wrap;gap:9px}.name-origin-chips span{padding:8px 11px;border:1px solid rgba(236,210,139,.28);border-radius:999px;color:#ecd28b;font-size:.67rem;font-weight:900;letter-spacing:.1em}
.ks-story-static img,.ks-story-inline img{background:#082b1c;color:transparent}.ks-story-static figure{min-width:0}.ks-story-static figcaption{min-height:112px}
@media(max-width:760px){.name-origin{padding:78px 0}.name-origin-grid{grid-template-columns:1fr;gap:34px}.name-origin-mark{width:190px;margin:auto}.name-origin-copy{text-align:center}.name-origin-copy blockquote{padding:0;border-left:0}.name-origin-chips{justify-content:center}}
'''
          css.write_text(styles, encoding='utf-8')

          v2 = Path('kickstarter/kickstarter-v2.css')
          v2css = v2.read_text(encoding='utf-8')
          v2css = re.sub(r"kickstarter-static-story\.css\?v=[^']+", f"kickstarter-static-story.css?v={VERSION}", v2css)
          v2css = re.sub(r"kickstarter-failsafe\.css\?v=[^']+", f"kickstarter-failsafe.css?v={VERSION}", v2css)
          v2.write_text(v2css, encoding='utf-8')

          # ---------- Public documentation terminology ----------
          docs = list(Path('core7').rglob('*.md'))
          for path in docs:
              text = path.read_text(encoding='utf-8')
              text = text.replace('CORE7BO5', 'CORE7 Set')
              text = text.replace('Quick Plays', 'CORE7 Matches')
              text = text.replace('Quick Play', 'CORE7 Match')
              text = text.replace('Standard Match', 'CORE7 Set')
              text = text.replace('Standard Format', 'CORE7 Set')
              text = text.replace('Best-of-5', 'first-to-three-Matches')
              text = re.sub(r'\bBO5\b', 'CORE7 Set', text)
              text = text.replace('Body / Mind / Soul / Craft', 'Body / Soul / Mind / Craft')
              text = text.replace('Body · Mind · Soul · Craft', 'Body · Soul · Mind · Craft')
              if path.name == 'MYCLOVER-CARDS.md' and '## Locked Public Match Language' not in text:
                  block = '''

## Locked Public Match Language

Use this hierarchy in all public-facing copy and documents:

- **Round** — one secret card choice and simultaneous reveal.
- **CORE7 Match** — first player to win **3 Rounds**.
- **CORE7 Set** — keep the same locked CORE7 hand; first player to win **3 Matches**.

Memory shorthand:

> **3 Round wins = 1 Match win.**
>
> **3 Match wins with the same hand = 1 Set victory.**

Do not use **Quick Play**, **CORE7BO5**, **BO5**, or **Best-of-5** in public-facing material. Those terms make the system harder to explain without adding useful meaning.
'''
                  anchor = '\n# 3.'
                  if anchor in text:
                      text = text.replace(anchor, block + anchor, 1)
                  else:
                      text = block + text
              path.write_text(text, encoding='utf-8')

          # ---------- Vercel headers ----------
          config_path = Path('vercel.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          headers = config.setdefault('headers', [])
          source = '/kickstarter/assets/story/(.*).webp'
          if not any(item.get('source') == source for item in headers):
              headers.append({
                  'source': source,
                  'headers': [
                      {'key':'Content-Type','value':'image/webp'},
                      {'key':'Cache-Control','value':'public, max-age=31536000, immutable'},
                  ],
              })
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Remove this one-time workflow after it has done its job.
          Path('.github/workflows/one-time-kickstarter-polish.yml').unlink()
          PY

      - name: Validate repaired output
        shell: bash
        run: |
          set -euxo pipefail
          node --check kickstarter/kickstarter.js
          node --check kickstarter/kickstarter-distilled.js
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names = ['removing-rules.webp','one-box-ritual.webp','first-meeting.webp','core7-set-memory.webp','founder-daughter.webp','built-to-ship.webp']
          for name in names:
              path = Path('kickstarter/assets/story') / name
              with Image.open(path) as image:
                  image.verify()
              print(name, path.stat().st_size)
          PY
          ! grep -R -n -E 'CORE7BO5|Quick Play|Best-of-5|\bBO5\b' core7 --include='*.md'
          grep -n '100% DECISIONS' kickstarter/index.html
          grep -n 'id="name-origin"' kickstarter/index.html
          grep -n 'core7-set-memory.webp' kickstarter/kickstarter-distilled.js

      - name: Commit polished campaign
        shell: bash
        run: |
          git config user.name 'TeemClover Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Kickstarter story, naming and CORE7 terminology'
          git push origin HEAD:main
