name: Fix home resume trailing slash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-resume-slash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Fix host profile URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='href="/resume" data-mc-act="home-host-profile"'
          new='href="/resume/" data-mc-act="home-host-profile"'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('host profile link not found')
          assert old not in s
          assert new in s
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -F 'href="/resume/" data-mc-act="home-host-profile"' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(home): use trailing slash for resume link"
          git push origin HEAD:main
