name: Cleanup resume slash workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-resume-slash.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify link and remove one-shot workflow
        run: |
          grep -F 'href="/resume/" data-mc-act="home-host-profile"' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-home-resume-slash.yml
          git commit -m "chore: remove temporary resume slash workflow"
          git push origin HEAD:main
