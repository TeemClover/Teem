name: TeamBook Reward Follow-up

on:
  push:
    paths:
      - '.github/workflows/teambook-reward-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python teambook/scripts/apply-reward-followup.py
      - name: Verify TeamBook build
        working-directory: teambook
        run: |
          npm ci
          npm run build
      - name: Commit clean runtime
        run: |
          rm -f .github/workflows/teambook-reward-followup.yml
          rm -f teambook/scripts/apply-reward-followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(teambook): keep pending card opening personal"
          git push origin HEAD:main
