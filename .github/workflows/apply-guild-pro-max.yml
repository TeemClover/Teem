name: Apply Guild Pro Max

on:
  push:
    branches: [main]
    paths:
      - 'guild/pro-max.html'
      - '.github/workflows/apply-guild-pro-max.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace live Guild page
        run: |
          cp guild/pro-max.html guild/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guild/index.html
          if git diff --cached --quiet; then
            echo "Guild page already current"
            exit 0
          fi
          git commit -m "Apply Guild X Pro Max live page"
          git push origin HEAD:main
