name: Verify TeamBook server environment once

on:
  push:
    paths:
      - '.github/workflows/teambook-env-check-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write safe environment-presence report
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          team='team_i2s1K5VOKc1m0Mk6YiLqh7fs'; project='teambook'
          token=os.environ.get('VERCEL_TOKEN','').strip()
          wanted=['TEAMBOOK_DATABASE_URL','BLOB_READ_WRITE_TOKEN','CRON_SECRET','GROQ_API_KEY','TEAMBOOK_PET_AI','TEAMBOOK_PET_VISION','TEAMBOOK_PET_TEXT_MODEL','TEAMBOOK_PET_VISION_MODEL','TEAMBOOK_PET_WAKE_CONCURRENCY','RESEND_API_KEY','TEAMBOOK_FROM_EMAIL','TEAMBOOK_ADMIN_PASSWORD','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','LINE_CHANNEL_ID','LINE_CHANNEL_SECRET']
          lines=[]
          if not token:
              lines.append('vercel_token=no')
          else:
              url=f'https://api.vercel.com/v9/projects/{project}/env?teamId={team}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=json.loads(r.read().decode() or '{}')
                  envs=data.get('envs') or data.get('env') or []
                  keys={str(e.get('key','')) for e in envs}
                  lines.append('vercel_token=yes')
                  for k in wanted: lines.append(f'{k}=' + ('yes' if k in keys else 'no'))
              except urllib.error.HTTPError as e:
                  lines.append('vercel_token=yes')
                  lines.append(f'vercel_env_api=http_{e.code}')
              except Exception:
                  lines.append('vercel_token=yes')
                  lines.append('vercel_env_api=error')
          open('.github/teambook-env-status.txt','w').write('\n'.join(lines)+'\n')
          PY
      - name: Commit report and remove workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/teambook-env-check-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/teambook-env-status.txt .github/workflows/teambook-env-check-once.yml
          git commit -m "chore(teambook): record safe env presence check"
          git push origin HEAD:main
