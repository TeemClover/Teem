name: Add host profile to Journey

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-host-profile-to-journey.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch Journey Funnel
        run: python tools/patch-host-profile-journey.py
      - name: Commit patch
        run: |
          git diff --check
          grep -F "home-host-profile" core7/backend/analytics-v11.js
          grep -F "metric('พบเจ้าบ้าน'" stat/journey/index.html
          rm -f tools/patch-host-profile-journey.py .github/workflows/add-host-profile-to-journey.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core7/backend/analytics-v11.js stat/journey/index.html tools/patch-host-profile-journey.py .github/workflows/add-host-profile-to-journey.yml
          git commit -m "feat(stat): show host profile clicks in Journey Funnel"
          git push origin HEAD:main
