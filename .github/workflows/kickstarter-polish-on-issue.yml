name: Kickstarter polish on issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  polish:
    if: github.event.issue.title == '[automation] Kickstarter polish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet Pillow

      - name: Apply polished campaign changes
        run: python scripts/kickstarter_polish.py

      - name: Validate JavaScript, images, copy and terminology
        shell: bash
        run: |
          set -euxo pipefail
          node --check kickstarter/kickstarter-base.js
          node --check kickstarter/kickstarter.js
          node --check kickstarter/kickstarter-distilled.js
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          names = [
              'removing-rules.webp',
              'one-box-ritual.webp',
              'first-meeting.webp',
              'core7-set-memory.webp',
              'founder-daughter.webp',
              'built-to-ship.webp',
          ]
          for name in names:
              path = Path('kickstarter/assets/story') / name
              with Image.open(path) as image:
                  image.load()
                  assert image.size == (1200, 750), (name, image.size)
              assert path.stat().st_size > 5000, (name, path.stat().st_size)
              print(name, path.stat().st_size)
          PY
          grep -n '100% DECISIONS' kickstarter/index.html
          grep -n 'id="name-origin"' kickstarter/index.html
          grep -n 'CORE7 MATCH' kickstarter/index.html
          grep -n 'CORE7 SET' kickstarter/index.html
          grep -n 'core7-set-memory.webp' kickstarter/index.html
          ! grep -R -n -E 'CORE7BO5|Quick Play|Best-of-5' core7 --include='*.md'

      - name: Commit validated campaign
        shell: bash
        run: |
          git config user.name 'TeemClover Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Kickstarter story, naming and CORE7 terminology'
          git push origin HEAD:main

      - name: Close automation issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Validated campaign polish committed to main."
