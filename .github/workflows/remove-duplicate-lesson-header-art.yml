name: Remove duplicate lesson header art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-duplicate-lesson-header-art.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove only the duplicate top figure from lessons 2-5
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = {
              'classroom/image-ai.html': 'header-lesson2.jpeg',
              'classroom/clip-ai.html': 'header-lesson3.jpeg',
              'classroom/notebooklm.html': 'header-lesson4.jpeg',
              'classroom/prompts.html': 'header-lesson5.jpeg',
          }

          style_re = re.compile(r'\n?<style id="classroom-lesson-header-image-style">.*?</style>\n?', re.S)
          figure_re = re.compile(
              r'\n?\s*<figure class="classroom-lesson-header-image"[^>]*>\s*'
              r'<img\s+src="/classroom/img/(?P<img>header-lesson[2-5]\.jpeg)"[^>]*>\s*'
              r'</figure>\s*\n?',
              re.S,
          )

          for filename, expected_img in targets.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              matches = list(figure_re.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'{filename}: expected exactly 1 duplicate top figure, found {len(matches)}')
              if matches[0].group('img') != expected_img:
                  raise SystemExit(f'{filename}: wrong image in duplicate figure: {matches[0].group("img")}')

              text, figure_count = figure_re.subn('\n', text, count=1)
              text, style_count = style_re.subn('\n', text, count=1)
              if figure_count != 1 or style_count != 1:
                  raise SystemExit(f'{filename}: cleanup count mismatch figure={figure_count} style={style_count}')

              # Guardrails: keep the real lesson header and connected hero artwork.
              if '<header class="head">' not in text:
                  raise SystemExit(f'{filename}: lesson head disappeared')
              if 'classroom-lesson-header-image' in text:
                  raise SystemExit(f'{filename}: duplicate figure/style marker still present')

              path.write_text(text, encoding='utf-8')
              print(f'cleaned {filename}')

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom/image-ai.html classroom/clip-ai.html classroom/notebooklm.html classroom/prompts.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(classroom): remove duplicate top art from lessons 2-5"
          git push origin HEAD:main
