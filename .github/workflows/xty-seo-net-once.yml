name: XTY SEO net once

on:
  push:
    paths:
      - '.github/workflows/xty-seo-net-once.yml'

permissions:
  contents: write

jobs:
  update-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build SEO net
        run: python3 .github/scripts/xty_seo_net.py
      - name: Commit and clean up
        run: |
          rm -f .github/workflows/xty-seo-net-once.yml .github/scripts/xty_seo_net.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xty sitemap.xml .github/workflows/xty-seo-net-once.yml .github/scripts/xty_seo_net.py
          git commit -m "Build XTY search discovery net"
          git push origin HEAD:main
