name: XTY Pet Wake

on:
  schedule:
    # 00:27 · 06:27 · 12:27 · 18:27 Asia/Bangkok (ICT = UTC+7)
    - cron: '27 5,11,17,23 * * *'
  workflow_dispatch:

concurrency:
  group: xty-pet-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake XTY pets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          url="https://www.myclover.com/api/xty-pet"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            url="${url}?force=1"
          fi

          response="$(curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "${url}")"

          echo "$response"
