name: XTY Pet Wake

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xty-pet-wake.yml'

concurrency:
  group: xty-pet-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake XTY pets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          # This manual action is a production health check. It runs the same
          # due-room scheduler as Vercel Cron instead of force-waking one random
          # recent party. Vercel is the single automatic scheduler at :27 ICT.
          response="$(curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "https://www.myclover.com/api/xty-pet")"

          echo "$response"

          RESPONSE="$response" python - <<'PY'
          import json, os, sys
          data = json.loads(os.environ['RESPONSE'])
          if not data.get('ok'):
              print('PET wake endpoint returned ok=false')
              sys.exit(1)
          if not data.get('ai'):
              print('XTY PET AI is not configured in production')
              sys.exit(1)
          if int(data.get('providerFailures') or 0) > 0:
              print('PET provider failures detected:', data.get('providerFailures'))
              sys.exit(1)
          if int(data.get('deferred') or 0) > 0:
              print('PET turns were deferred:', data.get('deferred'))
              sys.exit(1)
          print('PET scheduler healthy:', json.dumps(data, ensure_ascii=False))
          PY
