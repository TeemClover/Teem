name: Fix classroom single header art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-classroom-single-header-art.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            classroom/image-ai.html
            classroom/clip-ai.html
            classroom/notebooklm.html
            classroom/prompts.html
            assets/notebooklm-hero-position.js
            assets/classroom-hero-consistency.js
            tools/fix_classroom_single_header_art.py

      - name: Repair lessons 2-5 header art
        run: python tools/fix_classroom_single_header_art.py

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom/image-ai.html classroom/clip-ai.html classroom/notebooklm.html classroom/prompts.html assets/notebooklm-hero-position.js assets/classroom-hero-consistency.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(classroom): keep one connected header image in lessons 2-5"
          git push origin HEAD:main
