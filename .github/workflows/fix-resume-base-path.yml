name: Fix resume base path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-resume-base-path.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Add stable base URL for resume
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('resume/index.html')
          s=p.read_text(encoding='utf-8')
          base='<base href="/resume/">'
          if base not in s:
              marker='<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
              if marker not in s:
                  raise SystemExit('resume viewport marker not found')
              s=s.replace(marker, marker+'\n'+base, 1)
          assert s.count(base)==1
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -F '<base href="/resume/">' resume/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(resume): make relative assets work without trailing slash"
          git push origin HEAD:main
