name: XTY Legacy Brand Freeze

on:
  push:
    paths:
      - '.github/workflows/xty-legacy-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze XTY as legacy TeamBook development snapshot
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('xty')
          changed = []

          asset_replacements = {
              '/xty/assets/brand/teambook-logo.png': '/xty/assets/xty-logo.png',
              '/xty/assets/brand/teambook-icon-512.png': '/xty/assets/xty-logo.png',
              '/xty/assets/brand/teambook-mark-256.png': '/xty/assets/xty-logo.png',
              '/xty/assets/brand/teambook-icon-180.png': '/xty/assets/xty-logo.png',
              '/xty/assets/brand/teambook-og-1200x630.jpg': '/xty/assets/xty-og-share-1200x630.jpg',
          }

          for path in sorted(root.rglob('*.html')):
              before = path.read_text(encoding='utf-8')
              text = before

              # Retire the TeamBook-specific ICO on the myClover host. The PNG
              # favicon below is rewritten to the original XTY logo.
              text = re.sub(
                  r'^[ \t]*<link rel="icon" href="/xty/assets/brand/favicon\.ico" sizes="any">[ \t]*\n?',
                  '', text, flags=re.MULTILINE
              )

              for old, new in asset_replacements.items():
                  text = text.replace(old, new)

              # Brand only: keep all notebook-language vocabulary and behavior.
              text = text.replace('TEAMBOOK', 'XTY LEGACY')
              text = text.replace('TeamBook', 'XTY Legacy')

              if text != before:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          marker = root / 'LEGACY.md'
          marker_text = '''# XTY Legacy\n\nXTY is preserved as the development-stage ancestor of TeamBook.\n\n- Public legacy surface: `/xty/` on myClover\n- Brand shown here: **XTY Legacy**\n- Canonical logo: `/xty/assets/xty-logo.png`\n- Canonical legacy share art: `/xty/assets/xty-og-share-1200x630.jpg`\n- Notebook-language UX (สมุด, ลงชื่อ, เห็นแล้ว, คนในสมุด) is intentionally preserved.\n- Current TeamBook lives independently under `/teambook/` and `teambook.me`; XTY must not import current TeamBook brand assets.\n- Keep this surface as a historical/teaching snapshot unless an explicit legacy-maintenance change is requested.\n'''
          if not marker.exists() or marker.read_text(encoding='utf-8') != marker_text:
              marker.write_text(marker_text, encoding='utf-8')
              changed.append(str(marker))

          print(f'Changed {len(changed)} files')
          for p in changed:
              print(p)

          # Guardrails: no current TeamBook brand asset refs may remain in XTY HTML.
          leftovers = []
          for path in sorted(root.rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              if '/xty/assets/brand/teambook-' in text or '/xty/assets/brand/favicon.ico' in text:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Legacy brand refs remain: ' + ', '.join(leftovers))

          if not (root / 'assets' / 'xty-logo.png').exists():
              raise SystemExit('Missing canonical XTY logo')
          if not (root / 'assets' / 'xty-og-share-1200x630.jpg').exists():
              raise SystemExit('Missing canonical XTY share art')

      - name: Commit legacy freeze
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xty
          git commit -m "chore(xty): freeze legacy branding"
          git push origin HEAD:main
