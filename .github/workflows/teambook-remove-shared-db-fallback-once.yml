name: TeamBook remove shared DB fallback once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teambook-remove-shared-db-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove forbidden shared database fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('teambook/api/_lib/core.js')
          text = p.read_text()
          old = "    process.env.DATABASE_URL,\n"
          if old not in text:
              raise SystemExit('DATABASE_URL fallback not found')
          p.write_text(text.replace(old, '', 1))
          PY

          cd teambook
          npm ci
          npm run build

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-remove-shared-db-fallback-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teambook/api/_lib/core.js .github/workflows/teambook-remove-shared-db-fallback-once.yml
          git commit -m "fix(teambook): restore isolated database boundary"
          git push origin HEAD:main