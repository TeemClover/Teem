name: X-VISOR QUEST 2.0 Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'xvisor/**'
      - 'tests/xvisor/**'
      - '.vercelignore'
      - 'api/xvisor-scores.js'
      - 'package.json'
      - '.github/workflows/xvisor-1.0-release.yml'
  push:
    branches: [main]
    paths:
      - 'xvisor/**'
      - 'tests/xvisor/**'
      - '.vercelignore'
      - 'api/xvisor-scores.js'
      - 'package.json'
      - '.github/workflows/xvisor-1.0-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check active 2.0 release modules
        run: |
          node --check xvisor/quest/game-boot.js
          node --check xvisor/quest/game-action-scenes.js
          node --check xvisor/quest/game-action-peek.js
          node --check xvisor/quest/game-mentor-art.js
          node --check xvisor/quest/game-narrative-data.js
          node --check xvisor/quest/game-portrait.js
          node --check xvisor/quest/game-story.js
          node --check xvisor/quest/game-actions.js
          node --check xvisor/quest/game-art.js
          node --check xvisor/quest/game-engine.js
          node --check xvisor/quest/game-panels.js
          node --check xvisor/quest/game-presentation.js
          node --check xvisor/quest/game-world.js
          node --check xvisor/quest/game-audio.js
          node --check xvisor/quest/game-commercial-config.js
          node --check xvisor/quest/game-copy.js
          node --check xvisor/quest/game-data.js
          node --check xvisor/quest/game-exam.js
          node --check xvisor/quest/game-people.js
          node --check xvisor/quest/game-progression.js
          node --check xvisor/quest/game-save.js
          node --check xvisor/quest/game-ui.js
          node --check api/xvisor-scores.js
      - name: X-VISOR 2.0 tests
        run: npm run test:xvisor
