name: X-VISOR QUEST 1.0 Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'xvisor/**'
      - 'api/xvisor-scores.js'
      - 'package.json'
      - '.github/workflows/xvisor-1.0-release.yml'
  push:
    branches: [main]
    paths:
      - 'xvisor/**'
      - 'api/xvisor-scores.js'
      - 'package.json'
      - '.github/workflows/xvisor-1.0-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check active 1.0b release modules
        run: |
          node --check xvisor/quest/game.js
          node --check xvisor/quest/game-audio.js
          node --check xvisor/quest/game-data-v1b-core.js
          node --check xvisor/quest/game-copy-v9a.js
          node --check xvisor/quest/game-v9-ui.js
          node --check xvisor/quest/game-v1-ui.js
          node --check xvisor/quest/game-1b-final.js
          node --check api/xvisor-scores.js
      - name: X-VISOR 1.0b tests
        run: npm run test:xvisor
