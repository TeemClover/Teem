name: TeamBook identity response fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teambook-identity-response-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix identity action response
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('teambook/api/_lib/xty-member-actions-v2.js')
          text = p.read_text()
          old1 = "if (!aliasChanged && !avatarChanged) return sendJson(res, await stateViaLegacy(legacyXtyHandler, req, code));"
          new1 = "if (!aliasChanged && !avatarChanged) return sendJson(res, { ok: true, changed: false });"
          old2 = "    return sendJson(res, await stateViaLegacy(legacyXtyHandler, req, code));\n  } catch (error) {\n    console.error('TeamBook identity v2 failed', error);"
          new2 = "    return sendJson(res, { ok: true, changed: true });\n  } catch (error) {\n    console.error('TeamBook identity v2 failed', error);"
          if old1 not in text:
              raise SystemExit('identity no-change response not found')
          text = text.replace(old1, new1, 1)
          # Target the identity handler occurrence only: replace the first occurrence after handleIdentityV2.
          idx = text.find('export async function handleIdentityV2')
          if idx < 0:
              raise SystemExit('handleIdentityV2 not found')
          before, tail = text[:idx], text[idx:]
          if old2 not in tail:
              raise SystemExit('identity success response not found')
          tail = tail.replace(old2, new2, 1)
          p.write_text(before + tail)
          PY

          node --check teambook/api/_lib/xty-member-actions-v2.js
          cd teambook && npm ci && npm run build

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-identity-response-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teambook/api/_lib/xty-member-actions-v2.js .github/workflows/teambook-identity-response-fix-once.yml
          git commit -m "fix(teambook): return identity update success directly"
          git push origin HEAD:main
