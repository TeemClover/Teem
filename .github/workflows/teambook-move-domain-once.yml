name: Move TeamBook domains to dedicated project once

on:
  push:
    paths:
      - '.github/workflows/teambook-move-domain-once.yml'

permissions:
  contents: write

jobs:
  move-domains:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repository secret is missing"
            exit 2
          fi

      - name: Move TeamBook production domains
        shell: bash
        run: |
          npx --yes vercel@latest domains add teambook.me teambook --force --scope teemclover --token "$VERCEL_TOKEN"
          npx --yes vercel@latest domains add www.teambook.me teambook --force --scope teemclover --token "$VERCEL_TOKEN"

      - name: Remove TeamBook host routing from root project
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('vercel.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          hosts = {'teambook.me', 'www.teambook.me'}

          def host_value(rule):
              for h in rule.get('has', []):
                  if h.get('type') == 'host':
                      return h.get('value')
              return None

          data['redirects'] = [r for r in data.get('redirects', []) if host_value(r) not in hosts]
          data['rewrites'] = [r for r in data.get('rewrites', []) if host_value(r) not in hosts]

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool vercel.json >/dev/null

      - name: Commit clean separation and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-move-domain-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json .github/workflows/teambook-move-domain-once.yml
          git commit -m "fix(teambook): separate dedicated Vercel project"
          git push origin HEAD:main
