name: TeamBook root rewrite fix once

on:
  push:
    paths:
      - '.github/workflows/teambook-root-rewrite-fix-once.yml'

permissions:
  contents: write

jobs:
  fix-root-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore explicit TeamBook root rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('vercel.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          host = [{'type': 'host', 'value': 'www.teambook.me'}]
          root_rule = {
              'source': '/',
              'has': host,
              'destination': '/teambook/index.html',
          }

          rewrites = data.get('rewrites', [])
          rewrites = [
              r for r in rewrites
              if not (
                  r.get('source') == '/'
                  and any(h.get('type') == 'host' and h.get('value') == 'www.teambook.me' for h in r.get('has', []))
              )
          ]
          rewrites.insert(0, root_rule)
          data['rewrites'] = rewrites
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate routing
        run: |
          python3 -m json.tool vercel.json >/dev/null
          grep -q '"destination": "/teambook/index.html"' vercel.json

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-root-rewrite-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json .github/workflows/teambook-root-rewrite-fix-once.yml
          git commit -m "fix(teambook): restore root rewrite before catch-all"
          git push origin HEAD:main
