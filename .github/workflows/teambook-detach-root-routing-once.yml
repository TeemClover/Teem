name: Detach TeamBook routing from root once

on:
  push:
    paths:
      - '.github/workflows/teambook-detach-root-routing-once.yml'

permissions:
  contents: write

jobs:
  detach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove TeamBook host-specific routing from root project
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('vercel.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          targets = {'teambook.me', 'www.teambook.me'}

          def host_value(rule):
              for item in rule.get('has', []):
                  if item.get('type') == 'host':
                      return item.get('value')
              return None

          data['redirects'] = [
              rule for rule in data.get('redirects', [])
              if host_value(rule) not in targets
          ]
          data['rewrites'] = [
              rule for rule in data.get('rewrites', [])
              if host_value(rule) not in targets
          ]

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate config
        run: python3 -m json.tool vercel.json >/dev/null

      - name: Commit cleanup and remove this workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-detach-root-routing-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json .github/workflows/teambook-detach-root-routing-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(teambook): detach root host routing"
          git push origin HEAD:main
