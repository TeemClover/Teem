name: Lesson 4 surgical source UI patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lesson4-surgical-source-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Lesson 4
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('classroom/notebooklm.html'); s=p.read_text('utf-8')
          assert s.startswith('<!doctype html>') and '{% capture' not in s and '{% include' not in s
          style='<style id="lesson4-source-ui-fix">\n.source-choice-note{margin:0 0 14px!important}\n.source-sample-card .getsrc{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}\n.source-sample-card .btn{width:100%;min-height:42px;padding:10px 12px}\n.source-sample-card .msg{margin-top:8px}.source-sample-card .hint{margin-top:7px}\n.source-warning{margin:16px 0;padding:14px 16px;border:2px solid rgb(var(--red));border-radius:14px;background:rgb(var(--red)/.08);color:#7d1717}\n.source-warning b{color:rgb(var(--red));font-weight:800}\n</style>\n'
          assert s.count('</head>')==1; s=s.replace('</head>',style+'</head>',1)
          old='<h2 class="section" id="source"><span class="n">3</span>เลือกซอสที่จะเอาเข้าครัว</h2>\n<div class="grid3"><article class="card"><span class="tag">ทาง A · ดีที่สุด</span><h3>ใช้ซอสของตัวเอง</h3><p>หยิบซอสจากบท 1 ที่ผ่านการชิมในบท 2 แล้ว งานที่แตกออกมาจะมีตัวตนของคุณจริงที่สุด</p></article><article class="card"><span class="tag">ทาง B · เร็วที่สุด</span><h3>วางเป็น Copied text</h3><p>ใช้เมื่อแอปหรืออุปกรณ์ไม่รับ <code>.md</code> ก๊อปข้อความทั้งก้อนแล้ววางแทนได้</p></article><article class="card hi"><span class="tag">ทาง C · ลองก่อน</span><h3>ใช้ซอสต้นฉบับเดิม</h3><p>ไฟล์ myclover / GLHF / GrowthOS ตัวเดิมที่สร้างภาพและสไลด์ตัวอย่างด้านล่าง</p></article></div>\n<div class="getsrc"><a class="btn" href="lv4/myclover_GLHF_7C_GrowthOS_Source.md" download>⬇️ ดาวน์โหลดซอส (.md)</a><button class="btn alt" type="button" id="copySrc">📋 คัดลอกทั้งไฟล์</button><a class="btn alt" href="lv4/myclover_GLHF_7C_GrowthOS_Source.md" target="_blank" rel="noopener">👀 เปิดอ่าน</a></div><p class="msg" id="srcMsg" role="status" aria-live="polite"></p><p class="hint">ดาวน์โหลดไม่ได้หรือแอปไม่รับ <code>.md</code> ไม่เป็นไร กดคัดลอกแล้วเลือก <b>Copied text</b> ได้เลย</p>'
          new='<h2 class="section" id="source"><span class="n">3</span>เลือกซอสที่จะเอาเข้าครัว</h2>\n<div class="note g source-choice-note">ใช้ซอสตัวเองจากบทที่ 1 หรือจะใช้ซอสตัวอย่างที่มีให้ในบทแทนก็ได้</div>\n<div class="grid3"><article class="card"><span class="tag">ทาง A · ดีที่สุด</span><h3>ใช้ซอสของตัวเอง</h3><p>หยิบซอสจากบท 1 ที่ผ่านการชิมในบท 2 แล้ว งานที่แตกออกมาจะมีตัวตนของคุณจริงที่สุด</p></article><article class="card"><span class="tag">ทาง B · เร็วที่สุด</span><h3>วางเป็น Copied text</h3><p>ใช้เมื่อแอปหรืออุปกรณ์ไม่รับ <code>.md</code> ก๊อปข้อความทั้งก้อนแล้ววางแทนได้</p></article><article class="card hi source-sample-card"><span class="tag">ทาง C · ลองก่อน</span><h3>ซอสตัวอย่างของบทนี้ (.md)</h3><p>ไฟล์ myclover / GLHF / GrowthOS ที่ใช้สร้างหลักสูตรนี้ขึ้นมา</p><div class="getsrc"><a class="btn" href="lv4/myclover_GLHF_7C_GrowthOS_Source.md" download>⬇️ ดาวน์โหลดซอส (.md)</a><button class="btn alt" type="button" id="copySrc">📋 คัดลอกทั้งไฟล์</button><a class="btn alt" href="lv4/myclover_GLHF_7C_GrowthOS_Source.md" target="_blank" rel="noopener">👀 เปิดอ่าน</a></div><p class="msg" id="srcMsg" role="status" aria-live="polite"></p><p class="hint">ดาวน์โหลดไม่ได้หรือแอปไม่รับ <code>.md</code> ไม่เป็นไร กดคัดลอกแล้วเลือก <b>Copied text</b> ได้เลย</p></article></div>'
          assert s.count(old)==1; s=s.replace(old,new,1)
          old2='<details class="prompt-library"><summary>🧂 ใช้ AI ตัวอื่นอยู่?</summary><div class="prompt-library__body">\n<div class="note g">เลือก Prompt ด้านล่าง กดคัดลอก แล้ววางในช่องคำสั่งเพิ่มเติมได้เลย</div>'
          new2='<details class="prompt-library"><summary>🧂 ใช้ AI ตัวอื่นอยู่?</summary><div class="prompt-library__body">\n<div class="source-warning"><b>⚠️ อย่าลืมแนบซอส</b><br>ใช้ Prompt ด้านล่างกับ AI ตัวอื่น ให้แนบซอสจากบทที่ 1 หรือซอสตัวอย่างของบทนี้ไปพร้อมกันด้วย</div>\n<div class="note g">เลือก Prompt ด้านล่าง กดคัดลอก แล้ววางในช่องคำสั่งเพิ่มเติมได้เลย</div>'
          assert s.count(old2)==1; s=s.replace(old2,new2,1)
          assert s.count('id="copySrc"')==1 and s.count('id="srcMsg"')==1 and s.count('<div class="source-warning">')==1
          p.write_text(s,'utf-8')
          PY
          git diff --check -- classroom/notebooklm.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom/notebooklm.html
          test "$(git diff --cached --name-only)" = "classroom/notebooklm.html"
          git commit -m "fix(classroom): clarify lesson 4 source choices"
          git push origin main
