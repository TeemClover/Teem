name: Patch classroom lesson header images

on:
  push:
    paths:
      - '.github/workflows/patch-classroom-lesson-headers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed lesson header images in HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = {
              'classroom/lesson-0.html': (0, 'header-lesson0.jpeg'),
              'classroom/free-ai.html': (1, 'header-lesson1.jpeg'),
              'classroom/image-ai.html': (2, 'header-lesson2.jpeg'),
              'classroom/clip-ai.html': (3, 'header-lesson3.jpeg'),
              'classroom/notebooklm.html': (4, 'header-lesson4.jpeg'),
              'classroom/prompts.html': (5, 'header-lesson5.jpeg'),
              'classroom/first-web.html': (6, 'header-lesson6.jpeg'),
          }

          style = '''
          <style id="classroom-lesson-header-image-style">
          .classroom-lesson-header-image{display:block;width:100%;max-width:100%;margin:26px 0 14px;border-radius:24px;overflow:hidden;background:#fff;border:1px solid rgba(18,40,28,.10);box-shadow:0 20px 54px rgba(10,40,24,.12)}
          .classroom-lesson-header-image img{display:block;width:100%;max-width:100%;height:auto;object-fit:contain}
          @media(max-width:560px){.classroom-lesson-header-image{margin:20px 0 12px;border-radius:18px}}
          </style>
          '''

          for filename, (lesson, image) in pages.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              # Remove a previous standardized block if this workflow is ever rerun.
              text = re.sub(r'\s*<style id="classroom-lesson-header-image-style">.*?</style>\s*', '\n', text, flags=re.S)
              text = re.sub(r'\s*<figure class="classroom-lesson-header-image".*?</figure>\s*', '\n', text, flags=re.S)

              # Lesson 1 previously had the prologue image embedded inside its old hero.
              # Remove that one so the page has exactly one canonical header image.
              if lesson == 1:
                  text = re.sub(r'\s*<div class="head-prologue">\s*<img\b[^>]*>\s*</div>\s*', '\n', text, flags=re.S | re.I)

              if '</head>' not in text:
                  raise RuntimeError(f'{filename}: missing </head>')
              text = text.replace('</head>', style + '\n</head>', 1)

              main = re.search(r'<main\b[^>]*>', text, flags=re.I)
              if not main:
                  raise RuntimeError(f'{filename}: missing <main>')

              # header-lesson5.jpeg has not been uploaded yet. Keep the canonical
              # path ready, but remove the figure cleanly in-browser until it exists.
              fallback = ' onerror="this.closest(\'figure\').remove()"' if lesson == 5 else ''
              figure = (
                  f'\n  <figure class="classroom-lesson-header-image">\n'
                  f'    <img src="/classroom/img/{image}" alt="ภาพหัวบท {lesson} · AI ใส่ซอส" '
                  f'loading="eager" decoding="async" fetchpriority="high"{fallback}>\n'
                  f'  </figure>\n'
              )
              text = text[:main.end()] + figure + text[main.end():]
              path.write_text(text, encoding='utf-8')

          # Assertions: all seven HTML files carry exactly one canonical header path.
          for filename, (lesson, image) in pages.items():
              text = Path(filename).read_text(encoding='utf-8')
              expected = f'/classroom/img/{image}'
              if text.count(expected) != 1:
                  raise RuntimeError(f'{filename}: expected exactly one {expected}')
              if text.count('classroom-lesson-header-image') < 2:  # CSS + figure
                  raise RuntimeError(f'{filename}: standardized header missing')

          if '/classroom/sauce-cup/header-prologue.jpeg' in Path('classroom/free-ai.html').read_text(encoding='utf-8'):
              raise RuntimeError('lesson 1 still points to sauce-cup/header-prologue.jpeg')
          PY

      - name: Commit lesson header updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom/lesson-0.html classroom/free-ai.html classroom/image-ai.html classroom/clip-ai.html classroom/notebooklm.html classroom/prompts.html classroom/first-web.html
          if git diff --cached --quiet; then
            echo "No lesson header changes needed"
            exit 0
          fi
          git commit -m "fix(classroom): align header images across lessons 0-6"
          git push origin HEAD:main
