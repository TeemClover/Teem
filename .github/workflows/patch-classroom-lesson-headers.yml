name: Patch classroom lesson header images

on:
  push:
    paths:
      - '.github/workflows/patch-classroom-lesson-headers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed lesson header images in HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = {
              'classroom/lesson-0.html': (0, 'header-lesson0.jpeg', 'hero'),
              'classroom/free-ai.html': (1, 'header-lesson1.jpeg', 'head'),
              'classroom/image-ai.html': (2, 'header-lesson2.jpeg', 'head'),
              'classroom/clip-ai.html': (3, 'header-lesson3.jpeg', 'head'),
              'classroom/notebooklm.html': (4, 'header-lesson4.jpeg', 'head'),
              'classroom/prompts.html': (5, 'header-lesson5.jpeg', 'head'),
              'classroom/first-web.html': (6, 'header-lesson6.jpeg', 'head'),
          }

          style = '''
          <style id="classroom-lesson-header-image-style">
          .classroom-lesson-header-image{position:relative;z-index:2;display:block;overflow:hidden;background:#071a10;border-bottom:1px solid rgba(255,255,255,.09)}
          .classroom-lesson-header-image img{display:block;width:100%;max-width:100%;height:auto;object-fit:contain}
          .head>.classroom-lesson-header-image{width:calc(100% + 68px);max-width:none;margin:-36px -34px 28px}
          .hero>.classroom-lesson-header-image{width:calc(100% + (2 * clamp(28px,6vw,46px)));max-width:none;margin:calc(-1 * clamp(28px,6vw,46px)) calc(-1 * clamp(28px,6vw,46px)) 26px}
          @media(max-width:560px){
            .head>.classroom-lesson-header-image{width:calc(100% + 44px);margin:-26px -22px 22px}
          }
          </style>
          '''

          def find_target(text, target_class, filename):
              pattern = re.compile(
                  r'<(?:header|section|div)\b[^>]*class=["\'][^"\']*\b' + re.escape(target_class) + r'\b[^"\']*["\'][^>]*>',
                  flags=re.I
              )
              match = pattern.search(text)
              if not match:
                  raise RuntimeError(f'{filename}: missing .{target_class} header container')
              return match

          for filename, (lesson, image, target_class) in pages.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              # Make reruns idempotent.
              text = re.sub(r'\s*<style id="classroom-lesson-header-image-style">.*?</style>\s*', '\n', text, flags=re.S)
              text = re.sub(r'\s*<figure class="classroom-lesson-header-image".*?</figure>\s*', '\n', text, flags=re.S)

              # Lesson 1 used the sauce-cup prologue by mistake. Remove that old block.
              if lesson == 1:
                  text = re.sub(r'\s*<div class="head-prologue">\s*<img\b[^>]*>\s*</div>\s*', '\n', text, flags=re.S | re.I)

              if '</head>' not in text:
                  raise RuntimeError(f'{filename}: missing </head>')
              text = text.replace('</head>', style + '\n</head>', 1)

              target = find_target(text, target_class, filename)

              # Lesson 5 asset is not in classroom/img yet. Reference the correct
              # canonical path now, but hide the frame cleanly until the file exists.
              fallback = ' onerror="this.closest(\'figure\').remove()"' if lesson == 5 else ''
              figure = (
                  f'\n  <figure class="classroom-lesson-header-image">\n'
                  f'    <img src="/classroom/img/{image}" alt="ภาพหัวบท {lesson} · AI ใส่ซอส" '
                  f'loading="eager" decoding="async" fetchpriority="high"{fallback}>\n'
                  f'  </figure>\n'
              )
              text = text[:target.end()] + figure + text[target.end():]
              path.write_text(text, encoding='utf-8')

          for filename, (lesson, image, target_class) in pages.items():
              text = Path(filename).read_text(encoding='utf-8')
              expected = f'/classroom/img/{image}'
              if text.count(expected) != 1:
                  raise RuntimeError(f'{filename}: expected exactly one {expected}')
              if text.count('<figure class="classroom-lesson-header-image">') != 1:
                  raise RuntimeError(f'{filename}: expected exactly one standardized header figure')

          lesson1 = Path('classroom/free-ai.html').read_text(encoding='utf-8')
          if '/classroom/sauce-cup/header-prologue.jpeg' in lesson1:
              raise RuntimeError('lesson 1 still points to sauce-cup/header-prologue.jpeg')
          PY

      - name: Commit lesson header updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom/lesson-0.html classroom/free-ai.html classroom/image-ai.html classroom/clip-ai.html classroom/notebooklm.html classroom/prompts.html classroom/first-web.html
          if git diff --cached --quiet; then
            echo "No lesson header changes needed"
            exit 0
          fi
          git commit -m "fix(classroom): align header images across lessons 0-6"
          git push origin HEAD:main
