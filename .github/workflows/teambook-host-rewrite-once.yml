name: TeamBook host rewrite once

on:
  push:
    paths:
      - '.github/workflows/teambook-host-rewrite-once.yml'

permissions:
  contents: write

jobs:
  update-vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace TeamBook routing with the old XTY-style host rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('vercel.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          # Undo the custom pre-filesystem routes added during the previous attempt.
          data.pop('routes', None)

          def is_teambook_host(rule):
              return any(
                  h.get('type') == 'host' and h.get('value') == 'www.teambook.me'
                  for h in rule.get('has', [])
              )

          host = [{'type': 'host', 'value': 'www.teambook.me'}]

          # Remove the piecemeal TeamBook host rewrites from the previous migration
          # attempt. Keep the global API rewrites unchanged.
          rewrites = [r for r in data.get('rewrites', []) if not is_teambook_host(r)]

          # /api/profile is a public TeamBook alias and must resolve before the
          # catch-all host rewrite, just like the old XTY setup kept API routes first.
          rewrites.insert(0, {
              'source': '/api/profile',
              'has': host,
              'destination': '/api/teambook-profile',
          })

          # This is the exact pattern that previously made xty.myclover.com serve
          # repo/xty internally while the browser stayed on the subdomain:
          #   /:path*  ->  /xty/:path*
          # TeamBook gets the same setup, only with /teambook.
          rewrites.append({
              'source': '/:path*',
              'has': host,
              'destination': '/teambook/:path*',
          })

          data['rewrites'] = rewrites
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JSON
        run: python3 -m json.tool vercel.json >/dev/null

      - name: Commit rewrite and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-host-rewrite-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json .github/workflows/teambook-host-rewrite-once.yml
          git commit -m "fix(teambook): use XTY-style host rewrite"
          git push origin HEAD:main
