name: Patch free ai self contained
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'patch free-ai self-contained')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch lesson one HTML directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('classroom/free-ai.html')
          s = p.read_text(encoding='utf-8')

          old_style = '<style id="classroom-inline-logo">nav a img{width:28px!important;height:28px!important;max-width:28px!important;object-fit:contain;vertical-align:middle;margin-right:8px;flex:none}</style>'
          new_style = '<style id="classroom-inline-logo">nav.top .bk{display:inline-flex;align-items:center;gap:0}nav.top .bk em{font-style:normal;color:rgb(var(--green))}.head-prologue{margin:-36px -34px 28px;overflow:hidden;border-bottom:1px solid rgb(255 255 255/.09)}.head-prologue img{display:block;width:100%;max-width:100%;height:auto}@media(max-width:560px){.head-prologue{margin:-27px -20px 22px}}</style>'
          if old_style not in s:
              raise SystemExit('inline logo style anchor not found')
          s = s.replace(old_style, new_style, 1)

          pattern = r'<a class="bk disp" href="/hall\.html#quest"><img src="data:image/png;base64,[^"]+" alt="" aria-hidden="true"> my<em>clover</em></a>'
          replacement = '<a class="bk disp" href="/" aria-label="myClover">my<em>Clover</em></a>'
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'brand anchor matches={n}')

          hero_anchor = '<header class="head">\n  <div class="headgrid">'
          hero_replace = '<header class="head">\n  <div class="head-prologue"><img src="/classroom/sauce-cup/header-prologue.jpeg?v=20260812-1845" alt="จุดเริ่มต้นจากกระดาษ A4 1 แผ่น สู่ AI ใส่ซอส" loading="eager" decoding="async"></div>\n  <div class="headgrid">'
          if hero_anchor not in s:
              raise SystemExit('hero anchor not found')
          s = s.replace(hero_anchor, hero_replace, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "TeemClover"
          git config user.email "86265222+TeemClover@users.noreply.github.com"
          git add classroom/free-ai.html
          git commit -m "fix: make lesson 1 brand and hero self contained"
          git pull --rebase origin main
          git push origin HEAD:main
