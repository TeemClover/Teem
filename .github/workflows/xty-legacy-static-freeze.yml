name: XTY Legacy Static Cleanup

on:
  push:
    paths:
      - '.xty-legacy-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove XTY favicon and freeze visible legacy brand
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('xty')
          changed = []
          asset_map = {
              '/xty/assets/brand/teambook-logo.png': '/xty/assets/xty-logo.png',
              '/xty/assets/brand/teambook-icon-512.png': '/xty/assets/xty-logo.png',
              '/xty/assets/brand/teambook-mark-256.png': '/xty/assets/xty-logo.png',
              '/xty/assets/brand/teambook-icon-180.png': '/xty/assets/xty-logo.png',
              '/xty/assets/brand/teambook-og-1200x630.jpg': '/xty/assets/xty-og-share-1200x630.jpg',
          }

          block_re = re.compile(r'(<(?:script|style)\b[^>]*>.*?</(?:script|style)>)', re.I | re.S)
          icon_re = re.compile(r'^[ \t]*<link\b[^>]*rel=["\'][^"\']*(?:icon|apple-touch-icon)[^"\']*["\'][^>]*>[ \t]*\n?', re.I | re.M)

          for path in sorted(root.rglob('*.html')):
              before = path.read_text(encoding='utf-8')
              text = before

              # Asset URLs are safe to replace everywhere, including JS strings.
              for old, new in asset_map.items():
                  text = text.replace(old, new)

              # Edit only markup/text outside script/style blocks so no JS identifiers
              # can be damaged by the brand rename.
              parts = block_re.split(text)
              for i in range(0, len(parts), 2):
                  part = parts[i]
                  part = icon_re.sub('', part)
                  part = part.replace('TEAMBOOK', 'XTY LEGACY')
                  part = part.replace('TeamBook', 'XTY Legacy')
                  parts[i] = part
              text = ''.join(parts)

              if text != before:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} XTY HTML files')
          for path in changed:
              print(path)

          # Guardrails: XTY HTML must not carry its own favicon or current TeamBook assets.
          bad_icons = []
          bad_assets = []
          for path in sorted(root.rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              outside = ''.join(block_re.split(text)[::2])
              if re.search(r'<link\b[^>]*rel=["\'][^"\']*(?:icon|apple-touch-icon)', outside, re.I):
                  bad_icons.append(str(path))
              if '/xty/assets/brand/teambook-' in text or '/xty/assets/brand/favicon.ico' in text:
                  bad_assets.append(str(path))

          if bad_icons:
              raise SystemExit('XTY favicon links remain: ' + ', '.join(bad_icons))
          if bad_assets:
              raise SystemExit('Current TeamBook brand assets remain in XTY: ' + ', '.join(bad_assets))

      - name: Commit static legacy cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xty
          git commit -m "chore(xty): make legacy branding static"
          git push origin HEAD:main
