name: XTY visible brand cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xty-visible-brand-fix.yml'

permissions:
  contents: write

jobs:
  rewrite-visible-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace visible TeamBook brand in XTY source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('xty')
          allowed = {'.html', '.js', '.css'}
          # Whole-word brand only. Do not touch lowercase `teambook` paths/API keys
          # or identifiers such as TeamBookLanguage.
          patterns = [
              (re.compile(r'(?<![A-Za-z0-9_$])TeamBook(?![A-Za-z0-9_$])'), 'XTY'),
              (re.compile(r'(?<![A-Za-z0-9_$])TEAMBOOK(?![A-Za-z0-9_$])'), 'XTY'),
          ]
          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              try:
                  before = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              after = before
              for rx, replacement in patterns:
                  after = rx.sub(replacement, after)
              if after != before:
                  path.write_text(after, encoding='utf-8')
                  changed.append(str(path))
          print(f'Changed {len(changed)} files')
          for p in changed:
              print(p)
          PY
      - name: Commit XTY source branding
        run: |
          if git diff --quiet -- xty; then
            echo 'No XTY brand text left to change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xty
          git commit -m 'chore(xty): restore XTY visible branding'
          git push origin HEAD:main
