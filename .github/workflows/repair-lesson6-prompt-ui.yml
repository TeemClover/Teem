name: Repair lesson 6 Prompt UI

on: [push]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'run one-shot lesson 6 prompt UI repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            classroom/first-web.html
            .github/scripts/repair_lesson6_prompt_ui.py
          sparse-checkout-cone-mode: false

      - name: Repair Prompt UI
        run: python .github/scripts/repair_lesson6_prompt_ui.py

      - name: Validate page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('classroom/first-web.html').read_text(encoding='utf-8')
          assert 'ตั้ง `<title>`' not in s
          assert s.count('<script') == s.count('</script>')
          assert 'id="smartPrompt1"' in s and 'id="smartPrompt2"' in s
          assert 'class="prompt-expand"' in s
          assert 'ทำเวปตามซอสนี้' in s
          assert 'id="hardMode"' in s and 'id="glitchTrigger"' in s and 'id="bossDoor"' in s
          assert '/classroom/dungeon/' in s
          m=re.search(r'<script id="lesson6-main-js">(.*?)</script>',s,re.S)
          if m:
              Path('/tmp/lesson6-main.js').write_text(m.group(1),encoding='utf-8')
          PY
          if [ -f /tmp/lesson6-main.js ]; then node --check /tmp/lesson6-main.js; fi
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "TeemClover"
          git config user.email "86265222+TeemClover@users.noreply.github.com"
          git add classroom/first-web.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(classroom): repair lesson 6 Prompt UI and page flow"
          git push origin HEAD:main
