name: XTY clean SEO surfaces once

on:
  push:
    paths:
      - '.github/workflows/xty-clean-seo-surfaces-once.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean play surfaces
        run: python tools/xty-clean-seo-surfaces.py
      - name: Commit cleanup and remove one-time files
        run: |
          rm -f tools/xty-clean-seo-surfaces.py
          rm -f .github/workflows/xty-clean-seo-surfaces-once.yml
          git config user.name "TeemClover"
          git config user.email "86265222+TeemClover@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Separate XTY play UI from SEO content"
          git push origin HEAD:main
