name: Patch home host profile link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-home-host-profile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch home link and stat act
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Homepage: understated inline host link, tracked by existing track.js
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_hint = '<p class="hint" data-i18n="hint">ฟรี · ไม่ต้องสมัคร · แนะนำให้ดูคลิปก่อน</p>'
          new_hint = '<p class="hint"><span data-i18n="hint">ฟรี · ไม่ต้องสมัคร · แนะนำให้ดูคลิปก่อน</span> · <a class="host-link" href="/resume" data-mc-act="home-host-profile" data-i18n="host">พบเจ้าบ้าน</a></p>'
          if old_hint not in s and new_hint not in s:
              raise SystemExit('index.html: hint marker not found')
          s = s.replace(old_hint, new_hint, 1)

          css = '.host-link{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;color:inherit;font:inherit;font-weight:inherit}\n'
          if '.host-link{' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          th_old = '      hint:"ฟรี · ไม่ต้องสมัคร · แนะนำให้ดูคลิปก่อน",\n      stage:"คลิปแนะนำบ้าน · 44 วินาที"'
          th_new = '      hint:"ฟรี · ไม่ต้องสมัคร · แนะนำให้ดูคลิปก่อน",\n      host:"พบเจ้าบ้าน",\n      stage:"คลิปแนะนำบ้าน · 44 วินาที"'
          if th_old in s:
              s = s.replace(th_old, th_new, 1)
          elif 'host:"พบเจ้าบ้าน"' not in s:
              raise SystemExit('index.html: TH i18n marker not found')

          en_old = '      hint:"Free · No sign-up · Watch the intro first",\n      stage:"House introduction · 44 seconds"'
          en_new = '      hint:"Free · No sign-up · Watch the intro first",\n      host:"Meet the host",\n      stage:"House introduction · 44 seconds"'
          if en_old in s:
              s = s.replace(en_old, en_new, 1)
          elif 'host:"Meet the host"' not in s:
              raise SystemExit('index.html: EN i18n marker not found')

          assert 'href="/resume"' in s
          assert 'data-mc-act="home-host-profile"' in s
          p.write_text(s, encoding='utf-8')

          # 2) Central ACT registry: makes backend accept it and stat pages label it.
          p = Path('assets/achievements.js')
          s = p.read_text(encoding='utf-8')
          anchor = "  { id: 'home-compass', stage: 'home', emoji: '🧭', th: 'หยิบเข็มทิศเข้าบ้าน', en: 'Picked up the compass', achievement: true },\n"
          line = "  { id: 'home-host-profile', stage: 'home', emoji: '👤', th: 'กด Profile เจ้าบ้าน', en: 'Opened the host profile', achievement: false },\n"
          if line not in s:
              if anchor not in s:
                  raise SystemExit('assets/achievements.js: home ACT anchor not found')
              s = s.replace(anchor, anchor + line, 1)
          assert s.count("id: 'home-host-profile'") == 1
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          git diff --check
          grep -F 'href="/resume" data-mc-act="home-host-profile"' index.html
          grep -F "id: 'home-host-profile'" assets/achievements.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/achievements.js
          git diff --cached --quiet && exit 0
          git commit -m "feat(home): add tracked host profile link"
          git push origin HEAD:main
