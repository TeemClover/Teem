name: Fix Thai Ending Filename

on:
  push:
    paths:
      - '.github/workflows/fix-thai-ending-filename.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve Thai combining marks in Ending filenames
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('xty/_shared/store.js'),
              Path('teambook/_shared/store.js'),
          ]
          old = ".trim().replace(/[^\\p{L}\\p{N}]+/gu, '-')"
          new = ".normalize('NFC').trim().replace(/[^\\p{L}\\p{M}\\p{N}]+/gu, '-')"

          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 filename sanitizer, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Verify Thai filename sanitizer
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const safe = value => String(value)
            .normalize('NFC')
            .trim()
            .replace(/[^\p{L}\p{M}\p{N}]+/gu, '-')
            .replace(/^-|-$/g, '')
            .slice(0, 60);

          const cases = new Map([
            ['ทีมสร้าง XTY', 'ทีมสร้าง-XTY'],
            ['น้ำใจเพื่อน', 'น้ำใจเพื่อน'],
            ['เรื่องนี้ดีจัง', 'เรื่องนี้ดีจัง'],
          ]);
          for (const [input, expected] of cases) {
            const actual = safe(input);
            if (actual !== expected) throw new Error(`${input} => ${actual}, expected ${expected}`);
          }
          console.log('Thai combining-mark filenames OK');
          NODE

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-thai-ending-filename.yml
          git add xty/_shared/store.js teambook/_shared/store.js
          git commit -m 'fix: preserve Thai marks in Ending filenames'
          git push origin HEAD:main
