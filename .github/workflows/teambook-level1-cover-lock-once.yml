name: TeamBook level1 cover lock once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teambook-level1-cover-lock-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce Level 1 character cover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # The richer cover picker used to run after the LV.1 static cover and
          # replace it with Card Back. Stop it entirely for LV.1.
          replace_once(
              'teambook/_shared/new-cover-v3.js',
              "  if (!host || host.dataset.coverV3 === '1') return;\n  host.dataset.coverV3 = '1'; installStyles(); host.innerHTML = '';\n\n  const profile = getProfile();",
              "  if (!host || host.dataset.coverV3 === '1') return;\n  const profile = getProfile();\n  const levelOne = Math.max(1, Number(profile?.level || 1)) <= 1;\n  if (levelOne) {\n    window.__xtyCoverV2 = { coverType: 'avatar', leadCardId: null };\n    return;\n  }\n  host.dataset.coverV3 = '1'; installStyles(); host.innerHTML = '';"
          )

          # Base create-page logic must key off progression level, not whether
          # this is merely the first book the browser remembers owning.
          replace_once(
              'teambook/new/index.html',
              "  const firstParty = !allParties().some(party => partyIdentity(party.code)?.userId === party.ownerId);",
              "  const levelOne = Math.max(1, Number(profile.level || 1)) <= 1;"
          )
          replace_once('teambook/new/index.html', "  let coverType = firstParty ? 'avatar' : 'card_back';", "  let coverType = levelOne ? 'avatar' : 'card_back';")
          replace_once('teambook/new/index.html', "  let leadCardId = !firstParty && leadCards.some(card => card.cardId === requestedLead) ? requestedLead : null;", "  let leadCardId = !levelOne && leadCards.some(card => card.cardId === requestedLead) ? requestedLead : null;")
          replace_once('teambook/new/index.html', "  if (firstParty) {", "  if (levelOne) {")

          # Make the LV.1 presentation explicitly automatic and non-selectable.
          replace_once(
              'teambook/_shared/create-party-v2.js',
              "    <h2>การ์ดผู้นำสมุด</h2>\n    <p class=\"whisper\" id=\"coverHint\">LV.1 ใช้การ์ดตัวละครเริ่มต้นของคุณเป็นผู้นำสมุดอัตโนมัติ</p>\n    <div class=\"card-select-grid\" id=\"leadPick\" role=\"group\" aria-label=\"การ์ดผู้นำสมุดเริ่มต้น\">\n      <div class=\"card-select picked\" role=\"img\" aria-label=\"ใช้ ${avatar.nameTh} เป็นผู้นำสมุด\">\n        <div class=\"avatar-cover\" data-color=\"${profile.avatarFrame || 'green'}\">\n          <img src=\"${avatar.art}\" alt=\"\">\n          <b>${avatar.nameTh}</b>\n          <small>LV.1 PARTY LEAD</small>\n        </div>\n      </div>\n    </div>`;",
              "    <h2>ปกสมุดของคุณ</h2>\n    <p class=\"whisper\" id=\"coverHint\">Level 1 ใช้การ์ดตัวละครและสีปัจจุบันของคุณเป็นปกอัตโนมัติ · ไม่มีการเลือกปก</p>\n    <div class=\"card-select-grid\" id=\"leadPick\" role=\"group\" aria-label=\"ปกสมุดอัตโนมัติ\">\n      <div class=\"card-select\" role=\"img\" aria-label=\"ใช้ ${avatar.nameTh} เป็นปกสมุดอัตโนมัติ\">\n        <div class=\"avatar-cover\" data-color=\"${profile.avatarFrame || 'green'}\">\n          <img src=\"${avatar.art}\" alt=\"\">\n          <b>${avatar.nameTh}</b>\n          <small>STARTER COVER</small>\n        </div>\n      </div>\n    </div>\n    <p class=\"hint\">เปลี่ยน Avatar และสีได้ก่อนสร้างสมุด · เมื่อสร้างแล้ว ปกของสมุดเล่มนี้จะถูกล็อก</p>`;"
          )

          # Any book created with the forced LV.1 avatar cover is immutable,
          # even after its owner later levels up.
          replace_once(
              'teambook/api/_lib/xty-member-actions-v2.js',
              "    if (member.role !== 'lead') return sendJson(res, { ok: false, error: 'LEAD_REQUIRED' }, 403);\n\n    const body = bodyOf(req); const requested = String(body.coverType || 'card_back').toLowerCase();",
              "    if (member.role !== 'lead') return sendJson(res, { ok: false, error: 'LEAD_REQUIRED' }, 403);\n    if (String(row.cover_type || '').toLowerCase() === 'avatar') {\n      return sendJson(res, { ok: false, error: 'COVER_LOCKED' }, 409);\n    }\n\n    const body = bodyOf(req); const requested = String(body.coverType || 'card_back').toLowerCase();"
          )

          # Hide cover editing controls in the notebook UI for those locked
          # starter covers instead of showing controls that the server rejects.
          replace_once(
              'teambook/_shared/party-profile-covers.js',
              "  if (label && label.textContent !== 'ปกสมุด') label.textContent = 'ปกสมุด';\n\n  const signature = [p.coverType, p.coverValue, p.leadCardId].join('|');",
              "  if (label && label.textContent !== 'ปกสมุด') label.textContent = 'ปกสมุด';\n\n  if (p.coverType === 'avatar') {\n    select.dataset.coverV3 = [p.coverType, p.coverValue, p.leadCardId].join('|');\n    select.innerHTML = '<option selected>การ์ดตัวละครตอนสร้างสมุด · ล็อกแล้ว</option>';\n    select.disabled = true;\n    button.hidden = true;\n    return;\n  }\n  button.hidden = false;\n\n  const signature = [p.coverType, p.coverValue, p.leadCardId].join('|');"
          )

          # Stale clients should still get an intelligible message.
          replace_once(
              'teambook/_shared/party-profile-covers.js',
              "      toast.textContent = result.error === 'CARD_IN_USE'\n        ? 'การ์ดใบนี้กำลังใช้กับสมุดอื่นอยู่'\n        : 'ยังเปลี่ยนปกสมุดไม่ได้';",
              "      toast.textContent = result.error === 'CARD_IN_USE'\n        ? 'การ์ดใบนี้กำลังใช้กับสมุดอื่นอยู่'\n        : result.error === 'COVER_LOCKED'\n          ? 'ปกสมุด Level 1 ถูกล็อกตั้งแต่สร้างสมุดแล้ว'\n          : 'ยังเปลี่ยนปกสมุดไม่ได้';"
          )
          PY

          node --check teambook/_shared/new-cover-v3.js
          node --check teambook/_shared/create-party-v2.js
          node --check teambook/_shared/party-profile-covers.js
          node --check teambook/api/_lib/xty-member-actions-v2.js
          grep -F "const levelOne = Math.max(1, Number(profile.level || 1)) <= 1;" teambook/new/index.html
          grep -F "error: 'COVER_LOCKED'" teambook/api/_lib/xty-member-actions-v2.js

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-level1-cover-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teambook/new/index.html teambook/_shared/new-cover-v3.js teambook/_shared/create-party-v2.js teambook/_shared/party-profile-covers.js teambook/api/_lib/xty-member-actions-v2.js .github/workflows/teambook-level1-cover-lock-once.yml
          git commit -m "fix(teambook): force and lock level1 character cover"
          git push origin HEAD:main
