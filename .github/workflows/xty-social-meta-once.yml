name: XTY social meta once

on:
  push:
    paths:
      - '.github/workflows/xty-social-meta-once.yml'

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add XTY social share metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          IMAGE = 'https://www.myclover.com/xty/assets/xty-og-share-1200x630.jpg'
          TITLE = 'XTY — ตั้งตี้ทำอะไรก็ได้'
          DESC = 'มีอะไรที่อยากทำอยู่ไหม? ชวนเพื่อนมาตั้งตี้ ทำของจริง แล้วกลับมา Commit ด้วยกัน — ตั้งตี้เองหรือหาตี้สาธารณะที่อยากลงมือทำด้วยกันได้เลย'
          ALT = 'XTY — ตั้งตี้ทำอะไรก็ได้ ชวนเพื่อนทำของจริง แล้วกลับมา Commit ด้วยกัน'

          block = f'''<!-- XTY SOCIAL SHARE -->
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="myClover">
          <meta property="og:title" content="{TITLE}">
          <meta property="og:description" content="{DESC}">
          <meta property="og:image" content="{IMAGE}">
          <meta property="og:image:secure_url" content="{IMAGE}">
          <meta property="og:image:type" content="image/jpeg">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta property="og:image:alt" content="{ALT}">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="{TITLE}">
          <meta name="twitter:description" content="{DESC}">
          <meta name="twitter:image" content="{IMAGE}">
          <meta name="twitter:image:alt" content="{ALT}">
          <!-- /XTY SOCIAL SHARE -->'''

          social_patterns = [
              r'\s*<!-- XTY SOCIAL SHARE -->.*?<!-- /XTY SOCIAL SHARE -->\s*',
              r'\s*<meta\s+(?:property|name)=["\'](?:og:[^"\']+|twitter:[^"\']+)["\'][^>]*>\s*',
          ]

          changed = []
          for path in sorted(Path('xty').rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text

              # Remove previous XTY social block and any older standalone OG/Twitter tags
              # so crawlers never see competing images/descriptions.
              text = re.sub(social_patterns[0], '\n', text, flags=re.I | re.S)
              text = re.sub(social_patterns[1], '\n', text, flags=re.I)

              m = re.search(r'</title\s*>', text, flags=re.I)
              if m:
                  text = text[:m.end()] + '\n' + block + text[m.end():]
              else:
                  m = re.search(r'<head[^>]*>', text, flags=re.I)
                  if not m:
                      print(f'SKIP no <head>: {path}')
                      continue
                  text = text[:m.end()] + '\n' + block + text[m.end():]

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} XTY HTML files:')
          for item in changed:
              print(' -', item)
          PY

      - name: Commit metadata and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/xty-social-meta-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xty .github/workflows/xty-social-meta-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add XTY social share metadata"
          git push origin HEAD:main
