name: Restore lesson 2-5 top headers

on: [push]

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, 'run one-shot lesson 2-5 header restore')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            classroom/image-ai.html
            classroom/clip-ai.html
            classroom/notebooklm.html
            classroom/prompts.html
            .github/scripts/restore_lesson2_5_top_headers.py
          sparse-checkout-cone-mode: false

      - name: Restore top lesson images
        run: python .github/scripts/restore_lesson2_5_top_headers.py

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          files={
            'classroom/image-ai.html':2,
            'classroom/clip-ai.html':3,
            'classroom/notebooklm.html':4,
            'classroom/prompts.html':5,
          }
          for f,n in files.items():
              s=Path(f).read_text(encoding='utf-8')
              assert s.count('class="classroom-lesson-header-image"') == 1, f
              assert s.count(f'/classroom/img/header-lesson{n}.jpeg') == 1, f
              assert 'id="classroom-lesson-header-image-style"' in s, f
              assert '<header' in s, f
              print('ok',f)
          PY
          git diff --check

      - name: Commit
        run: |
          git config user.name "TeemClover"
          git config user.email "86265222+TeemClover@users.noreply.github.com"
          git add classroom/image-ai.html classroom/clip-ai.html classroom/notebooklm.html classroom/prompts.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(classroom): restore lesson 2-5 top header images"
          git push origin HEAD:main
