name: Check TeamBook recoverable secrets once

on:
  push:
    paths:
      - '.github/workflows/teambook-secret-presence-once.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAMBOOK_DATABASE_URL: ${{ secrets.TEAMBOOK_DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TEAMBOOK_FROM_EMAIL: ${{ secrets.TEAMBOOK_FROM_EMAIL }}
      TEAMBOOK_ADMIN_PASSWORD: ${{ secrets.TEAMBOOK_ADMIN_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record presence only
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          keys=['VERCEL_TOKEN','TEAMBOOK_DATABASE_URL','BLOB_READ_WRITE_TOKEN','GROQ_API_KEY','RESEND_API_KEY','TEAMBOOK_FROM_EMAIL','TEAMBOOK_ADMIN_PASSWORD','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','LINE_CHANNEL_ID','LINE_CHANNEL_SECRET']
          with open('.github/teambook-secret-presence.txt','w') as f:
              for key in keys:
                  f.write(f"{key}={'yes' if os.environ.get(key,'').strip() else 'no'}\n")
          PY
      - name: Commit safe report and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/teambook-secret-presence-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/teambook-secret-presence.txt .github/workflows/teambook-secret-presence-once.yml
          git commit -m "chore(teambook): record recoverable secret presence"
          git push origin HEAD:main
