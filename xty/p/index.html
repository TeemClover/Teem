<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#FFF9E9">
<title>ตี้ — XTY</title>
<link rel="stylesheet" href="/xty/_shared/xty.css?v=5">
</head>
<body>

<header class="top">
  <a class="mark" href="/xty/"><img src="/xty/assets/xty-logo.png" alt="XTY"></a>
  <a class="back" href="/xty/">ตี้ทั้งหมด</a>
</header>

<main class="wrap">
  <section id="missing" hidden>
    <h1 class="title">ไม่เจอตี้นี้</h1>
    <p class="lede">รหัสอาจพิมพ์ผิด หรือตี้นี้ไม่มีอยู่แล้ว</p>
    <a class="btn ghost" href="/xty/join/">ลองใส่รหัสอีกครั้ง</a>
  </section>

  <section id="view" hidden>
    <div class="card">
      <div>
        <p class="kicker" id="act" style="margin-bottom:6px"></p>
        <h1 class="title" id="pname" style="font-size:clamp(22px,5.5vw,30px);margin:0"></h1>
      </div>

      <div class="rule-box" id="ruleBox">
        <b>WHAT COUNTS AS A COMMIT</b>
        <p id="ruleText"></p>
      </div>

      <!-- The headline is who did the thing today — never an unread count -->
      <div class="today">
        <span class="dots" id="dots" aria-hidden="true"></span>
        <span class="n" id="committedN">0 / 0<small>COMMITTED TODAY</small></span>
        <span class="upd" id="updates"></span>
      </div>

      <div class="commit-bar">
        <button class="btn" id="commitBtn">✓ COMMIT วันนี้</button>
      </div>

      <div class="party-table" id="seats" aria-label="สมาชิกตี้ 5 ที่และ Pet 1 ที่"></div>
      <p class="whisper" id="petLine" style="margin-top:14px"></p>
    </div>

    <div class="card">
      <span class="label">ชวนคนเข้าตี้</span>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="code-chip" id="code"></span>
        <button class="btn ghost sm" id="copy">แชร์คำเชิญ</button>
      </div>
      <p class="hint" id="seatHint" style="margin-top:10px"></p>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span class="label" style="margin:0">PARTY LOG</span>
        <button class="btn ghost sm" id="refresh" style="min-height:36px;padding:0 13px">↻ ดึงอัปเดต</button>
      </div>
      <p class="whisper" style="margin:0">Commit ทุกวัน · Message เมื่อจำเป็น · React ได้ไม่จำกัด</p>

      <div class="log" id="log"></div>

      <div class="composer">
        <textarea id="msg" rows="1" maxlength="2000" placeholder="ฝากไว้ในตี้…" aria-label="Message ถึงตี้"></textarea>
        <button id="send" aria-label="ส่ง Message">↑</button>
      </div>
      <div class="budget" id="budget"></div>
    </div>

    <nav class="tabs">
      <a href="/xty/">XTY</a>
      <a href="/profile/">โปรไฟล์</a>
    </nav>
  </section>
</main>

<!-- commit sheet -->
<div class="card" id="commitSheet" hidden
     style="position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(92vw,560px);z-index:70;background:var(--xty-surface);box-shadow:var(--shadow)">
  <span class="label">COMMIT วันนี้</span>
  <p class="whisper" id="sheetRule" style="margin:0 0 10px"></p>
  <div class="field" style="margin-top:0">
    <textarea id="commitNote" rows="2" maxlength="300" placeholder="เล่าสั้น ๆ ก็ได้ หรือเว้นว่างไว้"></textarea>
    <p class="hint">Commit ไม่กินโควตา Message</p>
  </div>
  <div style="display:flex;gap:9px;margin-top:14px">
    <button class="btn ghost sm" id="commitCancel" style="flex:1">ยกเลิก</button>
    <button class="btn gold sm" id="commitDo" style="flex:2">✓ COMMIT</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module">
import {
  getParty, postToParty, getProfile, toggleReaction, retractPost,
  confirmCommit,
  committedToday, hasCommittedToday, messagesLeftToday, budgetOf,
  messagesUsedToday, dayKey, PARTY_MAX, REACTIONS, refreshParty, partyIdentity,
} from '/xty/_shared/store.js';
import { PET_BY_ID } from '/xty/_shared/pets.js';
import { AVATAR_BY_ID } from '/xty/_shared/avatars.js';

const $ = id => document.getElementById(id);
const code = new URLSearchParams(location.search).get('c');
const me = getProfile();
let myId = (partyIdentity(code) && partyIdentity(code).userId) || (me ? me.id : 'anon');

start();

async function start() {
  if (!code) { $('missing').hidden = false; return; }
  /* A cached party paints immediately; the network only refreshes it. */
  if (getParty(code)) render();
  const fresh = await refreshParty(code);
  if (fresh.error === 'AUTH_REQUIRED') {
    location.replace(`/xty/join/?c=${encodeURIComponent(code)}`);
    return;
  }
  if (fresh.error && !getParty(code)) { $('missing').hidden = false; return; }
  myId = (partyIdentity(code) && partyIdentity(code).userId) || myId;
  if (fresh.error || fresh.party) render();
  if (fresh.error === 'OFFLINE') toast('ออฟไลน์อยู่ — แสดงข้อมูลล่าสุดในเครื่องนี้');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function avatarMarkup(value) {
  const avatar = AVATAR_BY_ID[value];
  return avatar ? `<img src="${avatar.art}" alt="">` : esc(value || '🍀');
}

function stamp(iso) {
  const d = new Date(iso);
  const t = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  if (dayKey(iso) === dayKey()) return t + ' น.';
  return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) + ' · ' + t + ' น.';
}

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2800);
}

function render() {
  const p = getParty(code);
  $('view').hidden = false;
  document.title = p.name + ' — XTY';
  $('pname').textContent = p.name;
  $('act').textContent = p.activity || 'ยังไม่ระบุกิจกรรม';
  $('code').textContent = p.code;

  /* today's state */
  const done = committedToday(p);
  const dots = $('dots');
  dots.innerHTML = '';
  p.members.forEach(m => {
    const i = document.createElement('i');
    if (done.has(m.userId)) i.className = 'on';
    dots.appendChild(i);
  });
  $('committedN').innerHTML =
    `${done.size} / ${p.members.length}<small>COMMITTED TODAY</small>`;

  /* calm phrasing: what is new, not what is owed */
  const todayPosts = p.log.filter(x => dayKey(x.sentAt) === dayKey()).length;
  $('updates').textContent = todayPosts ? `${todayPosts} อัปเดตวันนี้` : 'ยังไม่มีอัปเดตวันนี้';

  if (p.commitRule) {
    $('ruleText').textContent = p.commitRule;
    $('ruleBox').hidden = false;
    $('sheetRule').textContent = p.commitRule;
  } else {
    $('ruleBox').hidden = true;
    $('sheetRule').textContent = 'ตี้นี้ยังไม่ได้ตั้งกติกา — Commit ได้เลยถ้าทำสิ่งที่ตกลงกันแล้ว';
  }

  const already = hasCommittedToday(p, myId);
  const cb = $('commitBtn');
  cb.textContent = already ? '✓ COMMIT แล้ววันนี้' : '✓ COMMIT วันนี้';
  cb.classList.toggle('done', already);
  cb.disabled = already;

  /* Fixed 3×2 table: Lead, four Members, then Pet. Empty human slots and
     the Pet slot remain visible at every viewport width. */
  const seats = $('seats');
  seats.innerHTML = '';
  const lead = p.members.find(m => m.role === 'lead') || null;
  const others = p.members.filter(m => m.role !== 'lead');
  const slots = [lead, others[0] || null, others[1] || null, others[2] || null, others[3] || null];
  slots.forEach((m, index) => {
    const d = document.createElement('div');
    if (!m) {
      d.className = 'seat xty-card open';
      d.innerHTML = `<span class="slot-label">SLOT ${index + 1}</span><div class="av">+</div><div class="al">ที่ว่าง</div>`;
      seats.appendChild(d);
      return;
    }
    const committed = done.has(m.userId);
    d.className = 'seat xty-card' + (m.role === 'lead' ? ' lead' : ' member');
    d.innerHTML =
      `<span class="slot-label">${m.role === 'lead' ? '★ LEAD' : `MEMBER ${index + 1}`}</span>` +
      `<div class="av">${avatarMarkup(m.avatar)}</div>` +
      `<div class="al" title="${esc(m.alias)}">${esc(m.alias)}</div>` +
      `<div class="rl">${m.role === 'lead' ? 'หัวตี้' : 'สมาชิก'}</div>` +
      `<div class="commit-state" aria-label="${committed ? 'Commit แล้ว' : 'ยังไม่ Commit'}">${committed ? '✓' : '○'}</div>`;
    seats.appendChild(d);
  });
  const left = PARTY_MAX - p.members.length;
  $('seatHint').textContent = left > 0
    ? `ยังรับได้อีก ${left} คน (ตี้หนึ่งไม่เกิน ${PARTY_MAX})`
    : 'ตี้เต็มแล้ว — อยากชวนเพิ่มต้องเปิดตี้ใหม่';

  const pet = p.petId ? PET_BY_ID[p.petId] : null;
  const petCard = document.createElement('div');
  petCard.className = 'seat xty-card pet-card' + (pet ? '' : ' open');
  if (pet) {
    petCard.innerHTML =
      '<span class="slot-label">🐾 PET</span>' +
      `<div class="av">${pet.art ? `<img src="${pet.art}" alt="${esc(pet.nameTh)}">` : pet.emoji}</div>` +
      `<div class="al">${esc(pet.nameTh)}</div><div class="rl">เพื่อนประจำตี้</div>`;
    $('petLine').textContent = `${pet.emoji} ${pet.nameTh} — ${pet.persona}`;
  } else {
    petCard.innerHTML = '<span class="slot-label">🐾 PET</span><div class="av">🐾</div><div class="al">เลือกทีหลังได้</div>';
    $('petLine').textContent = 'ตี้นี้ยังไม่มี Pet — เลือกทีหลังได้';
  }
  seats.appendChild(petCard);

  renderLog(p);
  renderBudget(p);
}

function renderBudget(p) {
  const b = budgetOf(p);
  const used = messagesUsedToday(p, myId);
  const leftN = messagesLeftToday(p, myId);
  const el = $('budget');
  el.classList.toggle('out', leftN === 0);
  const pips = Array.from({ length: b.perDay }, (_, i) =>
    `<i class="${i < used ? 'used' : ''}"></i>`).join('');
  el.innerHTML =
    `<span class="pips">${pips}</span>` +
    `<span>${leftN > 0 ? `เหลือ ${leftN} Message วันนี้` : 'ใช้ Message ครบแล้ววันนี้ — React ได้ไม่จำกัด'}</span>`;
  $('send').disabled = leftN === 0;
  $('msg').placeholder = leftN === 0 ? 'พรุ่งนี้ค่อยว่ากัน — React ได้ไม่จำกัด' : 'ฝากไว้ในตี้…';
}

function renderLog(p) {
  const box = $('log');
  box.innerHTML = '';
  if (!p.log.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = 'ยังไม่มีใคร Commit<br><span style="font-size:13px">ทำสิ่งที่ตกลงกันแล้วกดปุ่มด้านบนได้เลย</span>';
    box.appendChild(e);
    return;
  }

  p.log.forEach(post => {
    const isPet = post.kind === 'pet';
    const el = document.createElement('div');
    el.className = 'post'
      + (post.kind === 'commit' ? ' commit' : '')
      + (isPet ? ' pet' : '')
      + (post.retracted ? ' retracted' : '');

    const body = post.retracted
      ? '<span>ข้อความถูกถอนโดยเจ้าของ</span>'
      : esc(post.body);
    const tag = post.kind === 'commit' ? '<span class="tag">COMMIT</span>' : '';

    /* pet turns are written by the scheduled worker and carry the pet's
       own identity rather than a member's */
    const petCard = isPet ? PET_BY_ID[post.petId] : null;
    if (isPet) {
      post = { ...post, avatar: petCard && petCard.art ? `<img src="${petCard.art}" alt="">` : (petCard ? petCard.emoji : '🐾'),
               alias: petCard ? petCard.nameTh : 'สัตว์ประจำตี้' };
    }
    const avatarHtml = isPet ? post.avatar : avatarMarkup(post.avatar);

    el.innerHTML =
      `<div class="av">${avatarHtml}</div>` +
      `<div class="bd">` +
        `<div class="meta"><span class="who">${esc(post.alias)}</span>` +
        `<span class="when">${stamp(post.sentAt)}</span></div>` +
        `<div class="txt">${tag}${body}</div>` +
        `<div class="confirm-slot"></div>` +
        `<div class="rx" data-seq="${post.seq}"></div>` +
      `</div>`;

    if (post.kind === 'commit' && !post.retracted) {
      const slot = el.querySelector('.confirm-slot');
      if (post.confirmedBy) {
        const confirmer = p.members.find(member => member.userId === post.confirmedBy);
        slot.innerHTML = `<span class="confirmed-mark">◎ ${esc(confirmer?.alias || 'เพื่อนในตี้')} Confirm แล้ว</span>`;
      } else if (post.userId !== myId) {
        const confirm = document.createElement('button');
        confirm.type = 'button'; confirm.className = 'confirm-button';
        confirm.textContent = '◎ Confirm ให้เพื่อน';
        confirm.addEventListener('click', async () => {
          confirm.disabled = true;
          const result = await confirmCommit(code, post.seq);
          if (result.error === 'ALREADY_CONFIRMED') toast('มีเพื่อน Confirm แล้ว');
          else if (result.error) toast('ยัง Confirm ไม่สำเร็จ');
          render();
        });
        slot.appendChild(confirm);
      } else {
        slot.innerHTML = '<span class="confirm-wait">รอเพื่อนหนึ่งคนช่วย Confirm</span>';
      }
    }

    const rx = el.querySelector('.rx');
    const reacts = post.reactions || {};
    Object.keys(reacts).forEach(emoji => {
      const who = reacts[emoji];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = who.includes(myId) ? 'mine' : '';
      b.innerHTML = `${emoji}<span class="c">${who.length}</span>`;
      b.setAttribute('aria-label', `${emoji} ${who.length}`);
      b.addEventListener('click', async () => { await toggleReaction(code, post.seq, emoji); render(); });
      rx.appendChild(b);
    });

    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'add';
    add.textContent = '＋';
    add.setAttribute('aria-label', 'เพิ่ม React');
    add.addEventListener('click', () => openPicker(rx, post.seq));
    rx.appendChild(add);

    if (post.userId === myId && !post.retracted && post.kind === 'message') {
      /* two-tap confirm rather than window.confirm(): native dialogs are
         unreliable inside in-app browsers such as LINE, where most of
         these links get opened */
      const r = document.createElement('button');
      r.type = 'button';
      r.className = 'retract';
      r.textContent = 'ถอนข้อความ';
      let armed = false;
      r.addEventListener('click', async () => {
        if (!armed) {
          armed = true;
          r.textContent = 'แน่ใจ? กดอีกครั้งเพื่อถอน';
          r.style.color = 'var(--gold-soft)';
          setTimeout(() => {
            if (!armed) return;
            armed = false;
            r.textContent = 'ถอนข้อความ';
            r.style.color = '';
          }, 4000);
          return;
        }
        await retractPost(code, post.seq);
        render();
        toast('ถอนข้อความแล้ว — ประวัติยังบอกว่ามีข้อความตรงนี้');
      });
      el.querySelector('.bd').appendChild(r);
    }

    box.appendChild(el);
  });
}

function openPicker(container, seq) {
  const existing = container.parentElement.querySelector('.rx-pick');
  if (existing) { existing.remove(); return; }
  const pick = document.createElement('div');
  pick.className = 'rx-pick';
  REACTIONS.forEach(emoji => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = emoji;
    b.setAttribute('aria-label', 'react ' + emoji);
    b.addEventListener('click', async () => { await toggleReaction(code, seq, emoji); render(); });
    pick.appendChild(b);
  });
  container.parentElement.appendChild(pick);
}

/* ---------- commit ---------- */
const sheet = $('commitSheet');
$('commitBtn').addEventListener('click', () => { sheet.hidden = false; $('commitNote').focus(); });
$('commitCancel').addEventListener('click', () => { sheet.hidden = true; $('commitNote').value = ''; });
$('commitDo').addEventListener('click', async () => {
  $('commitDo').disabled = true;
  const note = $('commitNote').value.trim();
  const res = await postToParty(code, { body: note || '✓', kind: 'commit' });
  $('commitDo').disabled = false;
  sheet.hidden = true;
  $('commitNote').value = '';
  if (res.error === 'ALREADY_COMMITTED') { toast('วันนี้ Commit ไปแล้ว'); return; }
  render();
  toast('Commit แล้ว — เจอกันพรุ่งนี้');
});

/* ---------- message ---------- */
const msg = $('msg');
msg.addEventListener('input', () => {
  msg.style.height = 'auto';
  msg.style.height = Math.min(msg.scrollHeight, 150) + 'px';
});

async function send() {
  const body = msg.value.trim();
  if (!body) return;
  $('send').disabled = true;
  const res = await postToParty(code, { body, kind: 'message' });
  $('send').disabled = false;
  if (res.error === 'NO_BUDGET') { toast('ใช้ Message ครบแล้ววันนี้ — React แทนได้'); return; }
  if (res.error) { toast('ส่งไม่สำเร็จ'); return; }
  msg.value = '';
  msg.style.height = 'auto';
  render();
}
$('send').addEventListener('click', send);
msg.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});

$('copy').addEventListener('click', async () => {
  const inviteUrl = `${location.origin}/xty/join/?c=${encodeURIComponent(getParty(code).code)}`;
  try {
    if (navigator.share) {
      await navigator.share({ title: `เข้าตี้ ${getParty(code).name}`, text: `รหัสตี้ ${getParty(code).code}`, url: inviteUrl });
      return;
    }
    await navigator.clipboard.writeText(`${getParty(code).code}\n${inviteUrl}`);
    toast('คัดลอกรหัสกับลิงก์แล้ว — ส่งให้เพื่อนได้เลย');
  } catch {
    toast('รหัสตี้: ' + getParty(code).code);
  }
});

$('refresh').addEventListener('click', async () => {
  $('refresh').disabled = true;
  const result = await refreshParty(code);
  $('refresh').disabled = false;
  if (result.error) { toast('ยังดึงอัปเดตไม่ได้'); return; }
  myId = (partyIdentity(code) && partyIdentity(code).userId) || myId;
  render();
  toast(result.party.log.length ? 'ตามตี้ทันแล้ว' : 'ยังไม่มีอัปเดตใหม่');
});

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  const result = await refreshParty(code);
  if (!result.error) render();
});

if (new URLSearchParams(location.search).get('new') === '1') {
  toast('ตั้งตี้เรียบร้อย — ส่งรหัสให้เพื่อนได้เลย');
}
</script>
</body>
</html>
