<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#FFF9E9">
<title>เข้าตี้ — XTY</title>
<link rel="stylesheet" href="/xty/_shared/xty.css?v=8">
<script>
(() => {
  const value = new URLSearchParams(location.search).get('c');
  const code = /^\d{5}$/.test(value || '') ? value : '';

  let hasLocalProfile = false;
  let hasMembership = false;
  try {
    hasLocalProfile = !!localStorage.getItem('mc_xty_profile');
    if (code) {
      const tokens = JSON.parse(localStorage.getItem('mc_xty_tokens') || '{}');
      const membership = tokens && typeof tokens === 'object' ? tokens[code] : null;
      hasMembership = !!(membership && membership.token && membership.userId);
    }
  } catch {}

  /* An invite link doubles as a bookmark. If this browser has already
     joined the same party, skip Join entirely and reopen the party. */
  if (hasLocalProfile && code && hasMembership) {
    location.replace(`/xty/p/?c=${encodeURIComponent(code)}`);
    return;
  }

  if (hasLocalProfile) return;
  location.replace(code ? `/xty/?c=${encodeURIComponent(code)}` : '/xty/');
})();
</script>
</head>
<body>

<header class="top">
  <a class="mark" href="/xty/"><img src="/xty/assets/xty-logo.png" alt="XTY"></a>
  <a class="back" href="/xty/">ยกเลิก</a>
</header>

<main class="wrap">
  <p class="kicker">JOIN XTY</p>
  <h1 class="title">เข้าตี้</h1>
  <p class="lede">ใส่รหัสที่เพื่อนส่งมา</p>

  <div class="card">
    <div class="field" style="margin-top:0">
      <label for="code">รหัสตี้</label>
      <input id="code" type="text" inputmode="numeric" maxlength="5" placeholder="00427"
             autocomplete="one-time-code" spellcheck="false"
             style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;font-size:19px">
    </div>
    <div class="field">
      <label>เล่นตี้นี้เป็นตัวไหนดี?</label>
      <div class="card-grid" id="avatarPick" role="radiogroup" aria-label="เลือกตัวละครประจำตี้"></div>
      <div class="color-row" id="framePick" role="radiogroup" aria-label="เลือกสีตัวละครประจำตี้" style="margin-top:10px"></div>
      <p class="hint">เลือกเฉพาะตี้นี้ได้ และใช้หน้าตาซ้ำข้ามตี้ได้</p>
    </div>
    <button class="btn gold" id="go" style="margin-top:20px" disabled>เข้าตี้</button>
    <p class="hint" id="err" style="margin-top:12px;color:var(--gold-soft)" hidden></p>
  </div>

  <p class="note">รหัสนี้ใช้เข้าตี้ข้ามเครื่องได้ สมาชิกหนึ่งตี้มีได้ 2–5 คน และสมาชิกในตี้จะเห็น Party Log ร่วมกัน</p>
</main>

<script type="module">
import { hasProfile, joinParty, getProfile } from '/xty/_shared/store.js';
import { XTY_AVATARS, AVATAR_FRAMES } from '/xty/_shared/avatars.js';

const $ = id => document.getElementById(id);
const rawPrefill = new URLSearchParams(location.search).get('c');
const prefill = /^\d{5}$/.test(rawPrefill || '') ? rawPrefill : '';

if (!hasProfile()) {
  location.replace(prefill ? `/xty/?c=${encodeURIComponent(prefill)}` : '/xty/');
} else {
  initJoin(prefill);
}

function initJoin(initialCode) {
  const input = $('code'), go = $('go'), err = $('err');

  /* Keep leading zeroes: the invite code is exactly five numeric digits. */
  input.addEventListener('input', () => {
    const v = input.value.replace(/\D/g, '').slice(0, 5);
    input.value = v;
    go.disabled = v.length < 5;
    err.hidden = true;
  });

  if (initialCode) {
    input.value = initialCode;
    input.dispatchEvent(new Event('input'));
  }

  const profile = getProfile();
  let partyAvatar = profile.avatarId;
  let partyAvatarColor = profile.avatarFrame || 'green';
  XTY_AVATARS.forEach(avatar => {
    const button = document.createElement('button'); button.type = 'button';
    button.className = 'pc avatar-card pickable' + (avatar.id === partyAvatar ? ' picked' : '');
    button.setAttribute('role', 'radio'); button.setAttribute('aria-checked', avatar.id === partyAvatar ? 'true' : 'false');
    button.setAttribute('aria-label', avatar.nameTh);
    button.innerHTML = `<span class="glyph"><img src="${avatar.art}" alt="" loading="lazy" decoding="async"></span>`;
    button.addEventListener('click', () => {
      partyAvatar = avatar.id;
      $('avatarPick').querySelectorAll('button').forEach(node => {
        const on = node === button; node.classList.toggle('picked', on); node.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
    $('avatarPick').appendChild(button);
  });
  Object.values(AVATAR_FRAMES).forEach(frame => {
    const button = document.createElement('button'); button.type = 'button';
    button.className = 'color-choice' + (frame.id === partyAvatarColor ? ' picked' : '');
    button.style.setProperty('--swatch', frame.hex); button.setAttribute('role', 'radio');
    button.setAttribute('aria-checked', frame.id === partyAvatarColor ? 'true' : 'false');
    button.innerHTML = `<span></span><b>${frame.labelTh}</b>`;
    button.addEventListener('click', () => {
      partyAvatarColor = frame.id;
      $('framePick').querySelectorAll('button').forEach(node => {
        const on = node === button; node.classList.toggle('picked', on); node.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
    $('framePick').appendChild(button);
  });

  go.addEventListener('click', async () => {
    go.disabled = true;
    go.textContent = 'กำลังเข้าตี้…';
    const p = getProfile();
    const res = await joinParty(input.value, { alias: p.alias, avatar: partyAvatar, avatarColor: partyAvatarColor });
    if (res.error === 'NOT_FOUND') {
      err.textContent = 'ไม่เจอตี้รหัสนี้ ลองเช็กรหัสอีกครั้ง';
      err.hidden = false;
      go.disabled = false;
      go.textContent = 'เข้าตี้';
      return;
    }
    if (res.error === 'FULL') {
      err.textContent = 'ตี้นี้เต็มแล้ว (รับได้ไม่เกิน 5 คน)';
      err.hidden = false;
      go.disabled = false;
      go.textContent = 'เข้าตี้';
      return;
    }
    if (res.error === 'PARTY_CLOSED') {
      err.textContent = 'ตี้นี้จบแล้วและไม่รับสมาชิกเพิ่ม';
      err.hidden = false;
      go.disabled = false;
      go.textContent = 'เข้าตี้';
      return;
    }
    if (res.error === 'MEMBERSHIP_CLOSED') {
      err.textContent = 'ช่วงการร่วมทางของคุณในตี้นี้ถูกปิดแล้ว';
      err.hidden = false;
      go.disabled = false;
      go.textContent = 'เข้าตี้';
      return;
    }
    if (res.error === 'JOINED_PARTY_LIMIT') {
      err.textContent = 'ตอนนี้เข้าร่วมตี้เพิ่มไม่ได้ — คุณเข้าร่วมได้พร้อมกันไม่เกิน 3 ตี้';
      err.hidden = false;
      go.disabled = false;
      go.textContent = 'เข้าตี้';
      return;
    }
    if (res.error === 'ACTIVE_PARTY_LIMIT') {
      err.textContent = 'คุณใช้ช่องตี้ของ Level นี้ครบแล้ว — จบตี้หนึ่งก่อนหรือเพิ่ม Level';
      err.hidden = false;
      go.disabled = false;
      go.textContent = 'เข้าตี้';
      return;
    }
    if (res.error) {
      err.textContent = 'เข้าตี้ไม่สำเร็จ — เช็กเน็ตแล้วลองใหม่';
      err.hidden = false;
      go.disabled = false;
      go.textContent = 'เข้าตี้';
      return;
    }
    location.href = `/xty/p/?c=${encodeURIComponent(res.party.code)}`;
  });

  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !go.disabled) go.click(); });
}
</script>
</body>
</html>
