<style>
  .preview-hero{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center}
  .preview-cover{width:112px;aspect-ratio:63/88;overflow:hidden;border-radius:14px}
  .preview-cover>.animal-card,.preview-cover>.avatar-cover,.preview-cover>img,.preview-cover>svg{width:100%!important;height:100%!important;aspect-ratio:63/88!important}
  .preview-cover img,.preview-cover svg{display:block;object-fit:cover}
  .preview-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.preview-meta span{padding:4px 8px;font-size:11px;border:1px solid var(--xty-border);border-radius:999px;background:var(--xty-paper)}
  .preview-members{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px}.preview-member{flex:0 0 auto;width:72px;text-align:center}.preview-member img{width:54px;height:54px;margin:0 auto 5px;object-fit:contain;border:2px solid var(--xty-border);border-radius:14px;background:#fff}.preview-member b{display:block;overflow:hidden;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.preview-member small{font-size:9px;color:var(--xty-muted)}
  .public-log{height:min(62dvh,620px);min-height:330px;margin-top:14px;padding:4px 3px;overflow-y:auto;overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;scroll-behavior:auto;overflow-anchor:none;border-top:1px solid rgba(62,51,44,.08);border-bottom:1px solid rgba(62,51,44,.08)}
  .public-entry{display:flex;gap:10px;padding:8px 4px}.public-entry+.public-entry{border-top:1px solid rgba(62,51,44,.06)}.public-entry .av{flex:none;width:34px;height:34px;border-radius:50%;object-fit:contain;background:var(--xty-paper)}.public-entry .body{min-width:0;flex:1}.public-entry .meta{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}.public-entry .who{font-size:13px;font-weight:800}.public-entry .when{font-size:10px;color:var(--xty-muted)}.public-entry .text{margin-top:2px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.public-entry.commit .tag{display:inline-block;margin-right:5px;padding:2px 5px;color:#fff;font:800 8px/1.3 var(--sans);letter-spacing:.1em;border-radius:4px;background:var(--xty-red)}
  .public-event{display:flex;gap:8px;align-items:flex-start;margin:3px 0;padding:8px 10px;color:var(--xty-muted);font-size:12px;line-height:1.5;border-left:3px solid rgba(91,141,255,.32);background:rgba(255,255,255,.48);border-radius:0 9px 9px 0}.public-event i{flex:none;width:7px;height:7px;margin-top:6px;border-radius:50%;background:var(--xty-blue)}.public-event span{flex:1}.public-event time{flex:none;font-size:9px}
  .public-chat-link{color:#1769c2;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
  .join-zone{position:sticky;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;margin-top:14px;padding:10px;border:1px solid var(--xty-border);border-radius:999px;background:rgba(255,254,248,.94);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
  @media(max-width:390px){.preview-hero{grid-template-columns:96px minmax(0,1fr)}.preview-cover{width:96px}}
</style>
</head>
<body>
<header class="top"><a class="mark" href="/xty/"><img src="/xty/assets/xty-logo.png" alt="XTY"></a><a class="back" href="/xty/public/">ตี้สาธารณะ</a></header>
<main class="wrap">
  <section id="loading" class="card"><p class="whisper" style="margin:0">กำลังเปิดรายละเอียดตี้…</p></section>
  <section id="view" hidden>
    <div class="card">
      <div class="preview-hero">
        <div class="preview-cover" id="cover"></div>
        <div>
          <p class="kicker" style="margin-bottom:6px">PUBLIC PARTY</p>
          <h1 class="title" id="name" style="font-size:clamp(24px,6vw,34px);margin-bottom:5px"></h1>
          <p class="whisper" id="activity" style="margin:0"></p>
          <div class="preview-meta" id="meta"></div>
        </div>
      </div>
      <div class="rule-box" style="margin-top:16px"><b>WHAT COUNTS AS A COMMIT</b><p id="rule"></p></div>
    </div>

    <div class="card">
      <span class="label">MEMBERS</span>
      <div class="preview-members" id="members"></div>
    </div>

    <div class="card">
      <span class="label">PARTY LOG · อ่านก่อนเข้าร่วมได้</span>
      <p class="whisper" style="margin:0">บันทึกตั้งแต่ตอนสร้างตี้ · เลื่อนอ่านบันทึกได้อย่างอิสระ</p>
      <div class="public-log" id="log" tabindex="0"></div>
    </div>

    <div class="join-zone"><a class="btn gold" id="join" href="#">เข้าร่วมตี้นี้</a></div>
  </section>
  <section id="missing" hidden class="card"><h1 class="title" style="font-size:26px">เปิดรายละเอียดไม่ได้</h1><p class="whisper">ตี้อาจไม่ใช่สาธารณะ หรือถูกปิดไปแล้ว</p><a class="btn ghost" href="/xty/public/">กลับไปหาตี้อื่น</a></section>
</main>

<script type="module">
import { avatarById } from '/xty/_shared/avatars.js';
import { cardById as xtyCardById, cardDescriptorTh } from '/xty/_shared/cards.js';
import { cardMarkup } from '/xty/_shared/card-ui.js';
import { cardById as core7CardById } from '/core7/js/cards.js';
import { cardSVG } from '/core7/js/art.js';
import { PET_BY_ID } from '/xty/_shared/pets.js';

const $ = id => document.getElementById(id);
const code = new URLSearchParams(location.search).get('c');
const URL_RE = /(?:(?:https?|ftp):\/\/|www\.)[^\s<>]+|(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}(?:\/[^\s<>]*)?/giu;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function stamp(value) {
  const d = new Date(value || Date.now());
  return d.toLocaleString('th-TH', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function coverName(party) {
  const created = (party.events || []).find(event => event.type === 'PARTY_CREATED')?.data || {};
  if (created.coverName) return created.coverName;
  if (party.coverType === 'core7_card') {
    const card = core7CardById(party.coverValue); return card ? `${card.en} · ${card.th}` : 'การ์ด myClover';
  }
  if (['card','legacy_card'].includes(party.coverType)) {
    const card = xtyCardById(party.leadCardId || party.coverValue); return card ? cardDescriptorTh(card) : 'การ์ด XTY';
  }
  if (party.coverType === 'avatar') {
    let snapshot = {}; try { snapshot = JSON.parse(party.coverValue || '{}'); } catch {}
    return `การ์ดตัวละคร ${avatarById(snapshot.species).nameTh}`;
  }
  return 'หลังการ์ด myClover';
}

function creationText(party, data = {}) {
  if (data.creationLabel) return data.creationLabel;
  const alias = data.alias || party.members?.find(member => member.role === 'lead')?.alias || 'หัวตี้';
  return `${alias} สร้างตี้ ด้วย${coverName(party).startsWith('หลัง') ? '' : 'การ์ด '}${coverName(party).replace(/^การ์ด /,'')}`;
}

function eventText(party, event) {
  const d = event.data || {};
  switch (event.type) {
    case 'PARTY_CREATED': return creationText(party, d);
    case 'MEMBER_JOINED': return `${d.alias || 'สมาชิก'} เข้าร่วมตี้`;
    case 'MEMBER_LEFT': return `${d.alias || 'สมาชิก'} ออกจากตี้`;
    case 'MEMBER_KICKED': return `${d.alias || 'สมาชิก'} ถูกนำออกจากตี้`;
    case 'MEMBER_ALIAS_CHANGED': return `${d.from || 'สมาชิก'} เปลี่ยนชื่อเป็น ${d.to || d.alias || 'ชื่อใหม่'}`;
    case 'MEMBER_AVATAR_CHANGED': return `${d.alias || 'สมาชิก'} เปลี่ยนตัวละคร`;
    case 'LEAD_TRANSFERRED': return `${d.to || 'สมาชิกคนถัดไป'} รับหน้าที่หัวตี้ต่อจาก ${d.from || 'หัวตี้เดิม'}`;
    case 'PARTY_RENAMED': return `เปลี่ยนชื่อตี้จาก “${d.from || ''}” → “${d.to || ''}”`;
    case 'RULE_CHANGED': return 'กติกา Commit ถูกเปลี่ยน';
    case 'LEAD_CARD_CHANGED': return `หัวตี้เปลี่ยนการ์ดประจำตี้จาก ${d.fromName || d.from || 'ใบเดิม'} → ${d.toName || d.to || 'ใบใหม่'}`;
    case 'NPC_CHANGED': return 'ตี้เปลี่ยน PET / NPC';
    case 'PARTY_COMPLETED': return 'Quest จบสำเร็จ';
    case 'PARTY_DISSOLVED': return 'ตี้ถูกยุบ';
    default: return '';
  }
}

function renderCover(party) {
  if (party.coverType === 'core7_card') {
    const card = core7CardById(party.coverValue);
    if (card) { $('cover').innerHTML = cardSVG(card.id, { width:300, showNumber:true }); return; }
  }
  if (['card','legacy_card'].includes(party.coverType)) {
    const card = xtyCardById(party.leadCardId || party.coverValue);
    if (card) { $('cover').innerHTML = cardMarkup(card); return; }
  }
  if (party.coverType === 'card_back') {
    $('cover').innerHTML = '<img src="/core7/assets/myclover-back.webp" alt="หลังการ์ด myClover">'; return;
  }
  let snapshot = {}; try { snapshot = JSON.parse(party.coverValue || '{}'); } catch {}
  const avatar = avatarById(snapshot.species || party.members?.[0]?.avatar);
  $('cover').innerHTML = `<div class="avatar-cover" data-color="${esc(snapshot.color || 'green')}"><img src="${esc(avatar.art)}" alt=""><b>${esc(avatar.nameTh)}</b></div>`;
}

function linkify(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) if (!walker.currentNode.parentElement?.closest('a')) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue || ''; URL_RE.lastIndex = 0; let match; let last = 0; const frag = document.createDocumentFragment(); let changed = false;
    while ((match = URL_RE.exec(text))) {
      changed = true; if (match.index > last) frag.append(text.slice(last, match.index));
      let raw = match[0]; let tail = ''; while (/[)\]}>.,!?;:'"”’]$/u.test(raw)) { tail = raw.slice(-1) + tail; raw = raw.slice(0,-1); }
      const a = document.createElement('a'); a.className='public-chat-link'; a.textContent=raw; a.href=/^(?:https?|ftp):\/\//i.test(raw)?raw:`https://${raw}`; a.target='_blank'; a.rel='noopener noreferrer nofollow'; frag.append(a); if (tail) frag.append(tail); last=match.index+match[0].length;
    }
    if (!changed) continue; if (last < text.length) frag.append(text.slice(last)); node.replaceWith(frag);
  }
}

function postNode(post) {
  const row = document.createElement('div'); row.className = `public-entry ${esc(post.kind)}`;
  let art = '';
  if (post.kind === 'pet' && post.petId && PET_BY_ID[post.petId]?.art) art = PET_BY_ID[post.petId].art;
  else if (post.avatar) art = avatarById(post.avatar).art;
  row.innerHTML = `<img class="av" src="${esc(art || '/xty/assets/art/avatars/orange-cat.webp')}" alt=""><div class="body"><div class="meta"><span class="who">${esc(post.alias || (post.kind==='pet'?'PET':'สมาชิก'))}</span><span class="when">${esc(stamp(post.sentAt))}</span></div><div class="text">${post.retracted ? '<i>ถอนข้อความแล้ว</i>' : `${post.kind==='commit'?'<span class="tag">COMMIT</span>':''}${esc(post.body || '')}`}</div></div>`;
  linkify(row.querySelector('.text')); return row;
}

function eventNode(party, event) {
  const text = eventText(party,event); if (!text) return null;
  const row = document.createElement('div'); row.className='public-event'; row.innerHTML=`<i></i><span>${esc(text)}</span><time>${esc(stamp(event.at))}</time>`; return row;
}

function renderTimeline(party) {
  const items = [];
  (party.events || []).forEach((event,index) => { const node=eventNode(party,event); if(node) items.push({at:new Date(event.at).getTime(),order:index*2,node}); });
  (party.log || []).forEach((post,index) => items.push({at:new Date(post.sentAt).getTime(),order:index*2+1,node:postNode(post)}));
  items.sort((a,b)=>(a.at-b.at)||(a.order-b.order));
  $('log').replaceChildren(...items.map(item=>item.node));
  if (!items.length) $('log').innerHTML='<div class="empty">ยังไม่มีข้อความ · มีเพียงการเริ่มตี้</div>';
  // Native scroll only: never move the reader automatically.
}

function render(party) {
  document.title = `${party.name} — XTY`;
  $('name').textContent=party.name; $('activity').textContent=party.activity || 'ยังไม่ระบุกิจกรรม';
  $('rule').textContent=party.commitRule || 'หัวตี้ยังไม่ได้เขียนกติกา Commit';
  const mode=party.verificationMode==='confirm'?'ต้อง Confirm':'เชื่อใจกัน';
  $('meta').innerHTML=`<span>${esc(mode)}</span><span>${party.members.length}/5 คน</span><span>${party.durationDays} วัน</span><span>${esc(coverName(party))}</span>`;
  renderCover(party);
  $('members').innerHTML=(party.members||[]).map(member=>`<div class="preview-member"><img src="${esc(avatarById(member.avatar).art)}" alt=""><b>${esc(member.alias)}</b><small>${member.role==='lead'?'หัวตี้':'สมาชิก'}</small></div>`).join('');
  renderTimeline(party);
  $('join').href=`/xty/join/?c=${encodeURIComponent(party.code)}`;
  if (!party.joinable) { $('join').removeAttribute('href'); $('join').textContent=party.members.length>=5?'ตี้เต็มแล้ว':'ตี้นี้ปิดรับแล้ว'; $('join').style.opacity='.5'; }
  $('loading').hidden=true; $('view').hidden=false;
}

async function start() {
  if (!/^\d{5}$/.test(code || '')) { $('loading').hidden=true; $('missing').hidden=false; return; }
  try {
    const response=await fetch(`/api/xty-party-finish?op=public-preview-v2&code=${encodeURIComponent(code)}`,{headers:{accept:'application/json'},credentials:'same-origin'});
    const data=await response.json(); if(!response.ok||!data.party) throw new Error(data.error||'HTTP'); render(data.party);
  } catch { $('loading').hidden=true; $('missing').hidden=false; }
}
start();
</script>
</body>
