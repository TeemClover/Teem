<body>
<header class="top"><a class="mark" href="/xty/"><img src="/xty/assets/xty-logo.png" alt="XTY"></a><a class="back" href="/xty/">กลับ Home</a></header>
<main class="wrap">
  <p class="kicker">PUBLIC PARTY LOBBY</p>
  <h1 class="title">หาตี้ที่อยากลงมือทำด้วยกัน</h1>
  <p class="lede">เปิดดูรายละเอียดและอ่าน Party Log ย้อนหลังก่อนได้ แล้วค่อยตัดสินใจว่าจะเข้าร่วมไหม</p>
  <div class="public-filters">
    <label class="public-filter-toggle">
      <input type="checkbox" id="hideFull">
      <span class="public-filter-switch" aria-hidden="true"></span>
      <span>ซ่อนตี้ที่เต็มแล้ว</span>
    </label>
  </div>
  <div class="public-list" id="list"><div class="empty">กำลังหาตี้ที่ยังรับสมาชิก…</div></div>
  <button class="btn ghost" id="more" hidden>ดูเพิ่ม</button>
  <p class="note">ตี้สาธารณะเปิดให้อ่านเฉพาะข้อมูลในตี้และ Party Log · Email, token และข้อมูลบัญชีไม่ถูกเปิดเผย</p>
</main>

<script type="module">
import { avatarById } from '/xty/_shared/avatars.js';
import { cardById } from '/xty/_shared/cards.js';
import { cardMarkup } from '/xty/_shared/card-ui.js';
import { cardById as core7CardById } from '/core7/js/cards.js';
import { cardSVG } from '/core7/js/art.js';

const $ = id => document.getElementById(id);
const HIDE_FULL_KEY = 'mc_xty_public_hide_full';
let cursor = null;
let loadedParties = [];
const esc = value => String(value || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function readHideFull() {
  try {
    const saved = localStorage.getItem(HIDE_FULL_KEY);
    return saved === null ? true : saved === '1';
  } catch { return true; }
}

function saveHideFull(value) {
  try { localStorage.setItem(HIDE_FULL_KEY, value ? '1' : '0'); } catch {}
}

function isFull(party) {
  const members = Number(party.memberCount || 0);
  const max = Number(party.maxMembers || 0);
  return max > 0 && members >= max;
}

function coverMarkup(party) {
  if (party.coverType === 'core7_card') {
    const core = core7CardById(party.coverValue);
    if (core) return `<div class="public-core7-cover">${cardSVG(core.id,{width:300,showNumber:true})}</div>`;
  }
  const card = cardById(party.coverValue);
  if (card) return cardMarkup(card);
  if (party.coverType === 'card_back') return '<div class="animal-card card-back"><span class="back-mark">XTY</span><small>CARD BACK</small></div>';
  let snapshot = { species: party.lead.avatar, color: party.lead.avatarColor };
  try { snapshot = { ...snapshot, ...JSON.parse(party.coverValue || '{}') }; } catch {}
  const avatar = avatarById(snapshot.species);
  return `<div class="avatar-cover" data-color="${esc(snapshot.color || 'green')}" aria-label="Starter · ${esc(avatar.nameTh)}"><img src="${avatar.art}" alt=""></div>`;
}

function partyMarkup(party) {
  const mode = party.verificationMode === 'confirm' ? 'ต้อง Confirm' : 'เชื่อใจกัน';
  return `${coverMarkup(party)}<div><span class="status-pill">${mode}</span><h2>${esc(party.name)}</h2>`
    + `<p>${esc(party.activity || 'กิจกรรมที่ตกลงกันในตี้')}</p>`
    + `<p class="whisper">DAY ${party.day} / ${party.durationDays} · ${party.memberCount}/${party.maxMembers} คน · วันนี้ ${party.todayCommitCount} Commit</p>`
    + `<p class="whisper">Lead: ${esc(party.lead.alias)}</p>`
    + `<a class="btn ghost sm" href="/xty/public/p/?c=${encodeURIComponent(party.code)}">ดูรายละเอียด · อ่าน Party Log</a>`
    + '</div>';
}

function renderParties() {
  const list = $('list');
  const hideFull = $('hideFull').checked;
  const visible = hideFull ? loadedParties.filter(party => !isFull(party)) : loadedParties;
  list.innerHTML = '';

  visible.forEach(party => {
    const article = document.createElement('article');
    article.className = 'card public-party';
    article.innerHTML = partyMarkup(party);
    list.appendChild(article);
  });

  if (list.children.length) return;
  const hiddenCount = hideFull ? loadedParties.filter(isFull).length : 0;
  if (hiddenCount && cursor) {
    list.innerHTML = '<div class="empty">ตี้ที่โหลดมาตอนนี้เต็มแล้วและถูกซ่อนอยู่ · กดดูเพิ่มเพื่อหาตี้ที่ยังมีที่ว่าง</div>';
  } else if (hiddenCount) {
    list.innerHTML = '<div class="empty">ตอนนี้ตี้สาธารณะที่พบเต็มแล้ว · ปิดตัวกรองเพื่อดูตี้ทั้งหมดได้</div>';
  } else {
    list.innerHTML = '<div class="empty">ยังไม่มีตี้สาธารณะที่เข้าร่วมได้</div>';
  }
}

async function load({ append = false } = {}) {
  $('more').disabled = true;
  const url = new URL('/api/xty/public', location.origin);
  if (cursor) url.searchParams.set('cursor', cursor);
  try {
    const response = await fetch(url, { headers: { accept: 'application/json' }, credentials: 'same-origin' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'HTTP');
    loadedParties = append ? [...loadedParties, ...data.parties] : [...data.parties];
    cursor = data.nextCursor;
    renderParties();
    $('more').hidden = !cursor;
  } catch {
    if (!append) $('list').innerHTML = '<div class="empty">ยังเปิด Lobby ไม่สำเร็จ · ลองใหม่อีกครั้ง</div>';
  }
  $('more').disabled = false;
}

$('hideFull').checked = readHideFull();
$('hideFull').addEventListener('change', event => {
  saveHideFull(event.target.checked);
  renderParties();
});
$('more').addEventListener('click', () => load({ append: true }));
load();
</script>
