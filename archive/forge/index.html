<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- บังคับให้ Scale พอดีกับหน้าจอมือถือ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forge Webtoon Preview</title>
    <style>
        /* รีเซ็ตค่าพื้นฐาน ป้องกันขอบขาวขอบดำรอบจอ */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000; /* ใส่พื้นหลังสีดำให้ดูกลืนกับจอ */
            width: 100%;
            overflow-x: hidden; /* ป้องกันการเลื่อนซ้ายขวา */
        }

        /* คอนเทนเนอร์หลักให้อยู่กึ่งกลาง (ถ้าเปิดในคอม) */
        .comic-container {
            width: 100%;
            max-width: 600px; /* ล็อกความกว้างสูงสุดเวลาเปิดบน Desktop จะได้ไม่ใหญ่เกินไป */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* บังคับภาพให้กว้าง 100% และต่อกันสนิท */
        .comic-container img {
            width: 100%;
            height: auto;
            display: block; /* ลบช่องว่างใต้ภาพที่เป็น Default ของ HTML */
            margin: 0;
            padding: 0;
            border: none;
        }
    </style>
</head>
<body>

    <div class="comic-container">
        <!-- ลิสต์รูปเรียงตาม File Name จากภาพของมึง -->
        <img src="00.png" alt="Ep 0">
        <img src="01.png" alt="Ep 1">
        <img src="02.png" alt="Ep 2">
        <img src="03.png" alt="Ep 3">
        <img src="04.png" alt="Ep 4">
        <img src="05.png" alt="Ep 5">
        <img src="06.png" alt="Ep 6">
        <img src="07.png" alt="Ep 7">
        <img src="08.png" alt="Ep 8">
        <img src="09.png" alt="Ep 9">
        <img src="09s.png" alt="Ep 9.5">
        <img src="10.png" alt="Ep 10">
    </div>

</body>
</html>
