<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>First Class Review Vault · myClover</title><link rel="icon" href="/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10291f;--green:#176c45;--gold:#c99c43;--paper:#f7f4ec;--line:rgba(16,41,31,.13);--muted:#758078}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Thai",sans-serif}header{min-height:70px;display:flex;align-items:center;gap:14px;padding:14px 22px;background:#0b291f;color:#fff}header a{color:#fff;text-decoration:none}header img{width:28px;height:28px;border-radius:8px}.brand{display:flex;align-items:center;gap:8px;font:800 14px Manrope,sans-serif}.brand b{color:#78e5aa}header>div{margin-right:auto}header small{display:block;color:#8dd9af;font:800 9px Manrope,sans-serif;letter-spacing:.1em}header strong{font-size:15px}.wrap{width:min(100% - 28px,1100px);margin:28px auto 60px}.login{max-width:430px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(16,41,31,.09)}.login h1{margin:0 0 5px}.login p{color:var(--muted);font-size:13px}.login form{display:flex;gap:8px}.login input{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:10px}.login button,.toolbar button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.login button{background:var(--ink);color:#fff}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.top h1{margin:0;font:800 34px/1 Manrope,"IBM Plex Sans Thai",sans-serif}.top p{margin:8px 0 0;color:var(--muted)}.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px}.toolbar{display:flex;gap:8px;margin:20px 0 18px;flex-wrap:wrap}.toolbar button{background:#fff;border:1px solid var(--line);color:#536158}.toolbar button.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.mode{font:800 9px Manrope,sans-serif;letter-spacing:.08em;color:var(--green)}.mode.private{color:#895e21}.score{font:800 12px Manrope,sans-serif;color:#9a6a12}.card{background:linear-gradient(145deg,#fffaf0,#f5e8cf);border:1px solid #e4c98f;border-radius:16px;padding:18px}.card .quote{font-size:17px;line-height:1.55;font-weight:700;margin:0 0 12px}.who{font-size:11px;color:#68736d}.details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.details p{font-size:11px;line-height:1.6;margin:6px 0;color:#536159}.details b{color:var(--ink)}.private-data{margin-top:8px;padding:8px;border-radius:9px;background:#f3f4f1;font-size:10px;color:#7a817d}.empty{text-align:center;padding:60px 10px;color:var(--muted)}.message{margin-top:10px;color:#a34c22;font-size:12px}[hidden]{display:none!important}@media(max-width:760px){header{padding:12px}.wrap{width:min(100% - 18px,1100px)}.grid{grid-template-columns:1fr}.top h1{font-size:29px}.login form{flex-direction:column}}
</style>
</head><body>
<header><a class="brand" href="/first-class/admin/"><img src="/icons/icon-192.png" alt=""><span>my<b>Clover</b></span></a><div><small>PRIVATE ADMIN</small><strong>First Class · Review Vault</strong></div><a href="/first-class/admin/">← Control Room</a></header>
<main class="wrap">
<section class="login" id="login"><h1>เปิด Review Vault</h1><p>ใช้รหัสเดียวกับ First Class Control Room และจำไว้เฉพาะแท็บนี้</p><form id="loginForm"><input id="key" type="password" placeholder="Admin key" required><button>เปิด Vault →</button></form><div class="message" id="loginMessage" hidden></div></section>
<section id="vault" hidden><div class="top"><div><h1>AFTER TASTE</h1><p>Voice of Customer · First Class รุ่นแรก</p></div><div class="stats"><span id="allStat">ทั้งหมด 0</span><span id="shareStat">เผยแพร่ได้ 0</span><span id="privateStat">Private 0</span></div></div><div class="toolbar"><button class="active" data-mode="share">พร้อมใช้โปรโมต</button><button data-mode="all">ทั้งหมด</button><button data-mode="private">Private / ปรับปรุง</button></div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>ยังไม่มีรีวิวในมุมมองนี้</div></section>
</main>
<script>
(()=>{let key=sessionStorage.getItem('firstClassAdminKey')||'',reviews=[],mode='share';const login=document.getElementById('login'),vault=document.getElementById('vault'),grid=document.getElementById('grid'),empty=document.getElementById('empty'),msg=document.getElementById('loginMessage');const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){msg.hidden=true;const r=await fetch('/api/first-class/review',{headers:{'x-admin-key':key}}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'เปิด Vault ไม่สำเร็จ');reviews=d.reviews||[];sessionStorage.setItem('firstClassAdminKey',key);login.hidden=true;vault.hidden=false;render()}function render(){document.getElementById('allStat').textContent=`ทั้งหมด ${reviews.length}`;const share=reviews.filter(r=>r.consent_mode!=='private');document.getElementById('shareStat').textContent=`เผยแพร่ได้ ${share.length}`;document.getElementById('privateStat').textContent=`Private ${reviews.length-share.length}`;let rows=reviews;if(mode==='share')rows=share;if(mode==='private')rows=reviews.filter(r=>r.consent_mode==='private');grid.innerHTML=rows.map(r=>{const named=r.consent_mode==='named',name=named?r.display_name:'ผู้เรียน AI ใส่ซอส · First Class รุ่นแรก',role=named&&r.role_company?` · ${esc(r.role_company)}`:'';return `<article class="item"><div class="meta"><span class="mode ${r.consent_mode==='private'?'private':''}">${r.consent_mode==='named'?'SHARE · NAMED':r.consent_mode==='anonymous'?'SHARE · ANONYMOUS':'PRIVATE'}</span><span class="score">★ ${r.score}/10</span></div><div class="card"><p class="quote">“${esc(r.recommend_text)}”</p><div class="who"><b>${esc(name)}</b>${role}</div></div><div class="details"><p><b>Aha:</b> ${esc(r.aha)}</p><p><b>จะเอาไปใช้:</b> ${esc(r.first_use)}</p>${r.improve?`<p><b>อยากให้ปรับ:</b> ${esc(r.improve)}</p>`:''}${r.extra?`<p><b>ข้อความเพิ่ม:</b> ${esc(r.extra)}</p>`:''}<p><b>Loot:</b> ${(r.takeaways||[]).map(esc).join(' · ')}</p><div class="private-data">ภายในเท่านั้น · ${esc(r.display_name)} · ${esc(r.email)} · ${new Date(r.created_at).toLocaleString('th-TH')}</div></div></article>`}).join('');empty.hidden=rows.length>0}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();key=document.getElementById('key').value.trim();try{await load()}catch(err){msg.textContent=err.message;msg.hidden=false}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});if(key)load().catch(()=>sessionStorage.removeItem('firstClassAdminKey'))})();
</script></body></html>
