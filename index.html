      </button>
      <a class="btn btn-secondary" href="hall.html" data-i18n-html="compassBtn">

<div class="modal" id="videoModal" aria-hidden="true">

      <button class="close" id="closeVideo" aria-label="Close">✕</button>
    </div>

    </video>
  </div>
</div>

<script>
const i18n = {
  th:{
    eyebrow:"🍀 ใครเจอเรา คนนั้นโชคดี",
    title:"ดูคลิปสั้น 44 วิ ก่อนเริ่ม",
    lead:"บ้านหลังนี้มีทั้งเรื่องเล่า บทเรียน เกม และของที่หยิบกลับไปใช้ได้จริง",
    watchBtn:"▶ ดูคลิปเปิดบ้าน<span class='sub'>44 วินาทีแรกของ myClover</span>",
    compassBtn:"🧭 หยิบเข็มทิศ<span class='sub'>แล้วค่อยเลือกทางแรกของคุณ</span>",
    modalTitle:"คลิปแนะนำบ้าน 44 วิ",
  },
  en:{
    eyebrow:"🍀 Those who find us leave with something lucky",
    title:"Watch the 44-second intro first",
    lead:"This house has a story, lessons, a game, and things you can actually take back and use.",
    watchBtn:"▶ Watch the house intro<span class='sub'>the first 44 seconds of myClover</span>",
    compassBtn:"🧭 Pick up the compass<span class='sub'>then choose your first path</span>",
    modalTitle:"44-second house intro",
  }
};
const setLang = (lang) => {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent = i18n[lang][el.dataset.i18n]);
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML = i18n[lang][el.dataset.i18nHtml]);
  localStorage.setItem('mc_lang', lang);
};
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setLang(btn.dataset.lang)));
setLang(localStorage.getItem('mc_lang') || 'th');

const modal = document.getElementById('videoModal');
const fullVideo = document.getElementById('fullVideo');
document.getElementById('openVideo').addEventListener('click', ()=>{
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
  fullVideo.play().catch(()=>{});
});
function closeModal(){
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
  fullVideo.pause(); fullVideo.currentTime = 0;
}
document.getElementById('closeVideo').addEventListener('click', closeModal);
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

</script>
