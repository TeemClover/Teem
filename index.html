<head>

<meta name="twitter:image" content="https://www.myclover.com/img/og-home.jpg">
<title>myClover — โชคดีในแบบของคุณ</title>
<meta name="description" content="ลองหยิบเข็มทิศ สำรวจสิ่งที่ตรงกับคุณ ทั้ง AI ครัวเอโกะ กิจวัตร และโอกาสใหม่ แล้วเริ่มทำอะไรดี ๆ ไปด้วยกัน">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="/frontdoor/art/compass-on-page.webp" as="image" fetchpriority="high">
<link rel="preload" href="/frontdoor/art/compass-body.webp" as="image" imagesrcset="/frontdoor/art/compass-body-mobile.webp 640w, /frontdoor/art/compass-body.webp 1000w" imagesizes="(max-width:700px) 62vw, 400px">
<link rel="preload" href="/frontdoor/art/paper-clean.webp" as="image">
<link rel="preload" href="/frontdoor/art/underpaper-valley.webp" as="image" media="(min-width:701px)">
<link rel="preload" href="/frontdoor/art/underpaper-valley-mobile.webp" as="image" media="(max-width:700px)">
<link rel="preload" href="/frontdoor/art/paper-rim.webp" as="image">
<link rel="stylesheet" href="/frontdoor/styles.css">
<link rel="stylesheet" href="/frontdoor/path.css">
<link rel="stylesheet" href="/frontdoor/rewards.css">
<link rel="stylesheet" href="/frontdoor/exhibit.css">
<link rel="stylesheet" href="/frontdoor/keepsakes.css">
<!-- LOCAL_TELEMETRY -->
<script type="module" src="/frontdoor/app.js"></script>
</head>
<body data-phase="opening">
<main id="playfield" class="playfield">
  <div class="world" aria-hidden="true">
    <div class="surround"></div>
    <div id="film-space" class="film-space">
      <video id="opening-film" muted playsinline preload="none" poster="/frontdoor/art/compass-on-page.webp"></video>
      <img id="paper-clean" class="paper-clean" src="/frontdoor/art/paper-clean.webp" alt="" width="810" height="1439">
      <canvas id="underpaper" class="underpaper"></canvas>
      <canvas id="paper-crossing" class="paper-crossing"></canvas>
      <div id="reflection" class="reflection"></div>
    </div>
    <div class="world-shade"></div>
  </div>
  <canvas id="world-assembly" class="world-assembly" aria-hidden="true" hidden></canvas>
  <div id="seed-exhibit" class="seed-exhibit" hidden></div>
  <header class="topbar"><a class="brand" href="/" aria-label="myClover home"><img src="/icons/icon-192.png" alt="" width="40" height="40"><span>my<em>Clover</em></span></a><div class="quiet-tools"><button id="motion-toggle" type="button" aria-pressed="true" aria-label="เอฟเฟกต์เคลื่อนไหว" title="การเคลื่อนไหวของเข็มทิศ น้ำ และการประกอบหน้า">เอฟเฟกต์: เปิด</button><button id="sound-toggle" type="button" aria-pressed="false" aria-label="เปิดเสียงเข็มทิศ">เสียงปิด</button></div></header>
  <section class="invitation" aria-labelledby="welcome-title"><p class="eyebrow">มีบางอย่างรอคุณอยู่</p><h1 id="welcome-title">ใครเจอเรา<br>คนนั้นโชคดี</h1><p class="invitation-line">ลองหยิบเข็มทิศดู</p></section>
  <button id="pickup" class="pickup" type="button" aria-label="หยิบเข็มทิศ"><span class="pickup-label">หยิบเข็มทิศ <span aria-hidden="true">↗</span></span></button>
  <div id="instrument" class="instrument" role="slider" tabindex="-1" aria-label="เลื่อนเข็มทิศสำรวจใต้กระดาษ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="44" aria-valuetext="เข็มทิศยังวางอยู่" aria-describedby="touch-hint" aria-hidden="true">
    <div class="contact-shadow" aria-hidden="true"></div>
    <div id="artifact" class="artifact" aria-hidden="true">
      <img class="compass-body" src="/frontdoor/art/compass-body.webp" srcset="/frontdoor/art/compass-body-mobile.webp 640w, /frontdoor/art/compass-body.webp 1000w" sizes="(max-width:700px) 62vw, 400px" alt="" width="1000" height="1000" draggable="false">
      <div class="dial-light"></div>
      <img id="needle" class="needle" src="/frontdoor/art/compass-needle.webp" alt="" width="700" height="700" draggable="false">
      <div class="glass-reflection"></div>
    </div>
  </div>
  <button id="paper-grip" class="paper-grip" type="button" aria-label="ดึงรอยพับเป็นทางข้าม" aria-describedby="crossing-hint" hidden><span>ลองดึง</span></button>
  <p id="crossing-hint" class="crossing-hint" hidden>ลองดึงรอยพับข้ามน้ำ</p>
  <div id="discovery-copy" class="discovery-copy" aria-hidden="true"><p id="touch-hint">ลองเลื่อนเข็มทิศดู</p><button id="retry-world" type="button" hidden>ลองเปิดภาพอีกครั้ง</button></div>
  <footer class="bottom-bar"><span id="opening-footnote">บ้านของความเป็นไปได้เล็ก ๆ</span><button id="put-down" type="button" hidden>วางคืน</button></footer>
  <button id="continue-discovery" class="continue-discovery" type="button" hidden>อีกฝั่ง มีอะไรรออยู่ <span aria-hidden="true">↗</span></button>
  <section id="path-copy" class="path-copy" aria-labelledby="path-title" hidden>
    <p id="path-overline" class="path-overline"></p><h2 id="path-title" tabindex="-1"></h2>
    <p id="path-line" class="path-line"></p><div id="path-answers" class="path-answers"></div>
    <button id="visit-house" class="visit-house" type="button" hidden>ตามรอยเจ้าบ้าน <span aria-hidden="true">↗</span></button>
    <button id="cross-seed" class="cross-seed" type="button" hidden>ลองเดินข้ามมา <span aria-hidden="true">↗</span></button>
    <div id="seed-reward" class="seed-reward" hidden></div>
    <p id="path-end" class="path-end" hidden></p>
    <div id="door-actions" class="door-actions" hidden><a id="open-path" class="open-path" href="#">ไปต่อ</a><button id="save-path" type="button">เก็บทางนี้ไว้</button></div>
    <div id="seed-next" class="seed-next" hidden><p>อยากไปต่อกับสิ่งนี้?</p><a id="seed-meet" href="#"></a><a id="seed-explore" href="#" hidden></a></div>
    <p id="path-status" class="path-status" role="status" aria-live="polite"></p>
    <button id="retry-assembly" type="button" hidden>ลองเปิดภาพอีกครั้ง</button>
    <button id="rebuild-path" class="rebuild-path" type="button" hidden>ลองเริ่มอีกทาง</button>
  </section>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main>
<noscript><p class="noscript">เข็มทิศต้องใช้ JavaScript · <a href="/hall.html">เปิดบ้าน myClover</a></p></noscript>
<script>
// Retain an early human tap while the module graph arrives over a slow connection.
document.addEventListener('click',event=>{if(!document.body.dataset.runtimeReady&&event.target.closest?.('#pickup')){document.body.dataset.earlyPickup='true';document.body.classList.add('pickup-pending');}},true);
</script>
</body>
</html>
