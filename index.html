<style>
:root{
  --deep:#071d12;--deep2:#0b2a19;--gold:#d1a64b;--gold2:#f1d18a;
  --cream:#fbf6ea;--ink:#10251a;--line:rgba(255,255,255,.15)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep);color:#fff}
body{font-family:"Anuphan",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}a{color:inherit;text-decoration:none}
button{border:0}
.page{position:relative;height:100svh;min-height:100svh;overflow:hidden;isolation:isolate}
.ambient{position:absolute;inset:-4%;background:
  linear-gradient(90deg,rgba(3,14,8,.88),rgba(3,14,8,.32) 52%,rgba(3,14,8,.58)),
  url("img/home-opening-poster.jpg") center/cover no-repeat;
  filter:blur(18px) saturate(.82);transform:scale(1.08);z-index:-3}
.shade{position:absolute;inset:0;background:
  radial-gradient(circle at 72% 45%,transparent 0 24%,rgba(3,14,8,.24) 48%,rgba(3,14,8,.72) 100%),
  linear-gradient(to bottom,rgba(0,0,0,.13),rgba(0,0,0,.25));z-index:-2}
.topbar{position:absolute;z-index:10;top:0;left:0;right:0;padding:max(14px,env(safe-area-inset-top)) clamp(18px,4vw,52px) 0;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bai Jamjuree",system-ui;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand img{width:34px;height:34px;border-radius:11px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.brand em{font-style:normal;color:#85d6a3}
.lang{display:flex;padding:5px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(7,29,18,.68);backdrop-filter:blur(12px)}
.lang button{min-width:47px;padding:9px 13px;border-radius:999px;background:transparent;color:rgba(255,255,255,.62);font-weight:800;cursor:pointer}
.lang button.active{background:var(--cream);color:var(--deep)}
.layout{height:100%;display:grid;grid-template-columns:minmax(330px,.82fr) minmax(320px,1.18fr);gap:clamp(28px,4vw,76px);align-items:center;width:min(1240px,calc(100% - 72px));margin:auto;padding-top:68px}
.copy{position:relative;z-index:4;max-width:560px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(251,246,234,.1);border:1px solid rgba(251,246,234,.18);backdrop-filter:blur(10px);color:var(--gold2);font-weight:700}
h1{font-family:"Bai Jamjuree",system-ui;font-size:clamp(42px,5.4vw,78px);line-height:.98;letter-spacing:-.055em;margin:20px 0 16px;max-width:8.5ch;text-wrap:balance}
.lead{font-size:clamp(17px,1.5vw,21px);line-height:1.7;color:rgba(255,255,255,.82);max-width:34ch;margin:0}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{min-height:54px;padding:14px 22px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:"Bai Jamjuree",system-ui;font-weight:800;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s}
.btn:hover{transform:translateY(-3px)}
.btn-primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--deep);box-shadow:0 18px 42px -24px rgba(209,166,75,.95)}
.btn-secondary{background:rgba(5,25,14,.64);color:#fff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px)}
.hint{margin-top:13px;color:rgba(255,255,255,.56);font-size:13px}
.stage{height:min(92svh,900px);display:grid;place-items:center;position:relative}
.stage::before{content:"";position:absolute;width:min(460px,88%);height:86%;border-radius:42px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);box-shadow:0 36px 100px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px)}
.stage video{position:relative;z-index:2;height:calc(100% - 34px);max-height:860px;width:auto;max-width:100%;object-fit:contain;border-radius:28px;background:#000;box-shadow:0 28px 70px rgba(0,0,0,.45)}
.stage-label{position:absolute;z-index:3;bottom:28px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(7,29,18,.74);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);font-size:12px;color:rgba(255,255,255,.75);white-space:nowrap}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(2,10,6,.92);backdrop-filter:blur(15px);padding:18px}
.modal.open{display:grid}
.dialog{position:relative;height:min(92svh,980px);max-width:100%}
.dialog video{height:100%;max-width:100%;border-radius:22px;background:#000;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.close{position:absolute;right:10px;top:10px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.64);color:#fff;font-size:21px;cursor:pointer;border:1px solid rgba(255,255,255,.25)}
@media(max-width:760px){
  .ambient{display:none}
  .shade{background:linear-gradient(to bottom,rgba(4,15,9,.12) 10%,rgba(4,15,9,.18) 46%,rgba(4,15,9,.88) 82%,rgba(4,15,9,.98))}
  .layout{display:block;width:100%;padding:0;height:100%}
  .stage{position:absolute;inset:0;height:100%;display:block}
  .stage::before,.stage-label{display:none}
  .stage video{width:100%;height:100%;max-height:none;object-fit:cover;border-radius:0;box-shadow:none}
  .copy{position:absolute;z-index:5;left:20px;right:20px;bottom:max(22px,env(safe-area-inset-bottom));max-width:none;text-align:center}
  .eyebrow{font-size:13px}
  h1{font-size:clamp(36px,10.8vw,54px);line-height:1.02;max-width:10ch;margin:14px auto 10px}
  .lead{font-size:15.5px;max-width:31ch;margin:auto;color:rgba(255,255,255,.84)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  .btn{min-height:56px;padding:12px 11px;font-size:15px;border-radius:17px}
  .hint{display:none}
}
@media(max-width:420px){
  .topbar{padding-left:15px;padding-right:15px}.brand span{display:none}
  .actions{grid-template-columns:1fr}.btn{min-height:52px}
  h1{font-size:38px}.lead{font-size:14.5px}
}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
<style id="home-fullscreen-final">

.copy{position:absolute!important;z-index:5!important;left:clamp(24px,6vw,86px)!important;right:auto!important;bottom:clamp(28px,7vh,78px)!important;max-width:560px!important;text-align:left!important}
@media(max-width:760px){
  .copy{left:20px!important;right:20px!important;bottom:max(22px,env(safe-area-inset-bottom))!important;max-width:none!important;text-align:center!important}
}

<script type="application/ld+json">

    {"@type":"Organization","@id":"https://www.myclover.com/#organization","name":"myClover","url":"https://www.myclover.com/","logo":{"@type":"ImageObject","url":"https://www.myclover.com/icons/icon-512.png"},"slogan":"ใครเจอเรา คนนั้นโชคดี"},
    {"@type":"WebPage","@id":"https://www.myclover.com/#webpage","url":"https://www.myclover.com/","name":"myClover — เรียน AI ฟรีผ่านเรื่องเล่า บทเรียน และเกม","isPartOf":{"@id":"https://www.myclover.com/#website"},"about":{"@id":"https://www.myclover.com/#organization"},"inLanguage":"th-TH"}

<body>
<main class="page">
  <div class="ambient" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <nav class="topbar">
    <a class="brand" href="/" aria-label="myClover home">
      <img src="/icons/icon-192.png" alt="">
      <span>my<em>Clover</em></span>
    </a>
    <div class="lang" aria-label="Language">
      <button type="button" class="active" data-lang="th">TH</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </nav>

  <div class="layout">
    <section class="copy" aria-labelledby="homeTitle">
      <span class="eyebrow" data-i18n="eyebrow">🍀 ใครเจอเรา คนนั้นโชคดี</span>
      <h1 id="homeTitle" data-i18n="title">เปิดบ้าน myClover</h1>
      <p class="lead" data-i18n="lead">ข้างในมีทั้งเรื่องเล่า บทเรียน เกม และของที่หยิบกลับไปใช้ได้จริง</p>
      <div class="actions">
        <button class="btn btn-primary" id="openVideo" type="button" data-i18n="watch">▶ ดูคลิปเปิดบ้าน</button>
        <a class="btn btn-secondary" href="hall.html" data-i18n="compass">🧭 หยิบเข็มทิศ</a>
      </div>
      <p class="hint" data-i18n="hint">ดูคลิปก่อน หรือเข้าไปเริ่มเล่นในบ้านได้เลย</p>
    </section>

    <section class="stage" aria-label="วิดีโอเปิดบ้าน">
      <video id="bgVideo" autoplay muted loop playsinline preload="metadata" poster="img/home-opening-poster.jpg">
        <source src="media/home-opening-bg.mp4" type="video/mp4">
      </video>
      <span class="stage-label" data-i18n="stage">คลิปแนะนำบ้าน · 44 วินาที</span>
    </section>
  </div>
</main>

<div class="modal" id="videoModal" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="คลิปเปิดบ้าน 44 วินาที">
    <button class="close" id="closeVideo" aria-label="ปิด">✕</button>
    <video id="fullVideo" controls playsinline preload="none" poster="img/home-opening-poster.jpg">
      <source src="media/home-opening-full.mp4" type="video/mp4">
    </video>
  </div>
</div>

<script>
(function(){
  document.addEventListener("gesturestart",function(e){e.preventDefault()},{passive:false});
  document.addEventListener("gesturechange",function(e){e.preventDefault()},{passive:false});
  document.addEventListener("gestureend",function(e){e.preventDefault()},{passive:false});

  var TEXT={
    th:{
      eyebrow:"🍀 ใครเจอเรา คนนั้นโชคดี",
      title:"เปิดบ้าน myClover",
      lead:"ข้างในมีทั้งเรื่องเล่า บทเรียน เกม และของที่หยิบกลับไปใช้ได้จริง",
      watch:"▶ ดูคลิปเปิดบ้าน",
      compass:"🧭 หยิบเข็มทิศ",
      hint:"ดูคลิปก่อน หรือเข้าไปเริ่มเล่นในบ้านได้เลย",
      stage:"คลิปแนะนำบ้าน · 44 วินาที"
    },
    en:{
      eyebrow:"🍀 Those who find us leave with something lucky",
      title:"Welcome to myClover",
      lead:"Inside are stories, lessons, a game, and useful things you can take with you.",
      watch:"▶ Watch the house intro",
      compass:"🧭 Pick up the compass",
      hint:"Watch first, or step inside and start playing.",
      stage:"House introduction · 44 seconds"
    }
  };
  function setLang(lang){
    document.documentElement.lang=lang;
    document.querySelectorAll("[data-lang]").forEach(function(b){
      b.classList.toggle("active",b.dataset.lang===lang);
    });
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      el.textContent=TEXT[lang][el.dataset.i18n];
    });
    try{localStorage.setItem("mc_lang",lang)}catch(e){}
  }
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click",function(){setLang(b.dataset.lang)});
  });
  var lang="th";
  try{lang=localStorage.getItem("mc_lang")||"th"}catch(e){}
  setLang(lang);

  var modal=document.getElementById("videoModal");
  var full=document.getElementById("fullVideo");
  var bg=document.getElementById("bgVideo");
  function openModal(){
    modal.classList.add("open");
    modal.setAttribute("aria-hidden","false");
    bg.pause();
    full.play().catch(function(){});
  }
  function closeModal(){
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden","true");
    full.pause();
    full.currentTime=0;
    bg.play().catch(function(){});
  }
  document.getElementById("openVideo").addEventListener("click",openModal);
  document.getElementById("closeVideo").addEventListener("click",closeModal);
  modal.addEventListener("click",function(e){if(e.target===modal)closeModal()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&modal.classList.contains("open"))closeModal()});
})();
</script>
</body>
