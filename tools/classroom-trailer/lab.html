<!doctype html><html lang="th"><head><meta charset="utf-8"><title>trailer lab</title>
<style>
@font-face{font-family:"Reel Kanit";font-weight:800;src:url(/assets/fonts/reel/kanit-800-thai.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Reel Kanit";font-weight:800;src:url(/assets/fonts/reel/kanit-800-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212}
@font-face{font-family:"Reel Mitr";font-weight:600;src:url(/assets/fonts/reel/mitr-600-thai.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Reel Mitr";font-weight:600;src:url(/assets/fonts/reel/mitr-600-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212}
@font-face{font-family:"Reel Chakra";font-weight:700;src:url(/assets/fonts/reel/chakra-petch-700-thai.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Reel Chakra";font-weight:700;src:url(/assets/fonts/reel/chakra-petch-700-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212}
@font-face{font-family:"Reel Charm";font-weight:700;src:url(/assets/fonts/reel/charm-700-thai.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Reel Charm";font-weight:700;src:url(/assets/fonts/reel/charm-700-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212}
@font-face{font-family:"Reel Sriracha";font-weight:400;src:url(/assets/fonts/reel/sriracha-400-thai.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Reel Sriracha";font-weight:400;src:url(/assets/fonts/reel/sriracha-400-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212}
body{margin:0;background:#222;color:#ccc;font:12px system-ui}#grid{display:flex;flex-wrap:wrap;gap:6px;padding:6px}figure{margin:0}figcaption{padding:2px 0}canvas{display:block;background:#000}
</style></head><body><div id="grid"></div>
<script>
// Usage: /zz-trailer-lab.html?times=12,13.5,15&w=640&h=360  (CSS px per frame; add &bundle=1 to test the built asset)
const P=new URLSearchParams(location.search);const bundle=P.get('bundle')==='1';
const files=bundle?['/assets/classroom-trailer.js']:['/tools/classroom-trailer/engine.js','/tools/classroom-trailer/meta.js','/tools/classroom-trailer/hud.js','/tools/classroom-trailer/score.js',...(P.get('scenes')||'').split(',').filter(Boolean).map(f=>'/tools/classroom-trailer/scenes/'+f)];
(async()=>{
 if(!bundle&&!P.get('scenes')){const r=await fetch('/tools/classroom-trailer/scenes/');const html=await r.text();for(const m of html.matchAll(/href="([^"]+\.js)"/g))files.push('/tools/classroom-trailer/scenes/'+m[1]);}
 for(const f of files){await new Promise(res=>{const s=document.createElement('script');s.src=f+'?v='+Date.now();s.onload=res;s.onerror=()=>{console.warn('missing',f);res();};document.head.appendChild(s);});}
 await MC_TRAILER.fontsReady();
 const w=+P.get('w')||640,h=+P.get('h')||360,dpr=+P.get('dpr')||1;
 const times=(P.get('times')||'0,5,10,15,20,25,30,35,40,45,50,55').split(',').map(Number);
 const grid=document.getElementById('grid');
 for(const T of times){const f=document.createElement('figure');const c=document.createElement('canvas');c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';const cap=document.createElement('figcaption');cap.textContent='T='+T;f.append(c,cap);grid.append(f);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);MC_TRAILER.render(ctx,w,h,T,{reduced:P.get('reduced')==='1'});}
 if(P.get('audio')==='1'){
  const sr=22050,oac=new OfflineAudioContext(2,sr*60,sr);const syn=MC_TRAILER.Synth(oac);let errs=0;
  for(const c of MC_TRAILER.score){try{MC_TRAILER.playCue(syn,c,c.t);}catch(e){errs++;}}
  const buf=await oac.startRendering();const L=buf.getChannelData(0),R=buf.getChannelData(1);const rows=[];
  for(let sec=0;sec<60;sec++){let pk=0,sum=0;for(let i=sec*sr;i<(sec+1)*sr;i++){const v=Math.max(Math.abs(L[i]),Math.abs(R[i]));pk=Math.max(pk,v);sum+=L[i]*L[i];}rows.push({sec,peak:+pk.toFixed(3),rmsDb:+(10*Math.log10(sum/sr+1e-12)).toFixed(1)});}
  const clipped=rows.filter(r=>r.peak>=0.999).map(r=>r.sec);
  const pre=document.createElement('pre');pre.id='audioReport';pre.textContent=JSON.stringify({cues:MC_TRAILER.score.length,errors:errs,clippedSeconds:clipped,rows});document.body.prepend(pre);window.__audio=JSON.parse(pre.textContent);
 }
 document.title='ready';window.__labReady=true;
})();
</script></body></html>
