<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>บ้านทดลอง · Lucky Source</title><link rel="stylesheet" href="./style.css"></head><body>
<header><a id="project-name" href="./">บ้านของฉัน</a><span>บ้านสมมติ · จุดเริ่มต้นของคุณ</span></header>
<main><section class="stage"><div class="intro"><p>จากวัตถุดิบของคุณ สู่บ้านที่เล่นได้</p><h1 id="title"></h1></div>
<nav class="lenses" aria-label="วิธีสำรวจ"><button data-lens="model">โมเดล</button><button data-lens="plan">แปลน</button><button data-lens="photo">รูปจริง</button></nav>
<div id="scene" aria-label="บ้านสามมิติ ลากหมุน ใช้ล้อเมาส์หรือสองนิ้วซูม" tabindex="0"></div><div id="plan" hidden></div><div id="photos" hidden></div><p id="status" role="status">กำลังเปิดบ้านทดลอง…</p>
<div class="camera" aria-label="มุมกล้อง"><button data-camera="in" aria-label="ซูมเข้า">＋</button><button data-camera="out" aria-label="ซูมออก">−</button><button data-camera="reset" aria-label="คืนมุมเดิม">⌂</button></div>
<div class="dock"><div class="quality" role="group" aria-label="คุณภาพ"><button data-quality="sd">SD <small>มาตรฐาน</small></button><button data-quality="hd">HD <small>ความละเอียดสูง</small></button></div><div class="floors" role="group" aria-label="เลือกชั้น"><button data-view="whole">ทั้งหลัง</button><button data-view="f1">ชั้น 1</button><button data-view="f2">ชั้น 2</button><button data-view="exploded">แยกชั้น</button></div><div id="walls" role="group" aria-label="ผนัง"><span>ผนัง</span><button data-wall="full">Full</button><button data-wall="auto">Auto</button><button data-wall="low">Low</button></div></div>
</section><aside><p class="eyebrow">บ้านของคุณ เริ่มจากตรงนี้</p><h2 id="room-name">ลองเปิดดูข้างใน</h2><p id="description"></p><button id="inside" class="primary">เปิดดูข้างใน ↗</button><div class="layers"><label><input id="builtins" type="checkbox" checked> บิลต์อิน</label><label><input id="furniture" type="checkbox" checked> เฟอร์นิเจอร์</label></div><div id="rooms"></div><p class="note">SD / HD ในชุดนี้เป็นฐานเริ่มต้น ให้ AI เติมรายละเอียดจากภาพของคุณตาม bottles/</p></aside></main>
<footer class="lucky-credit"><a href="https://www.myclover.com/showcase/house/?utm_source=lucky_source&amp;utm_medium=credit&amp;utm_campaign=house_quest" target="_blank" rel="noopener noreferrer">Lucky Source by myClover · ซอสจากเรา รสชาติของคุณ 🍀</a></footer><script type="module" src="./app.js"></script></body></html>
