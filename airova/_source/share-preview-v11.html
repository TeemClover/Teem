<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>myClover × Airova — 50-credit partner privilege</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#040815;color:#eee;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto}canvas{display:block;width:100%;height:auto}footer{padding:18px 24px;display:flex;gap:24px;align-items:center;font-size:14px}a{color:#d1ff28}p{margin:0;color:#9ca9bd}</style></head>
<body><main><canvas id="artwork" width="2400" height="1260" role="img" aria-label="myClover × Airova สร้างวิดีโอพูดไทยด้วย AI ฟรี 50 เครดิต สิทธิพิเศษจาก myClover พร้อม MCP Ready"></canvas><footer><a id="download-preview" download="airova-share-50-privilege-v11.png">ดาวน์โหลดภาพ PNG</a><p id="render-status" role="status">กำลังจัดภาพ…</p></footer></main>
<script type="module">
const canvas=document.querySelector('#artwork'),ctx=canvas.getContext('2d');ctx.scale(2,2);
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
const [original,cta]=await Promise.all(['../assets/airova-share-exclusive-50-v10.png','share-v11-cta-patch.png'].map(load));
ctx.drawImage(original,0,0,1200,630);
// Preserve the 50-credit offer, approved portrait, original logos, lighting and MCP.
// Replace only the CTA wording; this benefit does not imply an exclusive provider.
ctx.save();ctx.beginPath();ctx.rect(43,509,434,62);ctx.clip();ctx.drawImage(cta,0,0,1200,630);ctx.restore();
document.querySelector('#download-preview').href=canvas.toDataURL('image/png');document.querySelector('#render-status').textContent='ภาพพร้อมแล้ว · PNG 2400 × 1260';document.documentElement.dataset.rendered='true';
</script></body></html>
