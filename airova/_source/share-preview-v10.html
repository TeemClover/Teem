<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>myClover × Airova — Exclusive 50 credits</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#040815;color:#eee;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto}canvas{display:block;width:100%;height:auto}footer{padding:18px 24px;display:flex;gap:24px;align-items:center;font-size:14px}a{color:#d1ff28}p{margin:0;color:#9ca9bd}</style></head>
<body><main><canvas id="artwork" width="2400" height="1260" role="img" aria-label="myClover × Airova สร้างวิดีโอพูดไทยด้วย AI ฟรี 50 เครดิต เฉพาะผู้สมัครผ่าน myClover พร้อม MCP Ready"></canvas><footer><a id="download-preview" download="airova-share-exclusive-50-v10.png">ดาวน์โหลดภาพ PNG</a><p id="render-status" role="status">กำลังจัดภาพ…</p></footer></main>
<script type="module">
const canvas=document.querySelector('#artwork'),ctx=canvas.getContext('2d');ctx.scale(2,2);
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
const [original,offer]=await Promise.all(['../assets/airova-share-original-v9.png','share-v10-offer-patch.png'].map(load));
// Keep the approved V9's entire continuous artwork, original logos and MCP module.
ctx.drawImage(original,0,0,1200,630);
// Only the changed offer number and CTA come from the surgical edit.
for(const [x,y,w,h] of [[171,326,173,113],[43,509,434,62]]){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(offer,0,0,1200,630);ctx.restore();
}
document.querySelector('#download-preview').href=canvas.toDataURL('image/png');document.querySelector('#render-status').textContent='ภาพพร้อมแล้ว · PNG 2400 × 1260';document.documentElement.dataset.rendered='true';
</script></body></html>
