<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airova share preview — original brand assets</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #030b1c; }
    .art { position: absolute; inset: 0; width: 1200px; height: 630px; }
    .brands { position: absolute; left: 42px; top: 26px; height: 65px; display: flex; align-items: center; gap: 17px; color: white; }
    .myclover { display: flex; align-items: center; gap: 9px; font: 500 34px 'Space Grotesk', sans-serif; white-space: nowrap; }
    .myclover b { font-weight: 700; }
    .myclover img { width: 57px; height: 57px; object-fit: contain; }
    .cross { font: 400 26px 'Space Grotesk', sans-serif; color: #b7bcc5; }
    .airova { width: 190px; height: 61px; object-fit: contain; }
    .partner { position: absolute; left: 44px; top: 102px; width: 454px; margin: 0; color: #f8f8fc; text-align: center; font: 500 12px/18px 'Space Grotesk', sans-serif; letter-spacing: 4px; }
  </style>
</head>
<body>
  <img class="art" src="share-preview-clean.jpg" alt="ภาพแคมเปญสร้างวิดีโอพูดไทยด้วย AI ฟรี 30 เครดิต">
  <div class="brands">
    <div class="myclover"><img src="../../assets/myclover-icon.png" alt="โลโก้ myClover ต้นฉบับ"><span>my<b>Clover</b></span></div>
    <span class="cross" aria-hidden="true">×</span>
    <img class="airova" src="../assets/aistudio-white.svg" alt="โลโก้ Airova Studio ต้นฉบับ">
  </div>
  <p class="partner">OFFICIAL PARTNER</p>
</body>
</html>
