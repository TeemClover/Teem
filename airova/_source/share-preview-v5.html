<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airova — vivid share artwork v5</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:2400px;height:1260px;overflow:hidden;background:#020519;color:#fff}
.canvas{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Anuphan,sans-serif}
.art{position:absolute;inset:0;width:1200px;height:630px;object-fit:cover}
.brands{position:absolute;top:34px;left:38px;display:flex;align-items:center;gap:16px;height:60px}
.myclover{display:flex;align-items:center;gap:9px;white-space:nowrap;font:500 33px 'Space Grotesk',sans-serif}.myclover b{font-weight:700}.myclover img{width:53px;height:53px;object-fit:contain}
.cross{font:500 24px 'Space Grotesk',sans-serif;color:#bfc6d4}.airova{width:188px;height:60px;object-fit:contain}
.partner{position:absolute;top:100px;left:40px;width:442px;margin:0;text-align:center;font:500 11px 'Space Grotesk',sans-serif;letter-spacing:3.6px;color:#dfe6fc}
.headline{position:absolute;left:40px;top:155px;margin:0;font-size:69px;line-height:1.06;letter-spacing:-2px;font-weight:700;text-shadow:0 2px 4px #0004}.headline span{display:block;font-size:59px;line-height:1.24}
.offer{position:absolute;left:40px;top:327px;margin:0;display:flex;align-items:baseline;gap:10px;color:#d3ff42;font-size:57px;font-weight:700;letter-spacing:-2px;line-height:1.2}.offer b{font:700 98px/1 'Space Grotesk',sans-serif;letter-spacing:-6px;margin-right:4px}
.models{position:absolute;left:44px;top:443px;margin:0;font:500 26px/1.2 'Space Grotesk',sans-serif;color:#eef0fa;letter-spacing:-.5px}
.cta{position:absolute;left:40px;top:505px;display:flex;align-items:center;gap:24px;border-radius:50px;background:#d3ff42;color:#111719;font-size:26px;line-height:1.2;font-weight:700;padding:17px 26px;box-shadow:0 0 32px #b7f72c32}.cta span{font:500 35px/.8 'Space Grotesk',sans-serif}
.mcp-badge{position:absolute;right:24px;bottom:24px;width:258px;padding:15px 16px;border:1px solid #d9eeaa;border-radius:13px;background:#070b16f5;box-shadow:0 6px 25px #03081780}
.mcp-title{display:flex;align-items:center;gap:10px;margin:0 0 11px;font:700 27px/1.15 'Space Grotesk',sans-serif;letter-spacing:-.5px}.ready-dot{width:8px;height:8px;flex:none;border-radius:50%;background:#d3ff42}.clients{display:flex;align-items:center;justify-content:space-between}.client{display:flex;align-items:center;gap:7px;font:500 17px/1 'Space Grotesk',sans-serif}.client img{border-radius:5px;width:29px;height:29px;object-fit:contain}
</style>
</head>
<body><main class="canvas">
<img class="art" src="share-v5-art.png" alt="ภาพใหม่สีสดจากภาพบุคคลต้นฉบับ">
<div class="brands"><div class="myclover"><img src="../../assets/myclover-icon.png" alt="myClover"><span>my<b>Clover</b></span></div><span class="cross">×</span><img class="airova" src="../assets/aistudio-white.svg" alt="Airova Studio"></div>
<p class="partner">OFFICIAL PARTNER</p>
<h1 class="headline">สร้างวิดีโอ<span>พูดไทยด้วย AI</span></h1>
<p class="offer">ฟรี <b>30</b> เครดิต</p>
<p class="models">Omni · Seedance 2.5</p>
<div class="cta">สมัครแล้วเริ่มสร้างได้เลย <span>↗</span></div>
<aside class="mcp-badge" aria-label="MCP Ready: ChatGPT and Claude"><p class="mcp-title"><span class="ready-dot"></span>MCP Ready</p><div class="clients"><span class="client"><img src="chatgpt-icon-official.png" alt="">ChatGPT</span><span class="client"><img src="claude-symbol-official.svg" alt="">Claude</span></div></aside>
</main></body></html>
