<script type="module">
const canvas=document.querySelector('#artwork');const ctx=canvas.getContext('2d');ctx.scale(2,2);
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});

round(984,568,195,49,8,'#070d20f2','#cdc6ff55');ctx.beginPath();ctx.arc(997,583,2.3,0,Math.PI*2);ctx.fillStyle='#c9ff23';ctx.fill();text('MCP Ready',1007,588,'600 15px "Space Grotesk"');
contain(gpt,997,596,15,15);text('ChatGPT',1017,607,'500 10px "Space Grotesk"','#eff0fa');contain(claude,1080,596,15,15);text('Claude',1101,607,'500 10px "Space Grotesk"','#eff0fa');
