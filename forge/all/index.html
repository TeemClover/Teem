.bar .home em{font-style:normal;color:rgb(var(--gold))}
.bar .ttl{margin-left:auto;text-align:right;font-size:13px;color:rgb(255 255 255/.72);min-width:0}
.bar .ttl b{display:block;font-family:"Bai Jamjuree";font-size:14.5px;color:#fff;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{text-align:center;color:rgb(var(--muted));font-size:12.5px;padding:34px 0 48px}
footer a{color:rgb(var(--green));font-weight:600}
.sp{display:inline-block;background:rgb(var(--gold));color:rgb(var(--deep));font-family:"Bai Jamjuree";font-weight:700;
  font-size:10.5px;border-radius:6px;padding:2px 8px;letter-spacing:.04em;vertical-align:middle}

.allbtn{font-family:"Bai Jamjuree";font-weight:700;font-size:12.5px;color:rgb(var(--gold));
  border:1px solid rgb(190 148 66/.5);border-radius:999px;padding:0 13px;white-space:nowrap;
  min-height:44px;display:inline-flex;align-items:center}
@media(max-width:600px){.bar .ttl{display:none}}
#prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:80;
  background:linear-gradient(90deg,rgb(var(--green)),rgb(var(--gold)))}
/* ภาพต่อกันสนิท: ไม่มีขอบ ไม่มีช่องไฟ ไม่มีหัวข้อคั่น */
.strip{background:rgb(var(--deep));font-size:0;line-height:0}
.strip picture{display:block}
.strip img{width:100%;height:auto;margin:0;display:block}
/* ป้ายบอกตอน ลอยอยู่เหนือภาพ ไม่ได้แทรกกลางเนื้อเรื่อง */
#chip{position:fixed;right:14px;bottom:16px;z-index:70;background:rgb(10 40 24/.92);color:#fff;
  border:1px solid rgb(190 148 66/.45);border-radius:999px;padding:9px 16px;
  font-family:"Bai Jamjuree";font-weight:700;font-size:13px;backdrop-filter:blur(6px);
  box-shadow:0 10px 26px -12px rgb(0 0 0/.7);opacity:0;transition:opacity .3s;pointer-events:none}
#chip.on{opacity:1}
#top{position:fixed;left:14px;bottom:16px;z-index:70;background:rgb(10 40 24/.92);color:rgb(var(--gold));
  border:1px solid rgb(190 148 66/.45);border-radius:999px;width:46px;height:46px;
  display:none;align-items:center;justify-content:center;font-size:17px;backdrop-filter:blur(6px)}
#top.on{display:flex}
.endcap{background:rgb(var(--deep));color:#fff;text-align:center;padding:44px 20px 50px;line-height:1.7}
.endcap b{display:block;font-family:"Bai Jamjuree";font-size:19px;margin-bottom:6px}
.endcap p{color:rgb(255 255 255/.75);font-size:14.5px}
.endcap .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.endcap a{min-height:48px;display:inline-flex;align-items:center;padding:0 22px;border-radius:12px;
  font-family:"Bai Jamjuree";font-weight:700;font-size:15px;background:rgb(255 255 255/.1);
  border:1px solid rgb(255 255 255/.22)}
.endcap a.gold{background:rgb(var(--gold));color:rgb(var(--deep));border-color:rgb(var(--gold))}

<script>
(function(){
  var prog=document.getElementById('prog'), chip=document.getElementById('chip'),
      top=document.getElementById('top'), ticking=false;
  function upd(){
    var h=document.documentElement.scrollHeight-window.innerHeight;
    prog.style.width=(h>0?(scrollY/h)*100:0)+'%';
    top.classList.toggle('on', scrollY>1200);
    ticking=false;
  }
  addEventListener('scroll',function(){ if(!ticking){ticking=true;requestAnimationFrame(upd);} },{passive:true});
  upd();
  // ป้ายบอกว่าอ่านถึงตอนไหน — โผล่ตอนเลื่อน แล้วจางหายเอง
  var hide;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){
          chip.textContent='ตอนที่ '+e.target.dataset.no;
          chip.classList.add('on');
          clearTimeout(hide); hide=setTimeout(function(){chip.classList.remove('on');},1800);
        }
      });
    },{rootMargin:'-45% 0px -45% 0px'});
    document.querySelectorAll('.strip picture').forEach(function(p){io.observe(p);});
  }
})();
</script>
