<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เลือกมือ 7 ใบ — myClover: CORE7</title>
<meta name="description" content="เลือกมือ CORE7 แบบ Quick หรือจัดมือจากการ์ด FIRST HAND ที่ปลดล็อกแล้ว">
<meta name="theme-color" content="#0A2818">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/core7/css/core7.css">
<style>
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;padding:7px;border:1px solid rgb(var(--line)/.12);border-radius:17px;background:#fff;box-shadow:0 16px 38px -32px rgb(0 0 0/.5)}
.mode-btn{position:relative;min-height:68px;border:1px solid transparent;border-radius:12px;padding:11px 15px;text-align:left;background:transparent;color:rgb(var(--ink));cursor:pointer}
.mode-btn b{display:block;font-family:"Bai Jamjuree";font-size:15px}.mode-btn span{display:block;margin-top:2px;color:rgb(var(--muted));font-size:11.5px;line-height:1.45}.mode-btn[aria-pressed="true"]{border-color:rgb(var(--gold)/.42);background:linear-gradient(135deg,rgb(var(--felt)),rgb(var(--deep)));color:#fff}.mode-btn[aria-pressed="true"] span{color:rgb(255 255 255/.65)}.mode-btn:disabled{cursor:not-allowed;opacity:.58}
.collection-status{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:13px;padding:12px 15px;border:1px solid rgb(var(--line)/.1);border-radius:13px;background:rgb(var(--gold)/.07);font-size:12.5px}.collection-status b{font-family:"Bai Jamjuree";color:rgb(var(--green));font-size:17px}.collection-status a{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:16px}
.pick-cell{position:relative;border:0;background:none;padding:0;border-radius:10px;transition:transform .15s}
.pick-cell svg{width:100%;height:auto;display:block;border-radius:8px}
.pick-cell .cnt{position:absolute;top:6px;left:6px;background:rgb(var(--gold));color:rgb(var(--deep));font-family:"Bai Jamjuree";font-weight:700;border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgb(0 0 0/.3)}
.pick-cell.picked{outline:3px solid rgb(var(--gold));outline-offset:2px}.pick-cell:hover{transform:translateY(-3px)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.filters button{border:1px solid rgb(var(--line)/.18);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:13.5px;min-height:40px}.filters button[aria-pressed="true"]{background:rgb(var(--deep));color:#fff;border-color:transparent}
.presetrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.select-note{margin-top:18px;padding:16px 18px;border:1px solid rgb(var(--gold)/.28);border-radius:14px;background:rgb(var(--gold)/.08);font-size:13.5px}.select-note b{font-family:"Bai Jamjuree"}.select-note[hidden]{display:none}
@media(max-width:600px){.mode-switch{grid-template-columns:1fr}.collection-status{align-items:flex-start}.pick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<nav class="c7nav" id="c7nav"></nav>
<main class="sec">
  <div class="wrap">
    <p class="eyebrow">Build Your Hand</p>
    <h2 class="disp">🖐️ เลือกมือ 7 ใบ</h2>
    <p class="lead" data-en="QUICK uses Generic cards — just pick how many of each color. SELECT uses only the FIRST HAND cards you have unlocked.">QUICK ใช้ Generic เลือกจำนวนสีทันที ส่วน SELECT ใช้เฉพาะ FIRST HAND ที่คุณปลดล็อกจริง</p>

    <div class="mode-switch" role="group" aria-label="รูปแบบการเลือกมือ">
      <button class="mode-btn" id="quickMode" type="button" aria-pressed="true">
        <b>⚡ QUICK</b><span data-en="Four Generic colors. Pick the counts and play.">ใช้ Generic 4 สี เลือกจำนวนสีแล้วเล่นได้ทันที</span>
      </button>
      <button class="mode-btn" id="selectMode" type="button" aria-pressed="false">
        <b>🎴 SELECT</b><span id="selectModeDesc" data-en="Build from the FIRST HAND cards you own">จัดมือจาก FIRST HAND ที่ปลดล็อกแล้ว</span>
      </button>
    </div>
    <div class="collection-status">
      <span data-en="FIRST HAND · one finished Match unlocks one card">FIRST HAND · เล่นจบ 1 Match ปลดล็อก 1 ใบ</span>
      <b id="collectionCount">0/28</b>
      <a href="/core7/collection/" data-en="View Collection">ดู Collection</a>
    </div>

    <section id="quickPanel">
      <div class="panel" style="margin-top:20px" id="counters"></div>
    </section>

    <section id="selectPanel" hidden>
      <div class="select-note" id="selectLocked" hidden></div>
      <div id="selectContent">
        <div class="filters" id="filters" role="group" aria-label="กรองการ์ด"></div>
        <div class="presetrow" id="presets"></div>
        <div class="pick-grid" id="grid"></div>
      </div>
    </section>

    <div class="hb-total">
      <span class="t" id="total">0 / 7</span>
      <span id="mix" style="font-size:13px;color:rgb(255 255 255/.75);flex:1"></span>
      <button class="btn btn-gold" id="ready" disabled data-en="🖐️ Ready →">🖐️ พร้อมเล่น →</button>
    </div>
  </div>
</main>
<footer class="c7foot" id="c7foot"></footer>
<script type="module">
import { renderShell, toast, el } from '/core7/js/ui.js';
import { COLOR_META, FIRST_HAND, cardById } from '/core7/js/cards.js';
import { colorIcon, cardSVG } from '/core7/js/art.js';
import { COLORS } from '/core7/js/rules.js';
import {
  SELECT_MODE_UNLOCK_COUNT,
  TOTAL_COLLECTION_CARDS,
  canUseSelectMode,
  getCollectionIds,
  getHandMode,
  setHandMode,
} from '/core7/js/collection-progress.js';
import * as store from '/core7/js/store.js';

renderShell({});
const qs = new URLSearchParams(location.search);
const next = qs.get('next') || 'bot';
const collectionIds = getCollectionIds();
const owned = new Set(collectionIds);
const selectUnlocked = canUseSelectMode();
let mode = getHandMode();

/* QUICK uses Generic cards. SELECT is a separate system containing only
   unlocked FIRST HAND IDs and never allows duplicate cards. */
let counts = { RED: 2, GREEN: 2, BLUE: 2, SILVER: 1 };
let picked = [];
const savedHand = store.getHand();
if (savedHand?.length === 7) {
  const savedCards = savedHand.map(cardById);
  if (savedCards.every(Boolean) && savedCards.every(card => card.generic)) {
    counts = { RED: 0, GREEN: 0, BLUE: 0, SILVER: 0 };
    for (const card of savedCards) counts[card.color] += 1;
  }
  if (new Set(savedHand).size === 7 && savedHand.every(id => owned.has(id))) picked = [...savedHand];
}

const quickButton = document.getElementById('quickMode');
const selectButton = document.getElementById('selectMode');
const selectDesc = document.getElementById('selectModeDesc');
const quickPanel = document.getElementById('quickPanel');
const selectPanel = document.getElementById('selectPanel');
const selectLocked = document.getElementById('selectLocked');
const selectContent = document.getElementById('selectContent');
const totalEl = document.getElementById('total');
const mixEl = document.getElementById('mix');
const readyBtn = document.getElementById('ready');

document.getElementById('collectionCount').textContent = `${collectionIds.length}/${TOTAL_COLLECTION_CARDS}`;
if (!selectUnlocked) {
  const remaining = Math.max(0, SELECT_MODE_UNLOCK_COUNT - collectionIds.length);
  selectButton.disabled = true;
  selectDesc.textContent = `🔒 ปลดล็อก FIRST HAND ให้ครบ ${SELECT_MODE_UNLOCK_COUNT} ใบ · อีก ${remaining} ใบ`;
  selectLocked.hidden = false;
  selectLocked.innerHTML = `<b data-en="SELECT HAND is still locked">SELECT HAND ยังล็อกอยู่</b><br>เล่นจบอีก ${remaining} Match เพื่อปลดล็อก FIRST HAND ให้ครบ ${SELECT_MODE_UNLOCK_COUNT} ใบ แล้วจึงจัดมือ 7 ใบจาก Collection ได้ Generic 4 สีไม่นับรวมและไม่เข้ามาปนในโหมดนี้`;
  selectContent.hidden = true;
  mode = 'quick';
  setHandMode('quick');
} else {
  selectDesc.textContent = `เลือกจาก FIRST HAND ที่ปลดล็อกแล้ว ${collectionIds.length} ใบ`;
}

function currentCards() {
  if (mode === 'select') return [...picked];
  const generic = { RED: 'gen-red', GREEN: 'gen-green', BLUE: 'gen-blue', SILVER: 'gen-silver' };
  const cards = [];
  for (const [color, amount] of Object.entries(counts)) {
    for (let i = 0; i < amount; i += 1) cards.push(generic[color]);
  }
  return cards;
}

function refreshTotal() {
  const cards = currentCards();
  totalEl.textContent = `${cards.length} / 7`;
  const mix = {};
  for (const id of cards) {
    const card = cardById(id);
    if (card) mix[card.color] = (mix[card.color] || 0) + 1;
  }
  mixEl.textContent = Object.entries(mix).map(([color, amount]) => `${COLOR_META[color].emoji}${amount}`).join('  ');
  readyBtn.disabled = cards.length !== 7;
}

function switchMode(nextMode) {
  if (nextMode === 'select' && !selectUnlocked) {
    toast(`ปลดล็อก FIRST HAND ให้ครบ ${SELECT_MODE_UNLOCK_COUNT} ใบก่อน`);
    return;
  }
  mode = setHandMode(nextMode);
  const quick = mode === 'quick';
  quickButton.setAttribute('aria-pressed', String(quick));
  selectButton.setAttribute('aria-pressed', String(!quick));
  quickPanel.hidden = !quick;
  selectPanel.hidden = quick;
  refreshTotal();
}
quickButton.addEventListener('click', () => switchMode('quick'));
selectButton.addEventListener('click', () => switchMode('select'));

/* ── QUICK counters ── */
const counterHost = document.getElementById('counters');
for (const color of COLORS) {
  const meta = COLOR_META[color];
  const row = el('div', { class: 'hb-counter' });
  row.append(el('span', { class: `chip chip-${color.toLowerCase()}`, style: 'width:44px;height:44px', html: colorIcon(color, 24) }));
  row.append(el('div', { class: 'cinfo' },
    el('div', { class: 'cname' }, `${meta.nameEn.toUpperCase()} · ${meta.nameTh}`),
    el('div', { class: 'csub' }, `${meta.nameEn} · ${meta.nameTh} — ${meta.beatsTh}`)));
  const minus = el('button', { class: 'hb-btn', 'aria-label': `ลดจำนวนสี${meta.nameTh}` }, '➖');
  const num = el('span', { class: 'num', 'aria-live': 'polite' }, String(counts[color]));
  const plus = el('button', { class: 'hb-btn', 'aria-label': `เพิ่มจำนวนสี${meta.nameTh}` }, '➕');
  minus.addEventListener('click', () => {
    if (counts[color] <= 0) return;
    counts[color] -= 1;
    num.textContent = counts[color];
    refreshTotal();
  });
  plus.addEventListener('click', () => {
    if (Object.values(counts).reduce((sum, n) => sum + n, 0) >= 7) {
      toast('ครบ 7 ใบแล้ว — ลดสีอื่นก่อน');
      return;
    }
    counts[color] += 1;
    num.textContent = counts[color];
    refreshTotal();
  });
  row.append(minus, num, plus);
  counterHost.append(row);
}

/* ── SELECT picker: FIRST HAND only ── */
const grid = document.getElementById('grid');
const filters = document.getElementById('filters');
/* ป้ายบนปุ่มมาจาก COLOR_META ส่วนค่าที่ใช้กรองคือคีย์สี — แยกกันไว้เหมือนเดิม
   ถึงตอนนี้จะสะกดเหมือนกันแล้วก็ตาม เพราะถ้ามัดสองอย่างเข้าด้วยกันอีก
   วันหลังเปลี่ยนชื่อสีทีไรตัวกรองจะพังทุกที */
const FILTERS = [
  { value: 'All', label: 'All' },
  ...COLORS.map(key => ({ value: key, label: COLOR_META[key].nameEn })),
  { value: 'Favorites', label: 'Favorites' },
];
let filter = 'All';
for (const item of FILTERS) {
  const button = el('button', { 'aria-pressed': String(item.value === filter) }, item.label);
  button.addEventListener('click', () => {
    filter = item.value;
    [...filters.children].forEach((node, index) => node.setAttribute('aria-pressed', String(FILTERS[index].value === filter)));
    renderGrid();
  });
  filters.append(button);
}

function availableCards() {
  const favorites = store.getFavorites();
  return FIRST_HAND.filter(card => owned.has(card.id)).filter(card => {
    if (filter === 'Favorites') return favorites.includes(card.id);
    if (COLORS.includes(filter)) return card.color === filter;
    return true;
  });
}

function renderGrid() {
  grid.innerHTML = '';
  const cards = availableCards();
  if (!cards.length) {
    grid.append(el('p', { style: 'color:rgb(var(--muted));grid-column:1/-1' }, 'ยังไม่มี FIRST HAND ที่ปลดล็อกในหมวดนี้'));
    return;
  }
  for (const card of cards) {
    const isPicked = picked.includes(card.id);
    const cell = el('button', {
      class: 'pick-cell' + (isPicked ? ' picked' : ''),
      'aria-pressed': String(isPicked),
      'aria-label': `${card.en} ${card.th} สี${COLOR_META[card.color].nameTh}`,
    });
    cell.innerHTML = cardSVG(card.id, { width: 150 });
    if (isPicked) cell.prepend(el('span', { class: 'cnt' }, '✓'));
    cell.addEventListener('click', () => {
      if (picked.includes(card.id)) picked = picked.filter(id => id !== card.id);
      else if (picked.length >= 7) {
        toast('ครบ 7 ใบแล้ว — เอาใบอื่นออกก่อน');
        return;
      } else picked.push(card.id);
      renderGrid();
      refreshTotal();
    });
    grid.append(cell);
  }
}
renderGrid();

/* Presets belong to SELECT and must contain 7 currently owned FIRST HAND IDs. */
const presetHost = document.getElementById('presets');
function renderPresets() {
  presetHost.innerHTML = '';
  const validPresets = store.getPresets().filter(preset => (
    preset.cards?.length === 7
    && new Set(preset.cards).size === 7
    && preset.cards.every(id => owned.has(id))
  ));
  for (const preset of validPresets) {
    const use = el('button', { class: 'btn', style: 'padding:8px 14px;min-height:40px;font-size:13px' }, `▶ ${preset.name}`);
    use.addEventListener('click', () => {
      picked = [...preset.cards];
      renderGrid();
      refreshTotal();
      toast(`ใช้มือ "${preset.name}"`);
    });
    const remove = el('button', { class: 'btn', style: 'padding:8px 10px;min-height:40px;font-size:13px', 'aria-label': `ลบ preset ${preset.name}` }, '✕');
    remove.addEventListener('click', () => {
      store.deletePreset(preset.id);
      renderPresets();
    });
    presetHost.append(use, remove);
  }
  const save = el('button', { class: 'btn btn-dark', style: 'padding:8px 14px;min-height:40px;font-size:13px' }, '💾 บันทึกมือนี้');
  save.addEventListener('click', () => {
    if (picked.length !== 7) {
      toast('เลือกให้ครบ 7 ใบก่อน');
      return;
    }
    const name = prompt('ตั้งชื่อมือชุดนี้:', 'มือของฉัน');
    if (name) {
      store.savePreset(name, picked);
      renderPresets();
    }
  });
  presetHost.append(save);
}
renderPresets();

switchMode(mode);

/* ── Ready → ไปต่อ ── */
readyBtn.addEventListener('click', () => {
  const cards = currentCards();
  if (cards.length !== 7) return;
  store.setHand(cards);
  store.track(`core7_hand_complete_${mode}`);
  if (next === 'bot') {
    const level = qs.get('level') || 'easy';
    location.href = `/core7/bot/?level=${level}&fresh=1`;
  } else if (next === 'room') {
    const code = qs.get('code') || '';
    const role = qs.get('role') || 'guest';
    location.href = `/core7/room/?c=${encodeURIComponent(code)}&role=${role}&hand=1`;
  } else {
    location.href = '/core7/play/';
  }
});
</script>
</body>
</html>
