<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สร้างห้องออนไลน์ — myClover: CORE7</title>
<meta name="theme-color" content="#0A2818">
<link rel="icon" type="image/svg+xml" href="/core7/favicon.svg">
<link rel="stylesheet" href="/core7/css/core7.css">
<style>
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{cursor:pointer;border:1px solid rgb(var(--line)/.14);border-radius:14px;padding:16px;background:#fff}.choice:has(input:checked){border-color:rgb(var(--green));box-shadow:0 0 0 2px rgb(var(--green)/.18)}.choice input{margin-right:7px}.choice b{font-family:"Bai Jamjuree";font-size:18px}.choice small{display:block;margin:4px 0 0 23px;color:rgb(var(--muted));line-height:1.45}.status{font-size:13.5px;color:rgb(var(--muted));min-height:22px;margin:12px 0}@media(max-width:560px){.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="c7nav" id="c7nav"></nav>
<main class="sec"><div class="wrap-slim">
  <p class="eyebrow"><span data-c7-version>v0.5</span> · Online Multiplayer</p>
  <h2 class="disp">สร้างห้องให้เพื่อน</h2>
  <div class="panel" style="margin-top:20px">
    <div class="field"><label for="hname" data-en="Your name at the table">ชื่อของคุณบนโต๊ะ</label><input id="hname" maxlength="24"></div>
    <div class="field"><label data-en="Game mode — how many Matches to win">Game Mode — ต้องชนะกี่ Match</label><div class="choices">
      <label class="choice"><input type="radio" name="mode" value="quick" checked><b>MATCH</b><small data-en="Win 1 Match and it is over">ชนะ 1 Match จบเกม</small></label>
      <label class="choice"><input type="radio" name="mode" value="bo3"><b>DOUBLE</b><small data-en="First to win 2 Matches">คนแรกที่ชนะ 2 Matches</small></label>
      <label class="choice"><input type="radio" name="mode" value="bo5"><b>SET</b><small data-en="First to win 3 Matches">คนแรกที่ชนะ 3 Matches</small></label>
    </div>
    <p style="font-size:13px;color:rgb(var(--muted));margin-top:8px" data-en="Every mode keeps the same seven cards until someone wins — no swapping mid-set.">ทุกโหมดใช้มือเจ็ดใบเดิมจนกว่าจะมีผู้ชนะ — เปลี่ยนมือกลางทางไม่ได้</p></div>
    <div class="field"><label for="visibility" data-en="Room visibility">การมองเห็นห้อง</label><select id="visibility">
      <option value="public" data-en="Public — listed in the Lobby">Public — แสดงใน Lobby</option><option value="unlisted" data-en="Unlisted — code only">Unlisted — เข้าได้ด้วยรหัสเท่านั้น</option>
    </select></div>
    <div class="panel" style="background:rgb(var(--gold)/.08);border-color:rgb(var(--gold)/.3);margin-bottom:12px">
      <b data-en="Room codes are 4 digits">รหัสห้องเป็นตัวเลข 4 หลัก</b><p style="font-size:13.5px;margin-top:4px" data-en="The server reserves a free code, idle rooms expire on their own, and you can play across devices.">Server จะจองรหัสที่ว่างให้ ห้องรอหมดอายุอัตโนมัติ และใช้เล่นข้ามอุปกรณ์ได้</p>
    </div>
    <p class="status" id="status" role="status"></p>
    <button class="btn btn-gold btn-lg btn-block" id="go" data-en="Make the room →">สร้างห้องออนไลน์ →</button>
  </div>
</div></main>
<footer class="c7foot" id="c7foot"></footer>
<script type="module">
import { renderShell } from '/core7/js/ui.js';
import { RemoteRooms } from '/core7/js/adapters.js';
import { getGuest, setGuestName, track } from '/core7/js/store.js';
import { playSfx } from '/core7/js/audio.js';
renderShell({});
const rooms = new RemoteRooms();
const nameEl = document.getElementById('hname');
const go = document.getElementById('go');
const status = document.getElementById('status');
nameEl.value = getGuest().name;
go.addEventListener('click', async () => {
  go.disabled = true; status.textContent = 'กำลังจองห้อง…';
  setGuestName(nameEl.value);
  try {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const visibility = document.getElementById('visibility').value;
    const data = await rooms.create({ displayName: getGuest().name, visibility, mode });
    track('core7_room_create'); playSfx('join');
    location.href = `/core7/room/?c=${encodeURIComponent(data.code)}`;
  } catch (error) {
    playSfx('error');
    status.textContent = error.code === 'CORE7_DB_NOT_CONFIGURED'
      ? 'Backend ยังไม่ได้ผูกฐานข้อมูล production — ดู CORE7_DEPLOY.md'
      : `สร้างห้องไม่สำเร็จ (${error.code || 'NETWORK_ERROR'})`;
    go.disabled = false;
  }
});
</script>
</body></html>
