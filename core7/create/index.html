<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สร้างห้อง — myClover: CORE7</title>
<meta name="theme-color" content="#0A2818">
<link rel="stylesheet" href="/core7/css/core7.css">
</head>
<body>
<nav class="c7nav" id="c7nav"></nav>
<main class="sec">
  <div class="wrap-slim">
    <p class="eyebrow">Create a Room</p>
    <h2 class="disp">สร้างห้องให้เพื่อน</h2>

    <div class="panel" style="margin-top:20px">
      <div class="field">
        <label for="hname">ชื่อของคุณบนโต๊ะ</label>
        <input id="hname" maxlength="24">
      </div>
      <div class="field">
        <label>Room Code ของคุณ</label>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <b class="disp" id="code" style="font-size:30px;letter-spacing:2px;color:rgb(var(--green))"></b>
          <button class="btn" id="reroll" style="padding:9px 14px;min-height:44px">🎲 สุ่มใหม่</button>
        </div>
      </div>
      <div class="panel" style="background:rgb(var(--gold)/.08);border-color:rgb(var(--gold)/.3);margin-bottom:16px">
        <b>ห้องเวอร์ชันนี้เป็นแบบ Local</b>
        <p style="font-size:13.5px;margin-top:4px">ทำงานบนอุปกรณ์เดียวกัน — เปิดลิงก์ห้องในอีกแท็บ/หน้าต่าง
        หรือส่งเครื่องให้เพื่อนนั่งข้าง ๆ เล่นแบบผลัดกัน ระบบออนไลน์ข้ามอุปกรณ์จะเปิดเมื่อ
        Server จริงพร้อม (<a href="/core7/rank/" style="text-decoration:underline">ดูสถานะ</a>)</p>
      </div>
      <button class="btn btn-gold btn-lg btn-block" id="go">เปิดห้อง →</button>
    </div>
  </div>
</main>
<footer class="c7foot" id="c7foot"></footer>
<script type="module">
import { renderShell, newRoomCode } from '/core7/js/ui.js';
import { getGuest, setGuestName, track } from '/core7/js/store.js';
renderShell({});
const codeEl = document.getElementById('code');
const nameEl = document.getElementById('hname');
nameEl.value = getGuest().name;
let code = newRoomCode();
codeEl.textContent = code;
document.getElementById('reroll').addEventListener('click', () => {
  code = newRoomCode(); codeEl.textContent = code;
});
document.getElementById('go').addEventListener('click', () => {
  setGuestName(nameEl.value);
  track('core7_room_create');
  location.href = `/core7/room/?c=${encodeURIComponent(code)}&role=host`;
});
</script>
</body>
</html>
