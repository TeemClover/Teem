<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIRST HAND — Main Quest · myClover CORE7</title>
<meta name="description" content="รับ FIRST HAND ใบแรกหลังจบ CORE7 Match แล้วเดินต่อไปดูเส้นทาง AI ใส่ซอสทั้ง 6 บท">
<meta name="theme-color" content="#071d12">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/core7/css/core7.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(720px 430px at 12% -10%,rgb(27 106 66/.45),transparent 65%),radial-gradient(560px 400px at 100% 100%,rgb(190 148 66/.18),transparent 65%),#061b10;color:#fff;display:grid;place-items:center;padding:18px}.panel{width:min(820px,100%);display:grid;grid-template-columns:minmax(210px,300px) minmax(0,1fr);gap:clamp(25px,5vw,52px);align-items:center;border:1px solid rgb(234 208 140/.5);border-radius:30px;padding:clamp(24px,5vw,44px);background:rgb(255 255 255/.055);box-shadow:0 50px 130px rgb(0 0 0/.65);backdrop-filter:blur(12px)}.visual{perspective:1400px}.card{position:relative;width:100%;aspect-ratio:63/88;border:0;padding:0;background:transparent;cursor:pointer;filter:drop-shadow(0 30px 30px rgb(0 0 0/.45));transform:rotate(-1.5deg)}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .78s cubic-bezier(.2,.72,.16,1)}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden}.front{transform:rotateY(180deg)}.face svg{width:100%;height:100%;display:block}.tap{text-align:center;color:#ead08c;font:800 10px/1.4 "Bai Jamjuree";letter-spacing:.14em;margin-top:15px}.eyebrow{display:block;color:#ead08c;font:800 11px/1.3 "Bai Jamjuree";letter-spacing:.16em}.copy h1{font:800 clamp(31px,6vw,52px)/1.08 "Bai Jamjuree";letter-spacing:-.035em;margin:12px 0 11px}.lead{font-size:16px;line-height:1.8;color:rgb(255 255 255/.75)}.name{font:800 clamp(19px,3vw,25px)/1.4 "Bai Jamjuree";color:#ead08c;margin-top:20px}.meter{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding:13px 15px;border:1px solid rgb(255 255 255/.13);border-radius:14px;background:rgb(255 255 255/.055)}.meter span{font:700 10px/1.3 "Bai Jamjuree";letter-spacing:.13em;color:rgb(255 255 255/.58)}.meter b{font:800 21px/1 "Bai Jamjuree";color:#ead08c}.reveal[hidden]{display:none}.handoff{margin-top:20px;padding:18px;border:1px solid rgb(234 208 140/.25);border-radius:16px;background:rgb(234 208 140/.08)}.handoff b{font-family:"Bai Jamjuree";font-size:17px}.handoff p{font-size:13.5px;color:rgb(255 255 255/.65);line-height:1.7;margin:6px 0 0}.actions{display:grid;gap:10px;margin-top:18px}.actions .btn{width:100%}.fine{text-align:center;color:rgb(255 255 255/.47);font-size:12px;margin-top:12px}.empty{text-align:center;grid-column:1/-1}.empty h1{font:800 36px/1.2 "Bai Jamjuree"}@media(max-width:680px){body{align-items:end;padding:9px}.panel{grid-template-columns:116px minmax(0,1fr);gap:18px;border-radius:25px 25px 18px 18px;padding:21px 18px}.copy h1{font-size:28px}.lead{font-size:13.5px}.visual{align-self:start}.tap{font-size:8px}.name,.meter,.handoff,.actions,.fine{grid-column:1/-1}.name{margin-top:2px}.handoff{margin-top:3px}}@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<main class="panel" id="panel"></main>
<script type="module">
import { unlockRandomCard,getCollectionCards,getCollectionCount,TOTAL_COLLECTION_CARDS } from '/core7/js/collection-progress.js';
import { cardSVG,cardBackSVG } from '/core7/js/art.js';
import { COLOR_META } from '/core7/js/cards.js';
import { getLang,t } from '/core7/js/i18n.js';
const qs=new URLSearchParams(location.search),matchId=qs.get('m')||'';
const reward=unlockRandomCard(matchId);const owned=getCollectionCards();const card=reward.card||owned[owned.length-1]||null;const count=getCollectionCount();const panel=document.getElementById('panel');
try{localStorage.setItem('mc_core7_main_match_complete','1');localStorage.setItem('mc_force_lesson1_until_explicit','1')}catch{}
if(!card){panel.innerHTML=`<section class="empty"><span class="eyebrow">MAIN QUEST</span><h1>${t('Match จบแล้ว','Match complete')}</h1><p class="lead">${t('เข็มทิศพร้อมพาคุณไปดูเส้นทาง AI ใส่ซอสทั้ง 6 บท','The compass is ready to show you the full 6-lesson AI Sauce path.')}</p><a class="btn btn-gold" href="/classroom/?entry=core7">${t('เริ่ม AI ใส่ซอส →','Start AI Sauce →')}</a></section>`}else{
 const meta=COLOR_META[card.color];panel.innerHTML=`<div class="visual"><button class="card" id="flip" type="button" aria-label="${t('พลิกเพื่อเปิดการ์ด','Flip to reveal your card')}" aria-pressed="false"><span class="inner"><span class="face back">${cardBackSVG({width:300})}</span><span class="face front">${cardSVG(card.id,{width:300})}</span></span></button><div class="tap" id="tap">${t('แตะการ์ดเพื่อเปิด','TAP TO REVEAL')}</div></div><section class="copy"><span class="eyebrow">MATCH COMPLETE · FIRST HAND</span><h1>${count===1?t('คุณได้รับการ์ดใบแรก','You received your first card'):t('คุณได้รับการ์ดใบใหม่','You received a new card')}</h1><p class="lead">${t('คุณเพิ่งเล่นหลักฐานชิ้นแรกของคอร์สจบแล้ว เปิดการ์ด จากนั้นเข็มทิศจะพาไปดูว่า Source และวิธีคิดแบบไหนทำให้ผลงานนี้เกิดขึ้น','You just finished the course’s first playable proof. Reveal the card, then continue to see the Source and thinking that made this possible.')}</p><div class="reveal" id="reveal" hidden><div class="name">${meta.emoji} ${card.en}</div><div class="meter"><span>FIRST HAND</span><b>${count}/${TOTAL_COLLECTION_CARDS}</b></div><div class="handoff"><b>${t('เกมพิสูจน์ว่า “สร้างได้” · บทเรียนจะเฉลยว่า “สร้างอย่างไร”','The game proves it can be built. The lessons reveal how.')}</b><p>${t('เริ่มจาก Source ขวดแรก แล้วค่อยชิม แก้ แตกงาน และเสิร์ฟเป็นผลงานที่คนอื่นใช้ได้จริง','Start with your first Source, then test, revise, multiply and serve work other people can actually use.')}</p></div><div class="actions"><a class="btn btn-gold" id="lesson" href="/classroom/?entry=core7">${t('🧴 เริ่ม AI ใส่ซอส →','🧴 Start AI Sauce →')}</a><a class="btn btn-ghost" href="/core7/result/?m=${encodeURIComponent(matchId)}&mode=bot&level=easy">${t('ดูรายละเอียด Match','View Match details')}</a></div><div class="fine">${t('เข็มทิศจะจำว่าคุณเล่นจบแล้ว ไม่ต้องกลับมาทำ Tutorial อีก','The compass remembers this Match. You will not need this tutorial again.')}</div></div></section>`;
 const flip=document.getElementById('flip'),reveal=document.getElementById('reveal'),tap=document.getElementById('tap');const open=()=>{if(flip.classList.contains('flipped'))return;flip.classList.add('flipped');flip.setAttribute('aria-pressed','true');tap.textContent=t('เปิดแล้ว ✓','REVEALED ✓');setTimeout(()=>{reveal.hidden=false;document.getElementById('lesson')?.focus()},350)};flip.onclick=open;flip.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};document.getElementById('lesson')?.addEventListener('click',()=>{try{localStorage.removeItem('mc_core7_main_run')}catch{}})
}
</script>
</body>
</html>
