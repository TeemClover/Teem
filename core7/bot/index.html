<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เล่นกับบอท — myClover: CORE7</title>
<meta name="theme-color" content="#0A2818">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/core7/css/core7.css">
</head>
<body>
<div id="match"></div>
<script type="module">
import { LocalBotClient } from '/core7/js/adapters.js';
import { Core7Bot } from '/core7/js/bot.js';
import { reportBotMatchComplete, reportBotMatchStart } from '/core7/js/analytics.js';
import { mountMatch } from '/core7/js/match-ui.js';
import * as store from '/core7/js/store.js';

const qs = new URLSearchParams(location.search);
const level = ['easy', 'hard'].includes(qs.get('level')) ? qs.get('level') : 'easy';
const fresh = qs.get('fresh') === '1';
const entry = qs.get('entry') || 'core7';
const mainQuest = entry === 'main';

let hand = store.getHand();
if (!hand || hand.length !== 7) {
  location.replace(mainQuest
    ? '/core7/quick/'
    : `/core7/hand/?next=bot&level=${level}&entry=${encodeURIComponent(entry)}`);
  throw new Error('no hand');
}

/* Main Quest / Quick Tutorial must teach with equal information. */
if (mainQuest) {
  const tutorialHand = hand.slice();
  Core7Bot.buildHand = () => tutorialHand.slice();
}

/* ── Bot presentation pacing ──────────────────────────────────────────────
   Timing belongs to what the human can SEE, not to the Engine clock.

   • Bot leads only 2.0–3.0s AFTER the previous result is visibly painted.
   • If the human commits first, the bot follows in 0.3–0.8s.
   • Between Engine resolve and Physical Table reveal the bot is BLOCKED.
*/
const randomMs = (min, max) => min + Math.random() * (max - min);
const BOT_LEAD_MIN = 2000;
const BOT_LEAD_MAX = 3000;
const BOT_FOLLOW_MIN = 300;
const BOT_FOLLOW_MAX = 800;
const botPace = { round:null, mode:'blocked', deadline:Infinity, timer:null };
const nativeBotTurn = LocalBotClient.prototype._botTurn;

function clearBotTimer() {
  clearTimeout(botPace.timer);
  botPace.timer = null;
}
function blockLead(round) {
  botPace.round = round;
  botPace.mode = 'blocked';
  botPace.deadline = Infinity;
  clearBotTimer();
}
function setLeadDeadline(round, now = performance.now()) {
  botPace.round = round;
  botPace.mode = 'lead';
  botPace.deadline = now + randomMs(BOT_LEAD_MIN, BOT_LEAD_MAX);
  clearBotTimer();
}
function setFollowDeadline(round, now = performance.now()) {
  botPace.round = round;
  botPace.mode = 'follow';
  botPace.deadline = now + randomMs(BOT_FOLLOW_MIN, BOT_FOLLOW_MAX);
  clearBotTimer();
}

LocalBotClient.prototype._botTurn = function pacedBotTurn() {
  const state = this.authority?.state;
  if (!state) return nativeBotTurn.call(this);

  /* Discard is a visible consequence of the previous reveal, not a hidden new
     choice. Let the adapter handle it normally. Only gate next-card commits. */
  if (state.phase === 'ROUND_SELECT' && !state.current?.b?.locked) {
    const round = state.roundNumber;
    const now = performance.now();

    if (botPace.round !== round) blockLead(round);
    if (state.current?.a?.locked && botPace.mode !== 'follow') setFollowDeadline(round, now);
    if (botPace.mode === 'blocked') return;

    const wait = botPace.deadline - performance.now();
    if (wait > 16) {
      clearBotTimer();
      botPace.timer = setTimeout(() => {
        botPace.timer = null;
        this._botTurn();
      }, wait);
      return;
    }
  }

  return nativeBotTurn.call(this);
};

const CUR = 'c7:cur_bot';
let matchId = null;
let createdNewMatch = false;
if (!fresh) {
  try { matchId = localStorage.getItem(CUR); } catch { /* ok */ }
  const snap = matchId && store.loadMatchSnapshot(matchId);
  if (!snap || snap.state?.phase === 'MATCH_RESULT') matchId = null;
}
if (!matchId) {
  createdNewMatch = true;
  matchId = 'bm-' + Date.now().toString(36);
  try { localStorage.setItem(CUR, matchId); } catch { /* ok */ }
  history.replaceState(null, '', `/core7/bot/?level=${level}${mainQuest ? '&entry=main' : ''}`);
  store.track(mainQuest ? 'core7_main_match_start' : 'core7_bot_match_start');
}

const client = new LocalBotClient({ matchId, humanCards:hand, level, resume:!fresh });

/* Engine may resolve the next round before the reveal animation is finished.
   Block the next hidden choice until Physical Table announces visible result. */
{
  const state = client.authority?.state;
  blockLead(state?.roundNumber ?? 1);
  client.subscribe(ev => {
    if (ev?.event_type === 'round.resolved') {
      blockLead(Number(ev.round_number || 0) + 1);
      return;
    }
    if (ev?.event_type === 'round.selection_locked' && ev.payload?.seat === 'a') {
      const round = client.authority?.state?.roundNumber ?? botPace.round ?? 1;
      if (botPace.mode !== 'follow') setFollowDeadline(round);
      client._botTurn();
    }
  });
}

if (createdNewMatch) {
  const state = store.loadMatchSnapshot(matchId)?.state;
  reportBotMatchStart({ matchId, level, startedAt:state?.startedAt || Date.now(), rulesVersion:state?.rulesVersion });
}

/* Result-visible time zero. Start the 2–3s hold even if a discard phase is
   still active. If discard takes longer than the hold, the bot may act once
   the next ROUND_SELECT actually exists; otherwise it waits the remainder. */
window.addEventListener('core7:physical-result-ready', event => {
  const state = client.authority?.state;
  if (!state || state.phase === 'MATCH_RESULT') return;
  const nextRound = Number(event.detail?.nextRound || state.roundNumber || botPace.round || 1);
  setLeadDeadline(nextRound);
  client._botTurn();
});

const matchApi = mountMatch(document.getElementById('match'), client, {
  oppLabel: `· ${level.toUpperCase()}`,
  onFinished(view) {
    clearBotTimer();
    const state = store.loadMatchSnapshot(matchId)?.state;
    reportBotMatchComplete({ state, humanId:client.playerId, level });
    store.recordMatch('bot', view, view.opponent.name);
    store.track(mainQuest ? 'core7_main_match_complete' : 'core7_bot_match_complete');
    try { localStorage.removeItem(CUR); } catch { /* ok */ }
    const destination = mainQuest
      ? `/core7/journey-result/?m=${matchId}&mode=bot&level=${level}`
      : `/core7/result/?m=${matchId}&mode=bot&level=${level}`;
    location.replace(destination);
  },
});

/* First round has no previous result. Start only after the table paints. */
requestAnimationFrame(() => requestAnimationFrame(() => {
  const state = client.authority?.state;
  if (!state || state.phase !== 'ROUND_SELECT' || state.current?.b?.locked) return;
  if (state.current?.a?.locked) setFollowDeadline(state.roundNumber);
  else setLeadDeadline(state.roundNumber);
  client._botTurn();
}));
void matchApi;
</script>
</body>
</html>
