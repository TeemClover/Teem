<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เล่นกับบอท — myClover: CORE7</title>
<meta name="theme-color" content="#0A2818">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/core7/css/core7.css">
</head>
<body>
<div id="match"></div>
<script type="module">
import { LocalBotClient } from '/core7/js/adapters.js';
import { Core7Bot } from '/core7/js/bot.js';
import { reportBotMatchComplete, reportBotMatchStart } from '/core7/js/analytics.js';
import { mountMatch } from '/core7/js/match-ui.js';
import * as store from '/core7/js/store.js';

const qs = new URLSearchParams(location.search);
const level = ['easy', 'hard'].includes(qs.get('level')) ? qs.get('level') : 'easy';
const fresh = qs.get('fresh') === '1';
const entry = qs.get('entry') || 'core7';
const mainQuest = entry === 'main';

let hand = store.getHand();
if (!hand || hand.length !== 7) {
  location.replace(mainQuest
    ? '/core7/quick/'
    : `/core7/hand/?next=bot&level=${level}&entry=${encodeURIComponent(entry)}`);
  throw new Error('no hand');
}

/* Main Quest / Quick Tutorial must teach with equal information.
   Mirror the player's exact 7-card hand for the bot so the tutorial Match
   is always symmetric (normally 2 RED / 2 GREEN / 2 BLUE / 1 SILVER).
   Normal bot play keeps Core7Bot.buildHand() random as before. */
if (mainQuest) {
  const tutorialHand = hand.slice();
  Core7Bot.buildHand = () => tutorialHand.slice();
}

/* ── Bot presentation pacing ──────────────────────────────────────────────
   The game engine may resolve a bot choice immediately, but a physical table
   needs a readable human rhythm.

   • If nobody has committed yet, the bot visibly "thinks" for 2 seconds.
   • If the human commits first, the bot answers almost immediately.
   • Discard timing is left to the normal adapter because that is a consequence
     of the previous reveal, not a new hidden choice.

   The guard lives on the bot page only; Engine / rules / Online rooms are not
   changed. Existing adapter timers may still call _botTurn, but this wrapper
   makes every early call wait until the presentation deadline. */
const BOT_THINK_MS = 2000;
const BOT_REPLY_MS = 90;
const botPace = {
  round: null,
  readyAt: 0,
  timer: null,
};
const nativeBotTurn = LocalBotClient.prototype._botTurn;

LocalBotClient.prototype._botTurn = function pacedBotTurn() {
  const state = this.authority?.state;
  if (!state) return nativeBotTurn.call(this);

  if (state.phase === 'ROUND_SELECT' && !state.current?.b?.locked) {
    const round = state.roundNumber;
    if (botPace.round !== round) {
      botPace.round = round;
      botPace.readyAt = performance.now() + BOT_THINK_MS;
    }

    /* The human card on the table is the cue. Once they commit, answer now
       instead of waiting out the remaining think timer. */
    if (state.current?.a?.locked) botPace.readyAt = 0;

    const wait = botPace.readyAt - performance.now();
    if (wait > 16) {
      clearTimeout(botPace.timer);
      botPace.timer = setTimeout(() => {
        botPace.timer = null;
        nativeBotTurn.call(this);
      }, wait);
      return;
    }
  }

  return nativeBotTurn.call(this);
};

const CUR = 'c7:cur_bot';
let matchId = null;
let createdNewMatch = false;
if (!fresh) {
  try { matchId = localStorage.getItem(CUR); } catch { /* ok */ }
  const snap = matchId && store.loadMatchSnapshot(matchId);
  if (!snap || snap.state?.phase === 'MATCH_RESULT') matchId = null;
}
if (!matchId) {
  createdNewMatch = true;
  matchId = 'bm-' + Date.now().toString(36);
  try { localStorage.setItem(CUR, matchId); } catch { /* ok */ }
  history.replaceState(null, '', `/core7/bot/?level=${level}${mainQuest ? '&entry=main' : ''}`);
  store.track(mainQuest ? 'core7_main_match_start' : 'core7_bot_match_start');
}

const client = new LocalBotClient({
  matchId,
  humanCards: hand,
  level,
  resume: !fresh,
});

/* Start the 2-second clock from the moment this round is actually ready, not
   from whichever legacy timeout happens to call the bot first. If the player
   locks before that deadline, cancel it and make the bot respond right away. */
{
  const state = client.authority?.state;
  botPace.round = state?.roundNumber ?? null;
  botPace.readyAt = performance.now() + BOT_THINK_MS;

  client.subscribe(ev => {
    if (ev?.event_type === 'round.resolved') {
      clearTimeout(botPace.timer);
      botPace.timer = null;
      botPace.round = Number(ev.round_number || 0) + 1;
      botPace.readyAt = performance.now() + BOT_THINK_MS;
      return;
    }

    if (ev?.event_type === 'round.selection_locked' && ev.payload?.seat === 'a') {
      botPace.readyAt = 0;
      clearTimeout(botPace.timer);
      botPace.timer = setTimeout(() => {
        botPace.timer = null;
        nativeBotTurn.call(client);
      }, BOT_REPLY_MS);
    }
  });
}

if (createdNewMatch) {
  const state = store.loadMatchSnapshot(matchId)?.state;
  reportBotMatchStart({
    matchId,
    level,
    startedAt: state?.startedAt || Date.now(),
    rulesVersion: state?.rulesVersion,
  });
}

mountMatch(document.getElementById('match'), client, {
  oppLabel: `· ${level.toUpperCase()}`,
  onFinished(view) {
    const state = store.loadMatchSnapshot(matchId)?.state;
    reportBotMatchComplete({ state, humanId: client.playerId, level });
    store.recordMatch('bot', view, view.opponent.name);
    store.track(mainQuest ? 'core7_main_match_complete' : 'core7_bot_match_complete');
    try { localStorage.removeItem(CUR); } catch { /* ok */ }
    location.href = mainQuest
      ? `/core7/journey-result/?m=${matchId}&mode=bot&level=${level}`
      : `/core7/result/?m=${matchId}&mode=bot&level=${level}`;
  },
});
</script>
</body>
</html>
