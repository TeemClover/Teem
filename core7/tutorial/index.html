<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick Tutorial — myClover: CORE7</title>
<meta name="description" content="เรียน CORE7 แบบเล่นจริงในเวลาประมาณ 1 นาที แล้วใช้มือเริ่มต้นลงเล่นกับ EASY BOT ทันที">
<meta name="theme-color" content="#0A2818">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/core7/css/core7.css">
<style>
body{background:radial-gradient(900px 520px at 50% -10%,rgb(27 106 66/.5),transparent 65%),rgb(var(--deep));color:#fff;min-height:100dvh;display:flex;flex-direction:column}
.tut-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgb(255 255 255/.09)}
.tut-logo{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-family:"Bai Jamjuree";font-weight:700;font-size:15px;color:#fff!important;white-space:nowrap}.tut-logo img{height:26px;width:auto}.tut-logo em{font-style:normal;color:rgb(var(--gold-l))}.tut-title{text-align:center;font-family:"Bai Jamjuree";font-weight:700;font-size:14px}.tut-tools{display:flex;gap:9px;align-items:center}.tut-tools a{font-size:13px;color:rgb(255 255 255/.72);min-height:42px;display:inline-flex;align-items:center}.tut-tools button{min-height:38px;padding:6px 10px}
.tut-entry{font-size:11px;color:rgb(var(--gold-l));letter-spacing:.08em;text-align:center;padding:7px 12px 0}
.tut-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:12px 18px;text-align:center}
.tut-cards{display:flex;gap:20px;align-items:center}.tut-rule-visual{width:min(88vw,430px);max-height:52dvh;object-fit:contain;box-shadow:0 18px 44px rgb(0 0 0/.34)}.tut-cards[hidden],.tut-rule-visual[hidden]{display:none!important}
.tut-slot{width:min(30vw,140px);aspect-ratio:300/420;perspective:900px}.tut-slot .flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}.tut-slot.revealed .flip{transform:rotateY(180deg)}.tut-slot .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden}.tut-slot .front{transform:rotateY(180deg)}
.tut-msg{font-size:clamp(17px,4vw,21px);font-weight:700;font-family:"Bai Jamjuree";min-height:54px;max-width:35ch}.tut-sub{font-size:14px;color:rgb(255 255 255/.78);max-width:48ch;min-height:42px}.tut-choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:0 14px 22px}.cbtn{width:76px;height:100px;border-radius:12px;border:2px solid rgb(255 255 255/.35);color:#fff;font-family:"Bai Jamjuree";font-weight:700;font-size:12px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;transition:transform .15s}.cbtn:hover{transform:translateY(-4px)}.cbtn.hint{animation:hintPulse 1.2s infinite;border-color:rgb(var(--gold-l))}@keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 rgb(227 197 126/.7)}50%{box-shadow:0 0 0 10px rgb(227 197 126/0)}}.cbtn.red{background:linear-gradient(160deg,rgb(var(--c-red)),rgb(var(--c-red-deep)))}.cbtn.green{background:linear-gradient(160deg,rgb(var(--c-green)),rgb(var(--c-green-deep)))}.cbtn.blue{background:linear-gradient(160deg,rgb(var(--c-blue)),rgb(var(--c-blue-deep)))}.cbtn.silver{background:linear-gradient(160deg,rgb(var(--c-silver)),rgb(var(--c-silver-deep)))}.cbtn:disabled{opacity:.35}
.tut-next{padding:0 18px 28px;display:flex;justify-content:center}.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:rgb(255 255 255/.25)}.dots i.on{background:rgb(var(--gold-l))}
@media(max-width:620px){.tut-top{grid-template-columns:auto auto}.tut-title{display:none}.tut-tools{justify-self:end}.tut-tools a{font-size:12px}.tut-entry{padding-top:4px}.tut-logo span{display:none}}
@media(prefers-reduced-motion:reduce){.cbtn.hint{animation:none}.tut-slot .flip{transition:none}}
</style>
</head>
<body>
<div class="tut-top">
  <a class="tut-logo" href="/core7/" aria-label="กลับหน้าแรก CORE7"><img src="/icons/icon-192.png" alt="" width="192" height="192"><span>my<em>Clover</em>&thinsp;· CORE7</span></a>
  <b class="tut-title">🎓 QUICK TUTORIAL</b>
  <div class="tut-tools"><button class="btn btn-ghost" id="lang">EN</button><a id="skip" href="#">ข้าม → EASY BOT</a></div>
</div>
<div class="tut-entry" id="entryNote"></div>
<div class="tut-stage">
  <img class="tut-rule-visual" id="ruleVisual" src="/core7/assets/core7-rule.webp" hidden alt="ภาพสรุปกติกา CORE7">
  <div class="tut-cards" id="tutorialCards">
    <div><small id="youLabel" style="display:block;margin-bottom:6px">คุณ · ซ้ายเสมอ</small><div class="tut-slot" id="slotYou"><div class="flip"><div class="face back"></div><div class="face front"></div></div></div></div>
    <b class="disp" style="color:rgb(var(--gold-l))">VS</b>
    <div><small id="oppLabel" style="display:block;margin-bottom:6px">คู่แข่ง · ขวา</small><div class="tut-slot" id="slotBot"><div class="flip"><div class="face back"></div><div class="face front"></div></div></div></div>
  </div>
  <div class="tut-msg" id="msg" aria-live="assertive"></div>
  <div class="tut-sub" id="sub"></div>
  <div class="dots" id="dots"></div>
</div>
<div class="tut-choices" id="choices" role="group" aria-label="เลือกสี"></div>
<div class="tut-next" id="nextRow"></div>
<script type="module">
import { el, haptic, reducedMotion } from '/core7/js/ui.js';
import { COLOR_META } from '/core7/js/cards.js';
import { colorIcon, genericCardSVG, cardBackSVG } from '/core7/js/art.js';
import { setHand, setTutorialCompleted, track } from '/core7/js/store.js';
import { getLang, setLang, applyLang } from '/core7/js/i18n.js';

/* ภาษาของหน้านี้เคยอ่านจาก ?lang= บน URL อย่างเดียว แปลว่าคนที่กด EN ไว้ที่
   หน้าอื่นแล้วเดินเข้ามาที่นี่จะเจอภาษาไทยเหมือนไม่เคยกด — ทั้งเว็บใช้ mc_lang
   ร่วมกันหมด หน้านี้ต้องอ่านค่าเดียวกันด้วย
   ยังรับ ?lang= อยู่ เพราะลิงก์เก่าที่ส่งกันไว้ต้องไม่ตาย แต่ให้ถือว่าเป็น
   "คำสั่งเปลี่ยนภาษา" คือเขียนลง mc_lang แล้วทั้งเว็บเปลี่ยนตาม ไม่ใช่ค่าเฉพาะหน้า */
const params = new URLSearchParams(location.search);
const fromUrl = params.get('lang');
if (fromUrl === 'en' || fromUrl === 'th') setLang(fromUrl);
const isEn = getLang() === 'en';
applyLang();
const entry = params.get('entry') || 'core7';
const fromWalkthrough = entry === 'walkthrough';
const handTarget = `/core7/hand/?next=bot&level=easy&entry=${encodeURIComponent(entry)}`;
const botTarget = '/core7/bot/?level=easy&fresh=1&entry=walkthrough';

document.documentElement.lang = isEn ? 'en' : 'th';
track('core7_tutorial_start');
if (entry === 'walkthrough') track('core7_tutorial_from_walkthrough');

document.getElementById('lang').textContent = isEn ? 'TH' : 'EN';
document.getElementById('lang').addEventListener('click', () => {
  /* เขียนลงค่ากลางแล้วโหลดใหม่ ไม่ต้องยุ่งกับ query string อีก —
     เดินออกจากหน้านี้ไปหน้าไหนต่อ ภาษาก็ตามไปด้วย */
  setLang(isEn ? 'th' : 'en');
  location.reload();
});
const skip = document.getElementById('skip');
skip.href = fromWalkthrough ? botTarget : handTarget;
skip.textContent = isEn ? 'Skip → EASY BOT' : 'ข้าม → EASY BOT';
skip.addEventListener('click', () => {
  if (fromWalkthrough) setHand(['gen-red','gen-red','gen-green','gen-green','gen-blue','gen-blue','gen-silver']);
});
document.getElementById('entryNote').textContent = fromWalkthrough
  ? (isEn ? 'Walkthrough route · tutorial → starter hand → EASY BOT' : 'ทางลัดจาก Walkthrough · เรียนกติกา → มือเริ่มต้น → EASY BOT')
  : '';
document.getElementById('youLabel').textContent = isEn ? 'YOU · always left' : 'คุณ · ซ้ายเสมอ';
document.getElementById('oppLabel').textContent = isEn ? 'OPPONENT · right' : 'คู่แข่ง · ขวา';

const slotYou=document.getElementById('slotYou'),slotBot=document.getElementById('slotBot'),msg=document.getElementById('msg'),sub=document.getElementById('sub'),choices=document.getElementById('choices'),nextRow=document.getElementById('nextRow'),dots=document.getElementById('dots'),tutorialCards=document.getElementById('tutorialCards'),ruleVisual=document.getElementById('ruleVisual');
slotYou.querySelector('.back').innerHTML=cardBackSVG({width:140});slotBot.querySelector('.back').innerHTML=cardBackSVG({width:140});

const TH=[
 {explain:'คุณอยู่ซ้าย · คู่แข่งอยู่ขวา',explainSub:'ทั้ง 2 ฝั่งเห็นตัวเองอยู่ซ้ายบนเครื่องของตัวเอง ผลเกมยังตรงกันจาก Server เดียวกัน'},
 {want:'RED',bot:'GREEN',text:'ลองกด 🔴 RED',explain:'🔴 แดงชนะ 🟢 เขียว',explainSub:'ผู้ชนะเสียใบที่ลง 1 ใบ · ผู้แพ้เสียใบที่ลง และต้องทิ้งเพิ่มอีก 1 ใบแบบหงายหน้า'},
 {want:'RED',bot:'RED',text:'ถ้าสีเดียวกันล่ะ? กด 🔴 RED อีกครั้ง',explain:'เสมอ — สีเดียวกันไม่มีใครแพ้',explainSub:'ทั้งคู่เสียแค่ใบที่ลง ไม่มีใครทิ้งเพิ่ม และไม่มีใครได้ Round Win'},
 {want:'SILVER',bot:'BLUE',text:'ลอง ⚙️ SILVER',explain:'⚙️ Block — เงินเสมอกับทุกสี',explainSub:'ใช้ซื้อเวลาและอ่านคู่แข่ง แต่เงินไม่มีวันชนะ Round ปกติ'},
 {explain:'⚠️ Final Silver',explainSub:'เมื่อเป็นใบสุดท้ายของทั้งคู่ เงินแพ้ทุกสีที่ไม่ใช่เงิน อย่าเก็บไว้ปิดเกม'},
 {visual:true,explain:'ชนะ 3 Rounds ก่อน หรือคู่แข่งหมดมือ = ชนะ Match',explainSub:'เท่านี้เล่นเป็นแล้ว เราจัดมือเริ่มต้น 2-2-2-1 ไว้ให้ กดแล้วเจอ EASY BOT ทันที'}
];
const EN=[
 {explain:'YOU = left · OPPONENT = right',explainSub:'Both players see themselves on the left while sharing the same server-authoritative result.'},
 {want:'RED',bot:'GREEN',text:'Tap RED',explain:'RED beats GREEN',explainSub:'The loser loses the played card and reveals one additional discard.'},
 {want:'RED',bot:'RED',text:'Tap RED again',explain:'DRAW — matching colors tie',explainSub:'Both lose only the played card. No extra discard.'},
 {want:'SILVER',bot:'BLUE',text:'Try SILVER',explain:'BLOCK — SILVER ties every normal color',explainSub:'It buys time but never wins a normal Round.'},
 {explain:'Final Silver',explainSub:'If SILVER is the final card for both players, it loses to any real color.'},
 {visual:true,explain:'Win 3 Rounds first, or outlast the opponent’s hand',explainSub:'A balanced 2-2-2-1 starter hand is ready. Tap once to meet the EASY BOT.'}
];
const STEPS=isEn?EN:TH;let step=0;
function renderDots(){dots.innerHTML='';STEPS.forEach((_,i)=>dots.append(el('i',{class:i<=step?'on':''})))}
function reset(){slotYou.classList.remove('revealed');slotBot.classList.remove('revealed')}
function advance(){step=Math.min(step+1,STEPS.length-1);run()}
function colorBtn(color,enabled,hinted){const b=el('button',{class:`cbtn ${color.toLowerCase()}${hinted?' hint':''}`,'aria-label':`${isEn?'Choose':'เลือกสี'} ${COLOR_META[color].nameEn}`,html:`${colorIcon(color,26)}<span>${COLOR_META[color].nameEn.toUpperCase()}</span>`});b.disabled=!enabled;return b}
function run(){renderDots();reset();const s=STEPS[step];tutorialCards.hidden=!!s.visual;ruleVisual.hidden=!s.visual;msg.textContent=s.text||s.explain;sub.textContent=s.text?'':s.explainSub;choices.innerHTML='';nextRow.innerHTML='';
 if(!s.want){const last=step===STEPS.length-1;const b=el('button',{class:'btn btn-gold'},last?(fromWalkthrough?(isEn?'🎲 Play EASY BOT now':'🎲 เล่นกับ EASY BOT เลย'):(isEn?'🖐️ Choose 7 cards →':'🖐️ เลือก 7 ใบ →')):(isEn?'👍 Next':'👍 เข้าใจแล้ว ต่อเลย'));b.addEventListener('click',()=>{if(last){setTutorialCompleted();track('core7_tutorial_complete');if(fromWalkthrough){setHand(['gen-red','gen-red','gen-green','gen-green','gen-blue','gen-blue','gen-silver']);location.href=botTarget}else location.href=handTarget}else advance()});nextRow.append(b);return}
 for(const color of ['RED','GREEN','BLUE','SILVER']){const b=colorBtn(color,color===s.want,color===s.want);b.addEventListener('click',()=>{haptic(10);choices.querySelectorAll('button').forEach(x=>x.disabled=true);slotYou.querySelector('.front').innerHTML=genericCardSVG(color,{width:140});slotBot.querySelector('.front').innerHTML=genericCardSVG(s.bot,{width:140});const reveal=()=>{slotYou.classList.add('revealed');slotBot.classList.add('revealed');msg.textContent=s.explain;sub.textContent=s.explainSub;const n=el('button',{class:'btn btn-gold'},isEn?'▶️ Next →':'▶️ ต่อไป →');n.addEventListener('click',advance);nextRow.append(n)};reducedMotion()?reveal():setTimeout(reveal,350)});choices.append(b)}
}
run();
</script>
</body>
</html>
