<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เรียนรู้ใน 30 วินาที — myClover: CORE7</title>
<meta name="description" content="Tutorial แบบเล่นจริง — สอนวงสี การทิ้งเพิ่ม และกฎ Final Gray ของ CORE7 ใน 30 วินาที">
<meta name="theme-color" content="#0A2818">
<link rel="icon" type="image/svg+xml" href="/core7/favicon.svg">
<link rel="stylesheet" href="/core7/css/core7.css">
<style>
body{background:radial-gradient(900px 520px at 50% -10%,rgb(27 106 66/.5),transparent 65%),rgb(var(--deep));color:#fff;min-height:100dvh;display:flex;flex-direction:column}
.tut-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.tut-top a{font-size:13.5px;color:rgb(255 255 255/.7);min-height:44px;display:inline-flex;align-items:center}
.tut-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:10px 18px;text-align:center}
.tut-cards{display:flex;gap:20px;align-items:center}
.tut-rule-visual{width:min(88vw,430px);max-height:56dvh;object-fit:contain;border:0;box-shadow:0 18px 44px rgb(0 0 0/.34)}
.tut-cards[hidden],.tut-rule-visual[hidden]{display:none!important}
.tut-slot{width:min(30vw,140px);aspect-ratio:300/420;perspective:900px}
.tut-slot .flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}
.tut-slot.revealed .flip{transform:rotateY(180deg)}
.tut-slot .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden}
.tut-slot .front{transform:rotateY(180deg)}
.tut-msg{font-size:clamp(16px,4vw,20px);font-weight:700;font-family:"Bai Jamjuree";min-height:56px;max-width:34ch}
.tut-sub{font-size:14px;color:rgb(255 255 255/.78);max-width:46ch;min-height:44px}
.tut-choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:0 14px 26px}
.tut-choices .cbtn{width:76px;height:100px;border-radius:12px;border:2px solid rgb(255 255 255/.35);color:#fff;font-family:"Bai Jamjuree";font-weight:700;font-size:12px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;transition:transform .15s}
.cbtn:hover{transform:translateY(-4px)}
.cbtn.hint{animation:hintPulse 1.2s infinite;border-color:rgb(var(--gold-l))}
@keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 rgb(227 197 126/.7)}50%{box-shadow:0 0 0 10px rgb(227 197 126/0)}}
.cbtn.red{background:linear-gradient(160deg,rgb(var(--c-red)),rgb(var(--c-red-deep)))}
.cbtn.green{background:linear-gradient(160deg,rgb(var(--c-green)),rgb(var(--c-green-deep)))}
.cbtn.blue{background:linear-gradient(160deg,rgb(var(--c-blue)),rgb(var(--c-blue-deep)))}
.cbtn.gray{background:linear-gradient(160deg,rgb(var(--c-gray)),rgb(var(--c-gray-deep)))}
.cbtn:disabled{opacity:.35}
.tut-next{padding:0 18px 30px;display:flex;justify-content:center;gap:12px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgb(255 255 255/.25)}
.dots i.on{background:rgb(var(--gold-l))}
@media(prefers-reduced-motion:reduce){.cbtn.hint{animation:none}}
</style>
</head>
<body>
<div class="tut-top">
  <b class="disp">🎓 เรียนรู้ CORE7</b>
  <div style="display:flex;gap:10px;align-items:center"><button class="btn btn-ghost" id="lang" style="min-height:38px;padding:6px 10px">EN</button><a href="/core7/hand/?next=bot&level=easy" id="skip">ข้าม Tutorial →</a></div>
</div>
<div class="tut-stage">
  <img class="tut-rule-visual" id="ruleVisual" src="/core7/assets/core7-rules-overview.png" hidden
    alt="กติกา CORE7: วงสี ผู้แพ้ทิ้งเพิ่ม ชนะสามรอบ และ Final Gray">
  <div class="tut-cards" id="tutorialCards">
    <div><small id="youLabel" style="display:block;margin-bottom:6px">คุณ · ซ้ายเสมอ</small><div class="tut-slot" id="slotYou"><div class="flip"><div class="face back"></div><div class="face front"></div></div></div></div>
    <b class="disp" style="color:rgb(var(--gold-l))">VS</b>
    <div><small id="oppLabel" style="display:block;margin-bottom:6px">คู่แข่ง · ขวา</small><div class="tut-slot" id="slotBot"><div class="flip"><div class="face back"></div><div class="face front"></div></div></div></div>
  </div>
  <div class="tut-msg" id="msg" aria-live="assertive"></div>
  <div class="tut-sub" id="sub"></div>
  <div class="dots" id="dots"></div>
</div>
<div class="tut-choices" id="choices" role="group" aria-label="เลือกสี"></div>
<div class="tut-next" id="nextRow"></div>
<script type="module">
import { el, haptic, reducedMotion } from '/core7/js/ui.js';
import { COLOR_META } from '/core7/js/cards.js';
import { colorIcon, genericCardSVG, cardBackSVG } from '/core7/js/art.js';
import { setTutorialCompleted, track } from '/core7/js/store.js';

track('core7_tutorial_start');
const slotYou = document.getElementById('slotYou');
const slotBot = document.getElementById('slotBot');
const msg = document.getElementById('msg');
const sub = document.getElementById('sub');
const choices = document.getElementById('choices');
const nextRow = document.getElementById('nextRow');
const dots = document.getElementById('dots');
const tutorialCards = document.getElementById('tutorialCards');
const ruleVisual = document.getElementById('ruleVisual');
const params = new URLSearchParams(location.search);
const isEn = params.get('lang') === 'en';
document.documentElement.lang = isEn ? 'en' : 'th';
document.getElementById('lang').textContent = isEn ? 'TH' : 'EN';
document.getElementById('lang').addEventListener('click', () => location.search = isEn ? '' : '?lang=en');
document.getElementById('skip').textContent = isEn ? 'Skip tutorial →' : 'ข้าม Tutorial →';
document.getElementById('youLabel').textContent = isEn ? 'YOU · always left' : 'คุณ · ซ้ายเสมอ';
document.getElementById('oppLabel').textContent = isEn ? 'OPPONENT · right' : 'คู่แข่ง · ขวา';
ruleVisual.alt = isEn
  ? 'CORE7 overview: color cycle, loser discards one extra, win three rounds, and Final Gray'
  : 'กติกา CORE7: วงสี ผู้แพ้ทิ้งเพิ่มหนึ่งใบ ชนะสามรอบ และ Final Gray';
slotYou.querySelector('.back').innerHTML = cardBackSVG({ width: 140 });
slotBot.querySelector('.back').innerHTML = cardBackSVG({ width: 140 });

/* บทเรียน: [ข้อความ, สีที่ให้กด(null=ปุ่มไปต่อ), สีที่บอทเปิด, คำอธิบายหลังเปิด] */
const STEPS_TH = [
  {
    text: 'ไม่ว่าคุณจะสร้างหรือเข้าห้อง การ์ดของคุณอยู่ฝั่งซ้ายบนเครื่องนี้เสมอ',
    want: null, bot: null,
    explain: 'คุณ = ซ้าย · คู่แข่ง = ขวา',
    explainSub: 'ทั้งสองคนจึงเห็นตัวเองอยู่ซ้ายบนหน้าจอของตัวเอง โดยผลเกมยังตรงกันจาก Server เดียวกัน',
  },
  {
    text: 'ทั้งคู่เลือกการ์ดลับแล้วเปิดพร้อมกัน — ลองกด 🔴 RED ดู',
    want: 'RED', bot: 'GREEN',
    explain: '🔴 แดงชนะ 🟢 เขียว! คุณได้ Round Win — ผู้ชนะเสียแค่ใบที่ลง (1 ใบ)',
    explainSub: 'แต่ผู้แพ้เสีย 2 ใบ: ใบที่ลง + ต้องเลือกทิ้งจากมือเพิ่มอีก 1 ใบแบบหงายหน้า',
  },
  {
    text: 'ถ้าสีเดียวกันล่ะ? ลองกด 🔴 RED อีกครั้ง',
    want: 'RED', bot: 'RED',
    explain: 'เสมอ! สีเดียวกันไม่มีใครแพ้',
    explainSub: 'ทั้งคู่เสียแค่ใบที่ลง ไม่มีใครทิ้งเพิ่ม และไม่มีใครได้ Round Win',
  },
  {
    text: 'ทีนี้ลองอาวุธลับ — กด ⚙️ GRAY',
    want: 'GRAY', bot: 'BLUE',
    explain: '⚙️ Block! สีเทาเสมอกับทุกสี',
    explainSub: 'ใช้เทาเพื่อซื้อเวลาและอ่านคู่แข่ง โดยไม่เสี่ยงแพ้ (และไม่มีวันชนะรอบ)',
  },
  {
    text: 'กฎสุดท้าย — Final Gray',
    want: null, bot: null,
    explain: '⚠️ ถ้าเทาเป็น "ใบสุดท้าย" ของทั้งคู่ เทาจะแพ้ทุกสีที่ไม่ใช่เทา',
    explainSub: 'เครื่องมือช่วยซื้อเวลาได้ แต่เลือกชัยชนะครั้งสุดท้ายแทนมนุษย์ไม่ได้ — อย่าเก็บเทาไว้เป็นใบปิดเกม',
  },
  {
    text: 'ชนะ Match เมื่อ: ชนะครบ 3 รอบ หรือคู่แข่งการ์ดหมดมือ',
    want: null, bot: null,
    explain: 'เท่านี้ก็เล่นเป็นแล้ว! 🎉',
    explainSub: 'ต่อไป: เลือกมือ 7 ใบของคุณเอง — สีใดกี่ใบก็ได้ แล้วใช้เกมเป็นข้ออ้างดี ๆ ในการเปิดบทสนทนา',
    visual: true,
  },
];
const STEPS_EN = [
  { text:'Your cards are always on the left on this device.', want:null, bot:null, explain:'YOU = left · OPPONENT = right', explainSub:'Both players see themselves on the left while sharing the same server-authoritative result.' },
  { text:'Both choose secretly, then reveal together. Tap RED.', want:'RED', bot:'GREEN', explain:'RED beats GREEN — you win the Round.', explainSub:'The loser loses the played card and reveals one additional discarded card.' },
  { text:'What if both colors match? Tap RED again.', want:'RED', bot:'RED', explain:'DRAW — matching colors tie.', explainSub:'Both lose only the played card. No additional discard.' },
  { text:'Try the block card. Tap GRAY.', want:'GRAY', bot:'BLUE', explain:'BLOCK — GRAY ties every normal color.', explainSub:'GRAY buys time, but never wins a normal Round.' },
  { text:'Final Gray rule', want:null, bot:null, explain:'If GRAY is your final card, it loses to a real color.', explainSub:'A tool can buy time, but cannot make the final choice for you.' },
  { text:'Win a Match by reaching 3 Round wins before your hand runs out.', want:null, bot:null, explain:'You are ready. Quick is one Match; BO3/BO5 keep the same Starting Hand.', explainSub:'Now choose your seven cards and use the game as an easy way to start a conversation.', visual:true },
];
const STEPS = isEn ? STEPS_EN : STEPS_TH;
let step = 0;

function renderDots() {
  dots.innerHTML = '';
  STEPS.forEach((_, i) => dots.append(el('i', { class: i <= step ? 'on' : '' })));
}

function colorBtn(color, enabled, hinted) {
  const b = el('button', {
    class: `cbtn ${color.toLowerCase()}${hinted ? ' hint' : ''}`,
    'aria-label': `เลือกสี${COLOR_META[color].nameTh}`,
    html: `${colorIcon(color, 26)}<span>${COLOR_META[color].nameEn.toUpperCase()}</span>`,
  });
  b.disabled = !enabled;
  return b;
}

function resetSlots() {
  slotYou.classList.remove('revealed');
  slotBot.classList.remove('revealed');
}

function runStep() {
  renderDots();
  const s = STEPS[step];
  resetSlots();
  tutorialCards.hidden = Boolean(s.visual);
  ruleVisual.hidden = !s.visual;
  msg.textContent = s.text;
  sub.textContent = '';
  nextRow.innerHTML = '';
  choices.innerHTML = '';

  if (!s.want) {   /* ขั้นอธิบายอย่างเดียว */
    msg.textContent = s.text;
    sub.textContent = '';
    const show = el('button', { class: 'btn btn-gold' }, step === STEPS.length - 1 ? (isEn ? 'Build my 7-card hand →' : 'ไปเลือกมือ 7 ใบ →') : (isEn ? 'Got it — next' : 'เข้าใจแล้ว ต่อเลย'));
    show.addEventListener('click', () => advance());
    msg.textContent = s.explain;
    sub.textContent = s.explainSub;
    if (step === STEPS.length - 1) {
      setTutorialCompleted();
      track('core7_tutorial_complete');
      show.addEventListener('click', () => location.href = '/core7/hand/?next=bot&level=easy');
    }
    nextRow.append(show);
    return;
  }

  for (const color of ['RED', 'GREEN', 'BLUE', 'GRAY']) {
    const b = colorBtn(color, color === s.want, color === s.want);
    b.addEventListener('click', () => {
      haptic(10);
      choices.querySelectorAll('button').forEach(x => x.disabled = true);
      slotYou.querySelector('.front').innerHTML = genericCardSVG(color, { width: 140 });
      slotBot.querySelector('.front').innerHTML = genericCardSVG(s.bot, { width: 140 });
      const reveal = () => {
        slotYou.classList.add('revealed');
        slotBot.classList.add('revealed');
        haptic([10, 40, 18]);
        msg.textContent = s.explain;
        sub.textContent = s.explainSub;
        const nxt = el('button', { class: 'btn btn-gold' }, isEn ? 'Next →' : 'ต่อไป →');
        nxt.addEventListener('click', () => advance());
        nextRow.append(nxt);
      };
      reducedMotion() ? reveal() : setTimeout(reveal, 350);
    });
    choices.append(b);
  }
}

function advance() { step = Math.min(step + 1, STEPS.length - 1); runStep(); }
runStep();
</script>
</body>
</html>
