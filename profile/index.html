<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#FFF9E9">
<title>XTY Profile</title>
<meta name="description" content="โปรไฟล์ XTY, ตี้ที่กำลังเล่น และ Pet ของคุณ">
<link rel="stylesheet" href="/xty/_shared/xty.css?v=5">
</head>
<body>

<header class="top">
  <a class="mark" href="/xty/"><img src="/xty/assets/xty-logo.png" alt="XTY"></a>
  <a class="back" href="/xty/">XTY</a>
</header>

<main class="wrap">
  <section id="none" hidden>
    <h1 class="title">ยังไม่มีโปรไฟล์</h1>
    <p class="lede">เลือกชื่อเรียกกับ Avatar ก่อน แล้วค่อยกลับมาดูตี้และ Pet ของคุณ</p>
    <a class="btn gold" href="/xty/">เข้าสู่ XTY</a>
  </section>

  <section id="view" hidden>
    <div class="card">
      <div class="party-head">
        <div class="profile-avatar" id="av" aria-hidden="true"></div>
        <div style="flex:1;min-width:0">
          <p class="kicker" style="margin-bottom:6px">XTY PROFILE</p>
          <h1 class="title" id="alias" style="font-size:clamp(24px,6vw,32px);margin:0"></h1>
        </div>
      </div>
      <p class="whisper" id="since"></p>
    </div>

    <div class="card">
      <div class="account-row">
        <div>
          <span class="label" style="margin-bottom:6px">LINE</span>
          <div id="lineStatus" class="whisper" style="margin:0">กำลังตรวจสอบ…</div>
        </div>
        <button class="btn ghost sm" id="lineBtn">เชื่อม LINE</button>
      </div>
    </div>

    <div class="card">
      <span class="label">PARTIES</span>
      <div class="capacity-panel">
        <img src="/xty/assets/art/mascots/orange-cat.webp" alt="" aria-hidden="true">
        <div>
          <div class="capacity-number" id="capacity">0 / 4<small>ตี้ที่กำลังเล่น</small></div>
          <p class="whisper" id="capacityHint">สร้างได้ 1 ตี้ · เข้าร่วมได้ 3 ตี้</p>
        </div>
      </div>
    </div>

    <div class="card">
      <span class="label">PETS · 8 ตัวพร้อมใช้</span>
      <p class="whisper" style="margin:0 0 4px">เลือก Pet ประจำตี้ได้ หรือจะไม่เลือกก็ได้</p>
      <div class="card-grid" id="pets"></div>
    </div>

    <nav class="tabs">
      <a href="/xty/">XTY</a>
      <a class="active" href="/profile/">โปรไฟล์</a>
      <a href="/xty/about/">เกี่ยวกับ</a>
    </nav>
  </section>
</main>

<script type="module">
import { getProfile, hasProfile, activePartyUsage } from '/xty/_shared/store.js';
import { XTY_V1_PETS } from '/xty/_shared/pets.js';
import { avatarById } from '/xty/_shared/avatars.js';
import { startLineLogin, syncXtyProfile } from '/xty/_shared/account.js';

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function render(account) {
  const p = getProfile();
  $('view').hidden = false;
  const avatar = avatarById(p.avatarId);
  $('av').dataset.color = p.avatarFrame || 'green';
  $('av').innerHTML = `<img src="${avatar.art}" alt="">`;
  $('alias').textContent = p.alias;
  $('since').textContent = 'เริ่มเมื่อ ' +
    new Date(p.createdAt).toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });

  if (account.authenticated) {
    $('lineStatus').innerHTML = '<span class="status-pill">Connected ✓</span><br>Progress เก็บกับบัญชีนี้';
    $('lineBtn').hidden = true;
  } else {
    $('lineStatus').textContent = 'ยังไม่ได้เชื่อม — Progress อยู่ในเครื่องนี้';
    $('lineBtn').hidden = false;
    $('lineBtn').addEventListener('click', () => startLineLogin('/profile/'), { once: true });
  }

  const usage = activePartyUsage(p);
  $('capacity').innerHTML = `${usage.total} / ${usage.maxTotal}<small>ACTIVE PARTIES</small>`;
  $('capacityHint').textContent = `สร้างได้ ${usage.maxOwned} ตี้ · เข้าร่วมได้ ${usage.maxJoined} ตี้`;

  const box = $('pets');
  box.innerHTML = '';
  XTY_V1_PETS.forEach(pet => {
    const d = document.createElement('div');
    d.className = 'pc';
    d.dataset.color = pet.color;
    d.innerHTML =
      `<span class="glyph">${pet.art ? `<img src="${pet.art}" alt="">` : pet.emoji}</span>` +
      `<span class="nm">${esc(pet.nameTh)}</span>` +
      `<span class="pet-persona">${esc(pet.persona)}</span>`;
    box.appendChild(d);
  });
}

async function boot() {
  const localAccount = { authenticated: false };
  if (new URLSearchParams(location.search).has('account')) history.replaceState(null, '', '/profile/');
  if (!hasProfile()) $('none').hidden = false;
  else render(localAccount);
  const account = await syncXtyProfile();
  if (hasProfile() && account.authenticated) {
    $('lineStatus').innerHTML = '<span class="status-pill">Connected ✓</span><br>Progress เก็บกับบัญชีนี้';
    $('lineBtn').hidden = true;
  }
}

boot();
</script>
</body>
</html>
