<!doctype html>
<html lang="th">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-VISOR 2.0 · Story Edition Preview</title>
<style>
  body{margin:0;background:#dfe5df;color:#183e42;font:14px system-ui}header{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:9px}iframe{display:block;max-width:100%;border:0;margin:0 auto;background:#17384f}strong{margin-right:auto}#status{padding:8px;text-align:center}
</style>
<header><strong>X-VISOR 2.0 · ข้อมูลตัวอย่างสำหรับทดสอบ · ไม่ใช้เซฟจริง</strong>
<label>ฉาก <select id="scenario"><option value="opening">เริ่มเกม</option><option value="bandWorn">Day 0 · สวมสายข้อมือแล้ว</option><option value="month2" selected>Month 2 · Quick choices</option><option value="management">Management + Skill</option><option value="monthClosed">Month 8 · สรุปการเติบโตปลายเดือน</option><option value="seatedRoutine">ท่านั่ง · วาง Routine</option><option value="consultation">ท่านั่ง · สนทนา</option><option value="classroom">ท่านั่ง · ห้องสอบ</option><option value="exam">ห้องสอบ</option><option value="campReady">The Xircle · พร้อมเริ่ม</option><option value="campRunning">The Xircle · กำลังร่วมงาน</option><option value="camp">The Xircle · หลังร่วมงาน</option><option value="year2">Year 2 · การเติบโตและประวัติ</option><option value="tokyo">Tokyo · Month 16</option><option value="dubai">Dubai · Month 22</option><option value="score">High Score gate</option><option value="finale">Month 24 + NEW GAME+</option></select></label>
<label>หน้าจอ <select id="width"><option value="1280">Desktop 1280</option><option value="768">Tablet 768</option><option value="390">Mobile 390</option><option value="320">Mobile 320</option></select></label><button id="load">โหลดฉากทดสอบ</button></header>
<div id="status" role="status">กำลังเตรียม</div><iframe id="preview" title="เกมฉบับทดสอบ" width="1280" height="1000"></iframe>
<script type="importmap" id="gameModuleMap">{
  "imports": {
    "/xvisor/quest/game-action-peek.js": "/xvisor/quest/game-action-peek.js?v=2.0-growth1",
    "/xvisor/quest/game-action-scenes.js": "/xvisor/quest/game-action-scenes.js?v=2.0-growth1",
    "/xvisor/quest/game-actions.js": "/xvisor/quest/game-actions.js?v=2.0-growth1",
    "/xvisor/quest/game-art.js": "/xvisor/quest/game-art.js?v=2.0-growth1",
    "/xvisor/quest/game-audio.js": "/xvisor/quest/game-audio.js?v=2.0-growth1",
    "/xvisor/quest/game-boot.js": "/xvisor/quest/game-boot.js?v=2.0-growth1",
    "/xvisor/quest/game-commercial-config.js": "/xvisor/quest/game-commercial-config.js?v=2.0-growth1",
    "/xvisor/quest/game-copy.js": "/xvisor/quest/game-copy.js?v=2.0-growth1",
    "/xvisor/quest/game-data.js": "/xvisor/quest/game-data.js?v=2.0-growth1",
    "/xvisor/quest/game-engine.js": "/xvisor/quest/game-engine.js?v=2.0-growth1",
    "/xvisor/quest/game-exam.js": "/xvisor/quest/game-exam.js?v=2.0-growth1",
    "/xvisor/quest/game-mentor-art.js": "/xvisor/quest/game-mentor-art.js?v=2.0-growth1",
    "/xvisor/quest/game-narrative-data.js": "/xvisor/quest/game-narrative-data.js?v=2.0-growth1",
    "/xvisor/quest/game-panels.js": "/xvisor/quest/game-panels.js?v=2.0-growth1",
    "/xvisor/quest/game-people.js": "/xvisor/quest/game-people.js?v=2.0-growth1",
    "/xvisor/quest/game-portrait.js": "/xvisor/quest/game-portrait.js?v=2.0-growth1",
    "/xvisor/quest/game-presentation.js": "/xvisor/quest/game-presentation.js?v=2.0-growth1",
    "/xvisor/quest/game-progression.js": "/xvisor/quest/game-progression.js?v=2.0-growth1",
    "/xvisor/quest/game-save.js": "/xvisor/quest/game-save.js?v=2.0-growth1",
    "/xvisor/quest/game-story.js": "/xvisor/quest/game-story.js?v=2.0-growth1",
    "/xvisor/quest/game-ui.js": "/xvisor/quest/game-ui.js?v=2.0-growth1",
    "/xvisor/quest/game-world.js": "/xvisor/quest/game-world.js?v=2.0-growth1",
    "/tests/xvisor/game-review-fixtures.mjs": "/tests/xvisor/game-review-fixtures.mjs?v=2.0-growth1"
  }
}</script>
<script type="module">
if (!['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
  location.replace('/xvisor/quest/');
} else {
const { SAVE_KEY, serializeState } = await import('/xvisor/quest/game-data.js');
const { makeReviewFixtures } = await import('./game-review-fixtures.mjs');
const fixtures=makeReviewFixtures();
const requestedScene=new URLSearchParams(location.search).get('scene');
if (requestedScene && [...document.querySelector('#scenario').options].some(option=>option.value===requestedScene)) document.querySelector('#scenario').value=requestedScene;
const shell=await (await fetch('/xvisor/quest/index.html', {cache:'no-store'})).text();
async function load(){
 const scenario=document.querySelector('#scenario').value,width=Number(document.querySelector('#width').value),state=fixtures[scenario];
 const store=JSON.stringify([[SAVE_KEY,serializeState(state)],['mc_xvisor_audio_1',JSON.stringify({muted:true,musicEnabled:false,sfxEnabled:false})],...(scenario==='score'?[]:[[`mc_xvisor_1b_score_sent:${state.runId}`,'QA fixture']])]);
 const bootstrap=`try { const records=new Map(${store});Object.defineProperty(window,'localStorage',{value:{getItem:k=>records.get(k)??null,setItem:(k,v)=>records.set(k,String(v)),removeItem:k=>records.delete(k)}});window.fetch=async()=>new Response(JSON.stringify({ok:false,error:'QA: NETWORK WRITES DISABLED',progress:{}}),{status:503,headers:{'content-type':'application/json'}});await import('/xvisor/quest/game-boot.js?v=2.0-growth1');parent.postMessage({type:'xvisor-preview-boot',ready:document.body.dataset.gameBoot==='ready'}, new URL(document.baseURI).origin);} catch(error) {console.error('[X-VISOR Preview] Startup failed',error);parent.postMessage({type:'xvisor-preview-boot',ready:false}, new URL(document.baseURI).origin);}`;
 const html=shell.replace(/<script type="module" src="[^"]+"><\/script>/,`<script type="module">${bootstrap}<\/script>`);
 const frame=document.querySelector('#preview');frame.width=width;frame.height=width<500?844:1000;frame.srcdoc=html;
 document.querySelector('#status').textContent=`กำลังโหลด ${scenario} · ${width}px…`;
}
window.addEventListener('message', event=>{
 if (event.origin!==location.origin || event.source!==document.querySelector('#preview').contentWindow || event.data?.type!=='xvisor-preview-boot') return;
 const scenario=document.querySelector('#scenario').value,width=document.querySelector('#width').value;
 document.querySelector('#status').textContent=event.data.ready?`${scenario} · ${width}px · พร้อมเล่น · เซฟจำลอง · ปิดการส่งข้อมูล`:'โหลดฉากไม่สำเร็จ · กดโหลดฉากทดสอบเพื่อลองอีกครั้ง';
});
document.querySelector('#load').onclick=load;
document.querySelector('#width').onchange=load;
document.querySelector('#scenario').onchange=load;
load();
}
</script>
</html>
