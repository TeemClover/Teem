<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoutineX · Xircle — รูทีน เซอเคิล รีวิว และสั่งซื้อ ในหน้าเดียว</title>
<meta name="description" content="หน้าเดียวจบ ดู RoutineX ดู Xircle อ่านรีวิวจากคนใช้จริง แล้วสั่งซื้อได้เลย">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.myclover.com/share/">
<link rel="icon" href="/favicon.ico">
<meta property="og:type" content="website">
<meta property="og:locale" content="th_TH">
<meta property="og:site_name" content="myClover">
<meta property="og:url" content="https://www.myclover.com/share/">
<meta property="og:title" content="RoutineX · Xircle — ดูครบในหน้าเดียว">
<meta property="og:description" content="รูทีน · เซอเคิล · รวมรีวิว · สั่งซื้อ">
<meta property="og:image" content="https://www.myclover.com/share/assets/og-share.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="กล่อง RoutineX และ Xircle Band พร้อมปุ่ม รูทีน เซอเคิล รวมรีวิว สั่งซื้อ">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#060a16">
<link rel="preload" href="/xircle/assets/fonts/ibm-plex-sans-thai-thai-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/share/share.css?v=20261126">
<script defer src="/share/ref.js?v=20261126"></script>
<script defer src="/share/share.js?v=20261126"></script>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="page">
  <header class="head">
    <p class="eyebrow">RoutineX <span aria-hidden="true">·</span> Xircle</p>
    <h1>อยากรู้เรื่องไหน <span class="grad">แตะได้เลย</span></h1>
  </header>

  <nav class="grid" aria-label="เลือกหน้าที่อยากดู">
    <a class="tile tile--routine" style="--i:0" href="/routinex/" data-go="routinex">
      <img class="tile__brand" src="/share/assets/routinex-logo.webp" alt="RoutineX" width="360" height="50">
      <span class="tile__art" aria-hidden="true">
        <span class="halo"></span>
        <img class="box" src="/share/assets/routinex-box.webp" alt="" width="520" height="536" decoding="async">
      </span>
      <span class="tile__text">
        <span class="tile__name">รูทีน</span>
        <span class="tile__sub">เปิดกล่องดูข้างใน</span>
      </span>
      <span class="tile__go" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>

    <a class="tile tile--xircle" style="--i:1" href="/xircle/" data-go="xircle">
      <img class="tile__brand" src="/share/assets/xircle-logo.svg" alt="Xircle" width="104" height="16">
      <span class="tile__art" aria-hidden="true">
        <span class="ring"></span><span class="ring"></span><span class="ring"></span>
        <img class="band" src="/share/assets/xircle-band.webp" alt="" width="460" height="613" decoding="async">
      </span>
      <span class="tile__text">
        <span class="tile__name">เซอเคิล</span>
        <span class="tile__sub">Band · Scale · แอป</span>
      </span>
      <span class="tile__go" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>

    <a class="tile tile--review" style="--i:2" href="/review/" data-go="review">
      <span class="tile__tag" lang="en">Review</span>
      <span class="tile__art" aria-hidden="true">
        <span class="clip clip--l"><i></i><b></b><b></b></span>
        <span class="clip clip--r"><i></i><b></b><b></b></span>
        <span class="clip clip--c"><i></i><b></b><b></b><em></em></span>
      </span>
      <span class="tile__text">
        <span class="tile__name">รวมรีวิว</span>
        <span class="tile__sub">คลิปจากคนใช้จริง</span>
      </span>
      <span class="tile__go" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>

    <a class="tile tile--buy" style="--i:3" id="buy" href="https://buy.xircle.health/?openExternalBrowser=1" data-go="buy">
      <span class="tile__tag" id="buy-tag" lang="en">Order</span>
      <span class="tile__art" aria-hidden="true">
        <span class="spark spark--a"></span><span class="spark spark--b"></span><span class="spark spark--c"></span>
        <svg class="bag" viewBox="0 0 120 120" width="120" height="120">
          <path d="M42 46V36a18 18 0 0 1 36 0v10" fill="none" stroke="#141b33" stroke-width="7" stroke-linecap="round"/>
          <path d="M24 44h72l7 56a9 9 0 0 1-9 10H26a9 9 0 0 1-9-10z" fill="#fff"/>
          <path d="M24 44h72l2 16H22z" fill="#141b33" opacity=".1"/>
          <path d="m46 78 10 10 19-21" fill="none" stroke="#41b755" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="tile__text">
        <span class="tile__name">สั่งซื้อ</span>
        <span class="tile__sub">ไปหน้าร้านเลย</span>
      </span>
      <span class="tile__go" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="shine" aria-hidden="true"></span>
    </a>
  </nav>

  <footer class="foot">
    <button class="fwd" id="fwd" type="button" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="fwd-text">ส่งต่อหน้านี้</span>
    </button>
  </footer>
</main>
</body>
</html>
