<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Member Registry · myClover</title><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071d12">
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06170f,#0b2117 50%,#06150e);color:#fff;font:14px/1.55 system-ui,"Anuphan",sans-serif;min-height:100vh}.wrap{width:min(1380px,calc(100% - 28px));margin:auto;padding:30px 0 80px}h1{font:800 clamp(30px,5vw,54px)/1.05 "Bai Jamjuree",system-ui;margin:5px 0 8px}.eyebrow{color:#d9b86c;font-size:10px;letter-spacing:.13em;font-weight:800}.lead{color:#ffffffa8;max-width:700px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}.back{color:#d9b86c}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0 12px}.tools input{flex:1;min-width:240px;background:#fff;color:#172018;border:0;border-radius:12px;padding:12px 14px;font:inherit}.btn{border:1px solid #ffffff24;border-radius:12px;padding:11px 15px;background:#ffffff10;color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:#d9b86c;color:#172018;border-color:#d9b86c}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.kpi{border:1px solid #ffffff1c;border-radius:16px;padding:15px;background:#ffffff0b}.kpi span{display:block;color:#ffffff80;font-size:11px}.kpi strong{display:block;font:800 30px "Bai Jamjuree";margin-top:3px}.tablebox{overflow:auto;border:1px solid #ffffff1c;border-radius:18px;background:#ffffff08}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:12px 13px;border-bottom:1px solid #ffffff12;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#102a1d;color:#ffffff91;font-size:10px;letter-spacing:.04em}td b{color:#d9b86c;font-family:"Bai Jamjuree"}.muted{color:#ffffff70;font-size:12px}.tag{display:inline-block;margin:2px 3px 2px 0;padding:2px 7px;border-radius:999px;background:#ffffff12;font-size:10px}.tag.live{background:#65d39d22;color:#65d39d}.progress{white-space:nowrap}.empty,.state{padding:30px;color:#ffffff9a}.email{color:#fff}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#ffffff6e;font-size:11px;margin:9px 0 13px}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.wrap{width:min(100% - 18px,1380px)}.tools{display:grid}.tools input{min-width:0}}
</style></head><body><main class="wrap">
<header class="top"><div><span class="eyebrow">PRIVATE · OWNER ONLY</span><h1>ทะเบียนสมาชิก myClover</h1><p class="lead">ค้นจากเลขสมาชิก ชื่อ หรืออีเมล · ดูช่องทางสมัครและ Progress ล่าสุดเพื่อจัดกิจกรรมในอนาคต</p></div><a class="back" href="/stat/">← Stat Dashboard</a></header>
<section class="tools"><input id="search" type="search" placeholder="ค้นหา MY-2026-0001, ชื่อ หรืออีเมล"><button class="btn primary" id="find">ค้นหา</button><button class="btn" id="refresh">Refresh</button><a class="btn" id="csv" href="/members/api?format=csv">Export CSV</a></section>
<div class="meta"><span id="meta">กำลังอ่านทะเบียน…</span><span>ข้อมูลนี้ถูกล็อกด้วยรหัส Admin และไม่ถูก Index</span></div>
<section class="kpis" id="kpis"></section><div class="tablebox"><div class="state" id="state">กำลังโหลด…</div><table id="table" hidden><thead><tr><th>เลขสมาชิก</th><th>ชื่อ / อีเมล</th><th>สมัครด้วย</th><th>เข้าร่วม</th><th>ล่าสุด</th><th>Progress</th><th>สถานะ</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'—';let current=[];
function paint(list){current=list;const accounts=list.filter(x=>x.hasAccount),google=list.filter(x=>x.providers.includes('google')),line=list.filter(x=>x.providers.includes('line'));
 $('kpis').innerHTML=[['เลขสมาชิก',list.length],['มี Account',accounts.length],['Google',google.length],['LINE',line.length]].map(x=>`<article class="kpi"><span>${x[0]}</span><strong>${Number(x[1]).toLocaleString()}</strong></article>`).join('');
 $('rows').innerHTML=list.map(m=>`<tr><td><b>${esc(m.memberNo||'ยังไม่มีเลข')}</b></td><td><strong>${esc(m.name||'—')}</strong><br><a class="email" href="mailto:${encodeURIComponent(m.email)}">${esc(m.email)}</a>${m.registeredName&&m.registeredName!==m.name?`<br><span class="muted">ชื่อทะเบียน: ${esc(m.registeredName)}</span>`:''}</td><td>${m.providers.length?m.providers.map(p=>`<span class="tag live">${esc(p)}</span>`).join(''):'<span class="tag">ทะเบียนเดิม</span>'}</td><td>${date(m.joinedAt)}</td><td>${date(m.lastActiveAt)}</td><td class="progress">📖 ${m.progress.story} · ⚡ ${m.progress.lessons}<br>🏅 ${m.progress.titles} · 🃏 ${m.progress.cards}</td><td>${m.hasAccount?'<span class="tag live">Cloud Save</span>':'<span class="tag">ยังไม่มี Account</span>'}${m.news?'<br><span class="tag">รับข่าว</span>':''}</td></tr>`).join('');
 $('state').hidden=!!list.length;$('state').textContent=list.length?'':'ไม่พบสมาชิก';$('table').hidden=!list.length;}
async function load(){const q=$('search').value.trim();$('state').hidden=false;$('state').textContent='กำลังอ่านทะเบียน…';$('table').hidden=true;try{const r=await fetch('/members/api'+(q?'?q='+encodeURIComponent(q):''),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||r.status);paint(d.members);$('meta').textContent=`พบ ${d.count.toLocaleString()} รายการ · อัปเดต ${date(d.generatedAt)}`;$('csv').href='/members/api?format=csv'+(q?'&q='+encodeURIComponent(q):'')}catch(e){$('state').textContent='อ่านทะเบียนไม่ได้: '+e.message}}
$('find').onclick=load;$('refresh').onclick=load;$('search').onkeydown=e=>{if(e.key==='Enter')load()};load();
</script></body></html>
