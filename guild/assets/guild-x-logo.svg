<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
<title id="title">Guild X</title><desc id="desc">Four colored myClover paths converging into a gold X</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="68%"><stop offset="0" stop-color="#0c2818"/><stop offset=".55" stop-color="#051009"/><stop offset="1" stop-color="#010302"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a7"/><stop offset=".28" stop-color="#f7cf61"/><stop offset=".58" stop-color="#a96f17"/><stop offset=".8" stop-color="#ffe38a"/><stop offset="1" stop-color="#6d430c"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6553"/><stop offset="1" stop-color="#8d120c"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7cff84"/><stop offset="1" stop-color="#0b6f2f"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63b8ff"/><stop offset="1" stop-color="#0a3e91"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f0e8"/><stop offset=".48" stop-color="#8c918d"/><stop offset="1" stop-color="#3f4542"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
  <path id="petal" d="M350 351 C297 349 206 321 170 255 C137 194 170 132 228 122 C298 109 349 174 350 351 Z"/>
</defs>
<circle cx="360" cy="360" r="346" fill="url(#bg)"/>
<circle cx="360" cy="360" r="324" fill="none" stroke="#70ffac" stroke-opacity=".14" stroke-width="3"/>
<circle cx="360" cy="360" r="302" fill="none" stroke="url(#gold)" stroke-width="10"/>
<circle cx="360" cy="360" r="281" fill="none" stroke="#8cffb4" stroke-opacity=".2" stroke-width="2" stroke-dasharray="7 13"/>
<g opacity=".38" filter="url(#soft)"><circle cx="360" cy="360" r="220" fill="none" stroke="#46ff9b" stroke-width="18"/></g>
<g stroke="url(#gold)" stroke-width="10" stroke-linejoin="round">
  <use href="#petal" fill="url(#red)"/>
  <use href="#petal" fill="url(#green)" transform="translate(720 0) scale(-1 1)"/>
  <use href="#petal" fill="url(#blue)" transform="translate(0 720) scale(1 -1)"/>
  <use href="#petal" fill="url(#silver)" transform="translate(720 720) scale(-1 -1)"/>
</g>
<g opacity=".34" fill="none" stroke="#fff" stroke-width="2">
  <path d="M217 155 C264 167 316 214 332 309"/><path d="M503 155 C456 167 404 214 388 309"/><path d="M217 565 C264 553 316 506 332 411"/><path d="M503 565 C456 553 404 506 388 411"/>
</g>
<circle cx="360" cy="360" r="43" fill="#041008" stroke="url(#gold)" stroke-width="8"/>
