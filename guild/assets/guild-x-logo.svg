  <path d="M235 235 L485 485" stroke-width="48"/>
  <path d="M485 235 L235 485" stroke-width="48"/>
</g>
<g stroke="#fff6bf" stroke-opacity=".58" stroke-linecap="round"><path d="M245 239 L477 471" stroke-width="6"/><path d="M475 239 L243 471" stroke-width="6"/></g>
<circle cx="360" cy="360" r="19" fill="#fff7bd" filter="url(#glow)"/>
<g fill="url(#gold)"><path d="M360 14 373 41 400 54 373 67 360 94 347 67 320 54 347 41Z"/><path d="M360 626 373 653 400 666 373 679 360 706 347 679 320 666 347 653Z"/><path d="M14 360 41 347 54 320 67 347 94 360 67 373 54 400 41 373Z"/><path d="M626 360 653 347 666 320 679 347 706 360 679 373 666 400 653 373Z"/></g>
<g text-anchor="middle"><text x="360" y="610" fill="#f7d77d" font-family="Georgia,serif" font-size="54" font-weight="700" letter-spacing="6">GUILD X</text><text x="360" y="640" fill="#8cffb4" font-family="Arial,sans-serif" font-size="15" letter-spacing="5">MYCLOVER.COM</text></g>
</svg>